name: CI

on:
  # Bez omezení větví se každý push do větve s PR změřil DVAKRÁT — jednou jako
  # `push`, podruhé jako `pull_request`. Půlka běhů byla zbytečná.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    # Repozitář je veřejný, takže hostované runnery jsou zdarma a bez limitu minut.
    # Linux je pro tuhle bránu dost — nic macOS-specifického tu neběží a macOS runner
    # se účtuje 10× dráž, kdyby se repozitář někdy vrátil do privátního režimu.
    #
    # Záloha: na Danově Macu je registrovaný vlastní runner se štítky `self-hosted, macos`.
    # Přepnutí je jednořádkové a hodí se, kdyby hostované runnery vypadly — nebo až se
    # jednou zapnou oba smoke kroky níž, které potřebují GUI, zvuk a oprávnění Záznam
    # obrazovky. Ty runner GitHubu nikdy mít nebude, proto jsou dnes `if: false`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gates
      - run: npm run build

      # Smoke testy jsou v CI záměrně zařazené, ale vypnuté. Potřebují GUI,
      # fyzický zvuk a oprávnění Záznam obrazovky, která runner nemá komu
      # potvrdit. Spouští je člověk na skutečném Macu.
      - name: UI smoke (ruční checkpoint na Macu)
        if: ${{ false }}
        run: node scripts/ui-smoke.mjs
      - name: Audio smoke (ruční checkpoint na Macu)
        if: ${{ false }}
        run: npm run test:audio
