name: CI

on:
  # Bez omezení větví se každý push do větve s PR změřil DVAKRÁT — jednou jako
  # `push`, podruhé jako `pull_request`. Půlka běhů byla zbytečná.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    # Runner macOS se účtuje 10× dráž než Linux a tahle brána na něm nic
    # macOS-specifického nedělá: lint, typecheck, vitest a Vite build jedou
    # na Linuxu stejně. Oba smoke kroky níž jsou v CI vypnuté (`if: false`),
    # protože potřebují GUI, zvuk a oprávnění — ty pouští člověk na svém Macu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gates
      - run: npm run build

      # Smoke testy jsou v CI záměrně zařazené, ale vypnuté. Potřebují GUI,
      # fyzický zvuk a oprávnění Záznam obrazovky, která runner nemá komu
      # potvrdit. Spouští je člověk na skutečném Macu.
      - name: UI smoke (ruční checkpoint na Macu)
        if: ${{ false }}
        run: node scripts/ui-smoke.mjs
      - name: Audio smoke (ruční checkpoint na Macu)
        if: ${{ false }}
        run: npm run test:audio
