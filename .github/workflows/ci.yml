name: CI

on:
  # Bez omezení větví se každý push do větve s PR změřil DVAKRÁT — jednou jako
  # `push`, podruhé jako `pull_request`. Půlka běhů byla zbytečná.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Brána běží na Danově pracovním Macu (viz níž), takže každý překonaný běh mu bere výkon,
# který zároveň měří. Novější push tedy ten starší běh zruší — neoslabuje to žádnou
# kontrolu, jen přestává měřit stav, který už nikoho nezajímá.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # 🔴 Brána NESMÍ běžet na vlastním runneru, dokud je repozitář veřejný. Kdokoli by si
    # udělal fork, přidal soubor do `tests/` a jeho kód by se spustil na tom stroji — a na
    # Danově Macu leží podpisový certifikát firmy, SSH klíče k produkci a dvacet dalších
    # firemních repozitářů. Není to teoretická úvaha: `pull_request` níž nemá omezení
    # a job se zařadí komukoli. Runner `danuv-mac` byl proto 9. 9. 2026 odregistrován.
    #
    # Linux na tuhle bránu stačí — nic macOS-specifického tu neběží. Oba smoke kroky dole,
    # které potřebují GUI, zvuk a oprávnění Záznam obrazovky, jsou vypnuté a spouští je
    # člověk na skutečném Macu; runner GitHubu je mít nikdy nebude.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gates
      - run: npm run build

      # Smoke testy jsou v CI záměrně zařazené, ale vypnuté. Potřebují GUI,
      # fyzický zvuk a oprávnění Záznam obrazovky, která runner nemá komu
      # potvrdit. Spouští je člověk na skutečném Macu.
      - name: UI smoke (ruční checkpoint na Macu)
        if: ${{ false }}
        run: node scripts/ui-smoke.mjs
      - name: Audio smoke (ruční checkpoint na Macu)
        if: ${{ false }}
        run: npm run test:audio
