name: CI

on:
  # Bez omezení větví se každý push do větve s PR změřil DVAKRÁT — jednou jako
  # `push`, podruhé jako `pull_request`. Půlka běhů byla zbytečná.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    # Vlastní runner na Danově Macu. Placené minuty GitHubu nespotřebovává vůbec,
    # takže brána běží i při zastaveném billingu organizace.
    #
    # 🔴 Cena té volby: když je Mac vypnutý, job ČEKÁ ve frontě, nespadne. Návrat
    # na hostovaný runner je jednořádkový (`runs-on: ubuntu-latest`) a vyplatí se
    # ve chvíli, kdy billing zase poběží — Linux je pro tuhle bránu dost, nic
    # macOS-specifického tu neběží.
    #
    # Bonus, který hostovaný runner nikdy mít nebude: oba smoke kroky níž potřebují
    # GUI, zvuk a oprávnění Záznam obrazovky. Na skutečném Macu je jednou zapnout
    # půjde; na runneru GitHubu ne, proto jsou dnes `if: false`.
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gates
      - run: npm run build

      # Smoke testy jsou v CI záměrně zařazené, ale vypnuté. Potřebují GUI,
      # fyzický zvuk a oprávnění Záznam obrazovky, která runner nemá komu
      # potvrdit. Spouští je člověk na skutečném Macu.
      - name: UI smoke (ruční checkpoint na Macu)
        if: ${{ false }}
        run: node scripts/ui-smoke.mjs
      - name: Audio smoke (ruční checkpoint na Macu)
        if: ${{ false }}
        run: npm run test:audio
