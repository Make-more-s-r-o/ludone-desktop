name: Vydání macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ověření tagu a release tajemství
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node <<'NODE'
          const packageJson = require("./package.json");
          const expectedTag = `v${packageJson.version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} neodpovídá verzi ${expectedTag}`);
          }
          const required = [
            "CSC_LINK",
            "CSC_KEY_PASSWORD",
            "APPLE_API_KEY_P8",
            "APPLE_API_KEY_ID",
            "APPLE_API_ISSUER",
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length > 0) {
            throw new Error(`V release prostředí chybí: ${missing.join(", ")}`);
          }
          NODE
      # 🔴 Vlastní výčet bran se tady jednou už rozešel s `ci.yml`: brána
      # `preskocene` přibyla do `npm run gates`, ale do tohoto seznamu ne, takže
      # vydání jelo o jednu kontrolu chudší než každý push. Voláme proto TUTÉŽ
      # bránu; nový výčet se zase rozejde. Hlídá to `tests/brany-workflow.test.js`.
      - run: npm run gates
      - name: Příprava notářského klíče mimo repozitář
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Podepsání, notarizace a publikování DMG + ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release:mac
