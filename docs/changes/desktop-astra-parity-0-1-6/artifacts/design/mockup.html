<!doctype html>
<html lang="cs" data-theme="light" data-scenario="home">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>LuDone Desktop · Nit dne</title>
<link rel="icon" href="assets/brand/LuDone_favicon_32px.png" type="image/png">
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="styles.css?v=a3b584c6b2d7">

</head><body><div id="app"></div><div id="overlay"></div><div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<script>
/* Jeden stav celé lokální simulace. Žádné síťové ani systémové operace. */
'use strict';
const SCENARIOS=['home','working','meeting','save','record-only','day','detail','attention','offline','recovery','settings','update','onboarding','identity'];
const THEMES=['light','professional','dark'];
const PROJECTS=[{id:'sever',name:'Web Studia Sever',company:'Studio Sever',mark:'S'},{id:'interni',name:'Interní rozvoj',company:'Studio Sever',mark:'L'},{id:'jih',name:'Podpora Ateliéru Jih',company:'Ateliér Jih',mark:'J'}];
const ICONS={pulse:'<g transform="scale(.02)" stroke="none"><rect fill="currentColor" x="363.43" y="479.05" width="615.7" height="103.05" transform="translate(-143.27 792.56) rotate(-56.15)"/>    <rect fill="currentColor" x="352.1" y="457.81" width="103.05" height="403.78" transform="translate(-369.09 627.47) rotate(-56.15)"/>    <rect fill="currentColor" x="618.07" y="771.07" width="403.78" height="103.05" transform="translate(-329.27 654.46) rotate(-36.77)"/></g>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>',mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="1" fill="currentColor" stroke="none"/>',play:'<path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',back:'<path d="M19 12H5m5-5-5 5 5 5"/>',check:'<path d="m5 12 4 4 10-10"/>',circlecheck:'<circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-7"/>',record:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>',sound:'<path d="M3 10v4M7 6v12M12 3v18M17 7v10M21 10v4"/>',monitor:'<rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8M12 17v4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/>',external:'<path d="M14 3h7v7m0-7L10 14M10 4H4v16h16v-6"/>',folder:'<path d="M3 6h6l2 3h10v11H3Z"/>',file:'<path d="M5 3h9l5 5v13H5ZM14 3v6h5M9 14h6M9 17h4"/>',trash:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 14 6M4 12a8 8 0 0 0 14 6"/>',alert:'<path d="m12 3 10 18H2Z M12 9v5M12 17v1"/>',wifi:'<path d="M3 8a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0M9 16a4 4 0 0 1 6 0M12 20h.01"/>',offline:'<path d="m3 3 18 18M4 9a13 13 0 0 1 3-2M10 5a14 14 0 0 1 11 3M6 13a9 9 0 0 1 5-2M9 17a4 4 0 0 1 6 0M12 21h.01"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',plus:'<path d="M12 4v16M4 12h16"/>',edit:'<path d="m4 16-1 5 5-1L20 8l-4-4ZM14 6l4 4"/>',link:'<path d="m9 15 6-6M7 10l-3 3a4 4 0 0 0 6 6l3-3M11 8l3-3a4 4 0 0 1 6 6l-3 3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5"/>',keyboard:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h1m3 0h1m3 0h1m3 0h1M6 13h1m3 0h1m3 0h1m3 0h1M7 16h10"/>'};
const icon=(name,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.pulse}</svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,kind='',ic='',extra='')=>`<button class="${kind}" data-action="${action}" ${extra}>${ic?icon(ic):''}${label}</button>`;
const ib=(label,action,ic)=>btn('',action,'icon-button ghost',ic,`aria-label="${label}" title="${label}"`);
const project=id=>PROJECTS.find(p=>p.id===id)||PROJECTS[0];
const mm=s=>`${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
const endTime=t=>{const [h,m]=t.started.split(':').map(Number);const minutes=h*60+m+Math.floor(t.seconds/60);return `${Math.floor(minutes/60)%24}:${String(minutes%60).padStart(2,'0')}`;};
const hm=s=>`${Math.floor(s/3600)} h ${Math.floor(s%3600/60).toString().padStart(2,'0')} min`;
let S,modal=null,toast='',focusReturn=null,lastTick=Date.now();
function initial(scenario,theme){
 const working=['working','meeting','save','offline','update'].includes(scenario),recording=['meeting','record-only','offline','update'].includes(scenario);
 const state={scenario,theme,view:'now',open:true,online:scenario!=='offline',auth:true,company:'Studio Sever',project:'sever',description:'Příprava obsahu',track:working?{id:'t-live',project:'sever',description:'Příprava obsahu',seconds:1920,started:'10:00'}:null,recording:recording?{id:'r-live',title:'Týdenní domluva',seconds:754,company:'Studio Sever',owner:'Alex Novák',links:working?['t-live']:[],sourceGap:false,auto:false}:null,pending:null,selected:'r1',filter:'all',source:{mic:true,system:true},settings:{auto:false,dock:true,launch:true,retention:'7'},update:'available',updateHidden:true,notification:false,version:'0.1.4',onboard:1,recovery:false,recoveryChoice:'checkpoint',next:10,entries:[{id:'t1',project:'sever',description:'Příprava obsahu',seconds:3000,started:'08:35',ended:'09:25',status:'confirmed'},{id:'t2',project:'interni',description:'Interní rozvoj',seconds:2100,started:'09:25',ended:'10:00',status:'confirmed'}],records:[{id:'r1',title:'Týdenní domluva',seconds:754,size:'9,2',company:'Studio Sever',owner:'Alex Novák',status:'verified',links:['t1'],at:'09:05',sourceGap:false},{id:'r2',title:'Návrh webu',seconds:368,size:'4,5',company:'Studio Sever',owner:'Alex Novák',status:'local',links:[],at:'09:30',sourceGap:false},{id:'r3',title:'Kontrola rozpočtu',seconds:522,size:'6,4',company:'Studio Sever',owner:'Alex Novák',status:'auth',links:[],at:'09:45',sourceGap:false}]};
 if(scenario==='save')state.pending={id:'r-new',title:'Týdenní domluva',seconds:754,size:'9,2',company:'Studio Sever',owner:'Alex Novák',links:['t-live'],at:'10:20',status:'local',sourceGap:false};
 if(['day','detail','settings','identity'].includes(scenario))state.view=scenario;
 if(scenario==='attention'){state.view='detail';state.selected='r2';state.records[1].company='';state.records[1].status='error';}
 if(scenario==='offline')state.entries[1].status='queued';
 if(scenario==='recovery'){state.view='recovery';state.recovery=true;state.recovered={id:'t-recovered',project:'sever',description:'Příprava obsahu',seconds:1920,started:'17:00'};state.records[1].status='queued';}
 if(scenario==='update'){state.updateHidden=false;state.view='update';state.notification=true;state.notified=true;}
 if(scenario==='onboarding'){state.view='onboarding';state.auth=false;state.source={mic:false,system:false};}
 return state;
}
function seed(scenario='home',theme='light'){S=initial(scenario,theme);modal=null;toast='';lastTick=Date.now();render();}
function statusLabel(status){return {local:'Uloženo na Macu',queued:'Ve frontě',sent:'Odesláno',verified:'Ověřeno v LuDone',auth:'Obnovte přihlášení',error:'Odeslání selhalo',limit:'Čeká na limit serveru',owner:'Potvrďte vlastníka',quota:'Server nemá místo'}[status]||status;}
function statusIcon(status){return {local:'folder',queued:'clock',sent:'upload',verified:'circlecheck',auth:'alert',error:'alert',limit:'clock',owner:'user',quota:'alert'}[status]||'clock';}
function badge(status){return `<span class="pill ${status==='verified'?'green':['auth','error','owner','quota'].includes(status)?'warning':'muted'}">${icon(statusIcon(status))}${statusLabel(status)}</span>`;}
function timeBadge(status){return `<span class="pill ${status==='confirmed'?'green':['error','review'].includes(status)?'warning':'muted'}">${icon(status==='confirmed'?'check':['error','review'].includes(status)?'alert':'clock')}${{confirmed:'Potvrzeno serverem',queued:'Čeká na synchronizaci',error:'Vyžaduje zásah',review:'Vyžaduje zásah · místní kontrola'}[status]}</span>`;}
function trayGlyph(mode){return `<svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="scale(.014)" stroke="none"><rect fill="currentColor" x="363.43" y="479.05" width="615.7" height="103.05" transform="translate(-143.27 792.56) rotate(-56.15)"/>    <rect fill="currentColor" x="352.1" y="457.81" width="103.05" height="403.78" transform="translate(-369.09 627.47) rotate(-56.15)"/>    <rect fill="currentColor" x="618.07" y="771.07" width="403.78" height="103.05" transform="translate(-329.27 654.46) rotate(-36.77)"/></g>${mode==='time'?'<circle cx="13" cy="13" r="3.4"/><path d="M13 11v2l1 1"/>':mode==='audio'?'<circle cx="13.5" cy="13.5" r="3" fill="currentColor" stroke="none"/>':mode==='both'?'<path d="M10 14h2M11 13v2"/><circle cx="15.5" cy="14" r="2" fill="currentColor" stroke="none"/>':mode==='attention'?'<path d="M15 10v4M15 16h.01"/>':''}</svg>`;}
function mode(){return !S.auth||(S.view==='detail'&&['auth','error','owner','quota'].includes(currentRecord()?.status))||!S.online||!S.source.mic||!S.source.system||S.recovery?'attention':S.track&&S.recording?'both':S.track?'time':S.recording?'audio':'idle';}
function announce(text){document.querySelector('#announcer').textContent=text;}
function notify(text){toast=text;announce(text);}
function nav(view){S.view=view;S.open=true;modal=null;render();}
function projectButton(){const p=project(S.project);return `<button class="project" data-action="projects"><span class="project-symbol">${p.mark}</span><span class="grow"><strong>${p.name}</strong><small>${p.company}</small></span>${icon('down')}</button>`;}
function sourceRows(){return ['mic','system'].map((key,i)=>`<div class="source-row ${S.source[key]?'':'lost'}">${icon(key==='mic'?'mic':'monitor')}<span>${key==='mic'?'Mikrofon MacBooku':'Systémový zvuk'}</span><span class="source-end">${S.recording?`<span class="meter" aria-hidden="true">${[5,10,7,15,9,12,6,10].map((n,j)=>`<i style="--bar:${(n+i*2+j%3)%15+3}px"></i>`).join('')}</span>`:''}${S.source[key]?(S.recording?'Zachycuje':'Připraveno'):'Chybí'}</span></div>`).join('');}
function recordingContext(){if(!S.recording)return '';return `<div class="notice">Nahrávka zůstává ve firmě <strong>${esc(S.recording.company||'Bez firmy')}</strong>. Změna práce nepřesměruje zvuk ani odeslání.</div>`;}
function runningContext(){if(!S.track)return '';return `<section class="running-context"><div class="row between"><span class="pill green">${icon('clock')}Práce pokračuje</span><strong class="num" data-time="track">${mm(S.track.seconds)}</strong></div><div class="context-line"><div class="row between"><span class="small strong">${esc(project(S.track.project).name)}</span>${btn('Zastavit čas','stop-time','ghost','','aria-label="Zastavit pouze čas"')}</div><div class="row between"><span class="small muted">${esc(S.track.description)}</span>${btn('Změnit','projects','ghost','')}</div></div></section>`;}
function attentionBanner(){return !S.online?`<div class="notice"><strong>Bez sítě. Obojí se uchovává na Macu.</strong><br>Synchronizace a odesílání počkají.${btn('Zkusit připojení','online','ghost','refresh')}</div>`:!S.auth?`<div class="notice">Přihlášení vypršelo. Běžící činnosti můžete bezpečně dokončit.${btn('Obnovit přihlášení','login','ghost','user')}</div>`:'';}
function renderNow(){
 if(S.pending)return renderSave();
 if(S.recording){const r=S.recording;return `${attentionBanner()}<section class="record-hero"><div class="row between"><span class="eyebrow red"><span class="live-dot"></span> Nahrává se</span>${btn('Zdroje','sources','ghost','settings')}</div><h1 class="timer-title">${esc(r.title)}</h1><div class="time" data-time="recording">${mm(r.seconds)}</div><div class="row between small muted"><span>${esc(r.company||'Bez cílové firmy')}</span><span>Jen na tomto Macu</span></div><div class="divider"></div>${sourceRows()}${!S.source.system||!S.source.mic?`<div class="notice error">${!S.source.system?'Systémový zvuk':'Mikrofon'} vypadl. Tato část schůzky chybí.${btn('Opravit zdroje','sources','ghost','refresh')}</div>`:''}<div class="actions">${btn('Zastavit zvuk a uložit','stop-record','primary full','stop')}</div><p class="hint">${S.track?'Měření práce bude pokračovat.':'Čas práce se neměří.'}</p></section>${S.track?runningContext():`<section class="running-context"><div class="row"><span class="grow small">${icon('clock')} Čas práce neběží</span>${btn('Začít práci','start-work-form','ghost','plus')}</div></section>`}${recentBlock()}`;}
 if(S.track){return `${attentionBanner()}<section class="hero"><div class="row between"><span class="eyebrow green">${icon('clock')} Běží místně</span>${ib('Upravit popis práce','edit-description','edit')}</div><h1 class="timer-title">${esc(S.track.description)}</h1><div class="time" data-time="track">${mm(S.track.seconds)}</div><div class="row between small"><span>${esc(project(S.track.project).name)}</span>${btn('Změnit práci','projects','ghost','down')}</div><p class="hint">Z alokace zbývá 18 h 40 min</p><div class="actions">${btn('Zastavit čas','stop-time','primary','stop')}</div><p class="hint">Po zastavení odešleme úsek k synchronizaci.</p></section>${recordStrip()}${recentBlock()}`;}
 return `${attentionBanner()}<section class="hero"><div class="eyebrow">Středa 23. září</div><div class="space"></div><h1>Vraťte se<br>k rozdělanému.</h1><p class="subhead">Pokračujte tam, kde jste skončili.</p>${projectButton()}<div class="field"><label for="description">Na čem budete pracovat</label><input id="description" data-field="description" value="${esc(S.description)}" maxlength="120"></div><div class="actions">${btn('Začít práci','start-time','primary','play')}</div></section>${recordStrip()}${recentBlock()}`;
}
function recordStrip(){return `<section class="record-strip"><div class="row"><div class="grow"><div class="label">${icon('record')} Zachytit schůzku</div><p class="hint">Mikrofon + systémový zvuk</p></div>${btn('Nahrát','start-record','','record')}</div><div class="row between" style="margin-top:8px"><span class="tiny muted">${S.settings.auto?'Nové: automaticky odeslat do '+esc(S.company):'Po stopu vyberete, kam nahrávku uložit.'}</span>${ib('Zkontrolovat zdroje zvuku','sources','settings')}</div></section>`;}
function recentBlock(){const e=S.entries[S.entries.length-1],pending=S.records.filter(r=>['auth','error','queued','limit','owner','quota'].includes(r.status)).length;return `<section class="recent"><div class="row between"><span class="eyebrow">Dnes dokončeno</span><strong class="small num">${hm(S.entries.reduce((n,e)=>n+e.seconds,0))}</strong></div>${e?`<button class="recent-row" data-action="resume:${e.id}" ${S.track?'disabled title="Nejdřív zastavte nebo změňte běžící práci"':''}>${icon('play')}<span class="grow"><span>${esc(e.description)}</span><br><span class="tiny muted">${esc(project(e.project).name)}</span></span><span class="tiny muted">Pokračovat</span></button>`:''}<button class="recent-row" data-action="day">${icon('link')}<span class="grow">Celý den a nahrávky</span><span class="tiny muted">${pending?pending+' k dořešení':''}</span>${icon('chevron')}</button></section>`;}
function companySelect(value,field='company'){return `<select id="${field}" data-field="${field}" aria-label="Cílová firma nahrávky"><option value="">Vyberte firmu</option><option ${value==='Studio Sever'?'selected':''}>Studio Sever</option><option ${value==='Ateliér Jih'?'selected':''}>Ateliér Jih</option></select>`;}
function renderSave(){const r=S.pending;return `${runningContext()}<section class="section"><div class="eyebrow green">${icon('check')} Zvuk bezpečně zastaven</div><div class="space"></div><h1>Kam s nahrávkou?</h1><div class="file-preview">${icon('file')}<div class="grow"><strong class="small">${mm(r.seconds)} · ${r.size} MB</strong><div class="tiny muted">Mikrofon + systém · jeden soubor</div></div></div><label for="record-title">Název nahrávky</label><input id="record-title" data-field="record-title" value="${esc(r.title)}" maxlength="120"><div class="field"><label for="record-company">Cílová firma</label>${companySelect(r.company,'record-company')}<p class="hint">Firma nahrávky je nezávislá na projektu práce.</p></div>${!S.auth?`<div class="space"></div><div class="notice">Před odesláním obnovte přihlášení.${btn('Obnovit přihlášení','login','ghost','user')}</div>`:''}${!r.company?'<p class="hint warning">Pro odeslání vyberte cílovou firmu. Uložit na Mac lze i bez ní.</p>':''}${!S.online?'<p class="hint warning">Bez sítě: odeslání zůstane ve frontě.</p>':''}${r.sourceGap?'<div class="notice error">Ve zvuku je výpadek zdroje. Uložení zachová vše, co se podařilo zachytit.</div>':''}<div class="actions stack">${btn('Uložit a odeslat','save-send','primary','upload')}${btn('Nechat na Macu','save-local','','folder')}</div><p class="hint">${S.settings.auto?'Automatika byla pro tento záznam zvolená při startu. Název můžete doplnit později.':'Nahrávka už je místně zachovaná. Odesílání začne jen vaší volbou.'}</p></section>`;}
function dayTimeEntry(e){return `<div class="day-entry"><span class="at">${esc(e.started)}</span><i class="node"></i><div class="entry-body"><div class="row between"><h3>${esc(e.description)}</h3><span class="small num">${hm(e.seconds)}</span></div><p class="small muted">${esc(project(e.project).name)} · ${esc(e.started)}–${esc(e.ended)}</p><div class="row between" style="margin-top:9px">${timeBadge(e.status)}${!S.track?btn('Pokračovat','resume:'+e.id,'linkbtn','play'):''}</div>${e.status==='queued'?btn('Synchronizovat úsek','sync:'+e.id,'linkbtn','refresh'):e.status==='error'?btn('Vyřešit ve výkazu','web:time-error','linkbtn','external'):e.status==='review'?btn('Zkontrolovat rozpracovaný čas','web:time-review','linkbtn','external'):''}${S.filter==='all'?S.records.filter(r=>r.links.includes(e.id)).map(recordRow).join(''):''}</div></div>`;}
function renderDay(){
 const total=S.entries.reduce((n,e)=>n+e.seconds,0);
 const events=[...(S.filter!=='records'?S.entries.map(e=>({time:e.started,html:dayTimeEntry(e)})):[]),...(S.filter!=='time'?S.records.filter(r=>S.filter==='records'||!r.links.some(id=>S.entries.some(e=>e.id===id))).map(r=>({time:r.at,html:`<div class="day-entry"><span class="at">${r.at}</span><i class="node"></i><div class="entry-body">${recordRow(r)}</div></div>`})):[])].sort((a,b)=>b.time.localeCompare(a.time));
 return `<div class="summary"><div class="grow"><div class="eyebrow">Středa 23. září</div><h1>Stopa dne</h1><p class="small muted">Práce a schůzky v souvislostech.</p></div><div><div class="total num">${hm(total)}</div><div class="tiny muted">dokončené úseky${S.track?' + běžící čas':''}</div></div></div><div class="subnav">${btn('Vše','filter:all',S.filter==='all'?'selected':'ghost')}${btn('Práce','filter:time',S.filter==='time'?'selected':'ghost')}${btn('Nahrávky','filter:records',S.filter==='records'?'selected':'ghost')}<span class="grow"></span>${ib('Obnovit přehled','refresh','refresh')}</div><div class="day-list">${S.track&&S.filter!=='records'?`<div class="day-entry"><span class="at">Teď</span><i class="node"></i><div class="entry-body"><div class="row between"><h3>${esc(S.track.description)}</h3><span class="green num" data-time="track">${mm(S.track.seconds)}</span></div><p class="small muted">${esc(project(S.track.project).name)} · běží místně</p>${S.recording?`<div class="linked-record">${icon('record')}<div class="grow"><strong class="small">${esc(S.recording.title)}</strong><div class="tiny red">Nahrává se · ${mm(S.recording.seconds)}</div></div>${btn('Ovládat','now','ghost','chevron')}</div>`:btn('Zpět k práci','now','linkbtn')}</div></div>`:''}${events.map(e=>e.html).join('')}${S.note?`<div class="notice good"><strong>Poznámka k práci</strong><p>${esc(S.note)}</p></div>`:''}</div><div class="section"><div class="row between"><div><strong class="small">Zapomenutý čas nebo týdenní výkaz?</strong><p class="hint">Přidání, opravy a uzávěrka patří do LuTracku na webu.</p></div>${btn('Otevřít výkaz','web:time','','external')}</div></div>`;
}
function recordRow(r){return `<div class="linked-record">${icon('sound')}<div class="grow"><button class="linkbtn strong" data-action="detail:${r.id}">${esc(r.title)}</button><div class="tiny muted">${mm(r.seconds)} · ${esc(r.company||'Bez firmy')}</div><div style="margin-top:4px">${badge(r.status)}</div></div>${ib('Detail nahrávky '+r.title,'detail:'+r.id,'chevron')}</div>`;}
function currentRecord(){return S.records.find(r=>r.id===S.selected);}
function renderDetail(){const r=currentRecord();if(!r)return '<div class="section">Nahrávka už není na tomto Macu.</div>';const stage={local:0,queued:1,sent:2,verified:3}[r.status]??0;return `<div class="detail-head"><div class="row between">${btn('Zpět na den','day','ghost','back')}<span class="small muted">Dnes · ${r.at}</span></div><h1>${esc(r.title)}</h1><div class="row between"><span class="small muted">${mm(r.seconds)} · ${r.size} MB · jeden soubor</span>${ib('Přejmenovat nahrávku','rename','edit')}</div><div class="journey">${['Na Macu','Ve frontě','Odesláno','Ověřeno'].map((label,i)=>`<div class="journey-step ${i<=stage?'done':''}">${icon(i<=stage?'circlecheck':'clock')}${label}</div>`).join('')}</div>${recordIssue(r)}<div class="detail-body"><div class="row between"><h2>Uložení a přístup</h2>${badge(r.status)}</div><dl class="definition"><dt>Cílová firma</dt><dd>${esc(r.company||'Není vybraná')} ${stage<2?btn('Změnit','record-company-dialog','linkbtn','edit'):''}</dd><dt>Vlastník</dt><dd>${esc(r.owner)}${r.status==='owner'?' · převzetí nepotvrzeno':''}</dd><dt>Zvuk</dt><dd>Mikrofon + systémový zvuk${r.sourceGap?'<p class="warning">Část záznamu má výpadek zdroje.</p>':''}</dd><dt>Lokální kopie</dt><dd>${stage===3?'Retence: '+S.settings.retention+' dní po ověření':'Zachována do ověření v LuDone'}</dd></dl>${r.links.length?`<div class="notice good"><div class="row">${icon('link')}<strong>Součást pracovního kontextu</strong></div><p style="margin-top:6px">${r.links.map(id=>{const t=S.entries.find(e=>e.id===id)||(S.track?.id===id?S.track:null);return t?esc(project(t.project).name)+' · '+esc(t.description):'Příprava obsahu';}).join('<br>')}</p><p class="hint">Vazba nepřidává minuty do výkazu.</p>${btn('Zobrazit v mém dni','day','ghost','arrow')}</div>`:'<p class="small muted">Samostatná nahrávka. Nevytvořila žádný časový úsek.</p>'}<div class="actions">${stage<2?(r.status==='queued'?btn('Obnovit stav přenosu','refresh','primary','refresh'):btn(['error','auth','limit'].includes(r.status)?'Zkusit znovu':'Odeslat do LuDone','send-record','primary','upload')):stage===2?btn('Ověřit v LuDone','verify','primary','circlecheck'):btn('Přepis a analýza v LuDone','web:record','primary','external')}</div><div class="actions">${btn('Ukázat ve Finderu','finder','','folder')}${btn('Přesunout do koše','trash-dialog','ghost red','trash')}</div><p class="hint">Přepis, analýza a týmový archiv jsou v LuDone na webu.</p></div>`;}
function recordIssue(r){let title='',body='',action='';if(!r.company){title='Vyberte cílovou firmu';body='Nahrávka je bezpečně na Macu. Volba firmy ji sama neodešle.';action=btn('Vybrat firmu','record-company-dialog','ghost','plus');}else if(r.status==='auth'){title='Přihlášení vypršelo';body='Kontrola rozpočtu zůstává na Macu. Po přihlášení potvrďte odeslání této položky.';action=btn('Obnovit přihlášení','login','ghost','user');}else if(r.status==='owner'){title='Nahrávka patří jinému účtu';body='Původní vlastník: Petra Malá. Převezměte ji jen pokud s ní smíte pracovat.';action=btn('Převzít tuto nahrávku','owner-dialog','ghost','user');}else if(r.status==='limit'){title='Server požádal o čekání';body='Další pokus nejdříve ve 10:45. Limit neubírá počet pokusů. Nahrávka zůstává na Macu.';action=btn('V simulaci uplynul limit','limit-elapsed','ghost','clock');}else if(r.status==='quota'){title='Na serveru není místo';body='Opakování nepomůže. Lokální kopii zachováme; správu úložiště otevřete v LuDone.';action=btn('Otevřít správu úložiště','web:storage','ghost','external');}else if(r.status==='error'){title='Odeslání se nepodařilo';body='Spojení skončilo před potvrzením. Stejnou nahrávku můžete bezpečně zkusit znovu.';}else if(r.status==='queued'){title=S.online?'Připraveno k odeslání':'Čeká na připojení';body='Soubor je stále na Macu. Zařazení do fronty ještě není výsledek serveru.';}else if(r.status==='sent'){title='Přenos dokončen';body='Server přijal soubor. Ještě ověřte, že je nahrávka dostupná v LuDone.';}
return title?`<div class="section compact"><div class="notice"><strong>${title}</strong><p>${body}</p>${action}</div></div>`:'';}
function switchSetting(key,label,hint){return `<div class="setting-row"><div><label id="label-${key}">${label}</label><p class="hint">${hint}</p></div><button class="switch" role="switch" aria-checked="${S.settings[key]}" aria-labelledby="label-${key}" data-action="toggle:${key}"></button></div>`;}
function renderSettings(){return `<div class="settings"><h1>Nastavení</h1><h2>Váš účet a nové nahrávky</h2><div class="setting-row"><div><strong>Alex Novák</strong><p class="hint">${S.auth?'Přihlášený fiktivní účet':'Přihlášení vypršelo'}</p></div>${btn(S.auth?'Odhlásit':'Přihlásit',S.auth?'logout-dialog':'login','ghost','user')}</div><div class="setting-row"><div><label for="default-company">Výchozí cílová firma</label><p class="hint">Pouze pro nové nahrávky. Staré položky se nepřesunou.</p></div>${companySelect(S.company,'default-company')}</div>${switchSetting('auto','Nové nahrávky odesílat automaticky','Po zastavení nové nahrávky, do firmy viditelné při startu. Stávající čekající nahrávky se neodešlou.')}<h2>Zvuk</h2>${sourceRows()}${btn('Zdroje a oprávnění','sources','','settings')}<h2>Na tomto Macu</h2>${switchSetting('dock','Zobrazovat v Docku','Záchrana, když ikonu v liště překryje výřez displeje.')}${switchSetting('launch','Spouštět při přihlášení','Otevře LuDone. Samo nezačne práci ani nahrávání.')}<div class="setting-row"><div><label for="retention">Retence lokálních kopií</label><p class="hint">Teprve po ověření v LuDone. Neodeslané kopie zachováme.</p></div><select id="retention" data-field="retention"><option value="7" ${S.settings.retention==='7'?'selected':''}>7 dní</option><option value="30" ${S.settings.retention==='30'?'selected':''}>30 dní</option><option value="∞" ${S.settings.retention==='∞'?'selected':''}>Ponechat</option></select></div><h2>Vzhled</h2><div class="theme-choices">${THEMES.map((t,i)=>btn(['Světlý','Professional','Tmavý'][i],'theme:'+t,'','',`aria-pressed="${S.theme===t}"`)).join('')}</div><h2>LuDone Desktop ${S.version}</h2><div class="row wrap">${btn('Zkontrolovat aktualizace','check-update','','refresh')}${btn('Export diagnostiky','diagnostics','','download')}${btn('Identita aplikace','identity','ghost','pulse')}</div><p class="hint">Diagnostika obsahuje stavy a verzi. Žádný zvuk, názvy schůzek ani přihlašovací údaje.</p></div>`;}
function renderUpdate(){const busy=!!S.track||!!S.recording||!!S.pending;return `${S.notification?`<div class="notification"><img src="assets/brand/LuDone-icon-iOS-Default-1024x1024@1x.png" alt=""><div class="grow"><div class="tiny strong">LUDONE DESKTOP · NYNÍ</div><p>Je připravená verze 0.1.5.<br>Práce a schůzky na jednom místě.</p><div class="row" style="margin-top:7px">${btn('Zobrazit','dismiss-notification','ghost')}${btn('Později','defer-update','ghost')}</div></div></div>`:''}<section class="section"><div class="eyebrow">Aktualizace aplikace</div><div class="version">${S.version==='0.1.5'?'0.1.5':'0.1.4 → 0.1.5'}</div><h1 style="font-size:24px">Práce a schůzky<br>na jednom místě.</h1><p class="hint">Společný den, rychlejší přepnutí projektu a přehlednější odesílání nahrávek.</p><div class="divider"></div>${S.update==='installed'?'<div class="notice good">Simulovaný restart dokončen. Používáte 0.1.5.</div>':`<div class="notice ${busy?'':'good'}"><strong>${S.update==='prepared'?'Aktualizace je připravená':busy?'Teď vás nepřerušíme':'Vše je bezpečně dokončené'}</strong><p>${busy?'Instalace čeká, až zastavíte čas, zvuk a dokončíte uložení.':'Čas i zvuk jsou zastavené. Žádná nahrávka není rozpracovaná.'}</p><p>Restart proběhne až po vašem kliknutí na „Aktualizovat a restartovat“.</p></div><div class="actions stack">${S.update==='prepared'?btn('Aktualizovat a restartovat','install-update','primary','refresh',busy?'disabled aria-describedby="update-wait"':''):btn('Připravit aktualizaci','prepare-update','primary','download')}${btn('Později','defer-update','ghost')}</div>${busy?'<p id="update-wait" class="hint">Nejdřív dokončete běžící činnosti. Samy se nezastaví.</p>':''}`}</section>${S.track||S.recording?`<section class="compact"><div class="row between small"><span>${S.track?'Práce '+mm(S.track.seconds):''} ${S.recording?'· Zvuk '+mm(S.recording.seconds):''}</span>${btn('Zpět k činnostem','now','ghost','arrow')}</div></section>`:''}`;}
function renderRecovery(){const t=S.recovered;if(!t)return '<section class="recovery"><h1>Žádný rozpracovaný čas</h1><p>Místní nahrávky najdete v Mém dni.</p></section>';return `<section class="recovery"><span class="pill warning">${icon('alert')} Návrat po restartu</span><h1>Kde práce skončila?</h1><p class="small muted">Poslední místní bod je ${S.scenario==='recovery'?'ze včerejška':'před restartem'} v ${endTime(t)}. Dobu do dnešního spuštění nepřičítáme.</p><div class="file-preview">${icon('clock')}<div><strong>${esc(t.description)} · ${hm(t.seconds)}</strong><p class="tiny muted">${esc(project(t.project).name)} · ${t.started}–${endTime(t)}</p></div></div><label class="radio-row"><input type="radio" name="recovery" data-field="recovery-choice" value="checkpoint" ${S.recoveryChoice==='checkpoint'?'checked':''}><span>Uložit pouze ${hm(t.seconds)}<br><span class="muted">Zařadit k synchronizaci; dál zatím neměřit.</span></span></label><label class="radio-row"><input type="radio" name="recovery" data-field="recovery-choice" value="review" ${S.recoveryChoice==='review'?'checked':''}><span>Nejdřív zkontrolovat na webu<br><span class="muted">Místní úsek zachováme jako nevyřešený.</span></span></label><div class="actions">${btn('Potvrdit rozhodnutí','resolve-recovery','primary','check')}</div><div class="divider"></div><h3>Čekající nahrávka je v bezpečí</h3><p class="hint">Návrh webu · 6:08 · 4,5 MB<br>Odeslání vyžádá samostatné potvrzení v detailu.</p>${btn('Zkontrolovat nahrávku','detail:r2','ghost','arrow')}</section>`;}
function renderOnboarding(){return `<section class="hero"><div class="steps"><span class="active"></span><span class="${S.onboard>1?'active':''}"></span></div><div class="onboard-mark">${icon('pulse')}</div>${S.onboard===1?`<h1>Váš pracovní den.<br>O kousek jednodušší.</h1><p class="subhead">Začněte práci nebo zachyťte schůzku. LuDone zůstane po ruce v liště vašeho Macu.</p><div class="space"></div><div class="actions stack">${btn('Přihlásit přes LuDone','onboard-login','primary','external')}${btn('Začít místním nahráváním','onboard-local','ghost')}</div><p class="hint">V návrhu otevřeme místní simulaci přihlášení. Žádný účet se nepřipojuje.</p>`:`<h1>Připraveno<br>zachytit obě strany.</h1><p class="subhead">Zvuk potřebuje oprávnění macOS. Pro samotné měření času je můžete vynechat.</p><div class="divider"></div>${sourceRows()}<div class="actions stack">${btn(S.source.mic?'Mikrofon povolen':'Povolit mikrofon','permission:mic',S.source.mic?'':'primary','mic')}${btn(S.source.system?'Systémový zvuk povolen':'Povolit systémový zvuk','permission:system','','monitor')}</div><div class="divider"></div>${btn('Přejít k práci','onboard-done','primary full','arrow')}<p class="hint">${S.auth?'Alex Novák · Studio Sever':'Místní režim · přihlásíte se až před odesláním'}</p>`}</section>`;}
function renderIdentity(){const modes=['idle','time','audio','both','attention'],names=['Připraveno','Čas · 32:00','Zvuk · 12:34','Čas + zvuk · 32:00 / 12:34','Vyžaduje pozornost'];return `<section class="settings"><div class="eyebrow">LuDone na Macu</div><div class="space"></div><h1>Jedna značka. Jasný stav.</h1><p class="hint">Tvar je čitelný i bez barvy. Čas v liště je volitelný; oba běhy rozlišíme i při zavřeném panelu.</p><div class="identity-bars">${['lightbar','darkbar'].map(t=>`<div class="${t}">${modes.map((m,i)=>`<div class="identity-row">${trayGlyph(m)}<span>${names[i]}</span></div>`).join('')}</div>`).join('')}</div><h2>Dock a Finder</h2><div class="identity-options"><div class="identity-option"><div class="identity-option-icon"><img src="assets/brand/LuDone-icon-iOS-Default-1024x1024@1x.png" width="64" height="64" alt="Původní ikona LuDone"></div><div><strong>LuDone</strong><p class="tiny muted">Původní ikona beze změny. Vedle ní označení LuDone Desktop.</p></div></div><div class="identity-option"><div class="identity-option-icon desktop-accent"><img src="assets/brand/LuDone-icon-iOS-Default-1024x1024@1x.png" width="64" height="64" alt="Původní ikona LuDone s malým odznakem Desktop"><span class="desktop-badge" aria-hidden="true">D</span></div><div><strong>LuDone Desktop</strong><p class="tiny muted">Stejná značka, pouze malý rohový odznak. Tahy původního symbolu zůstávají nedotčené.</p></div></div></div><p class="hint">Doporučení: původní ikona. Název vedle ní rozliší aplikaci bez ztráty čitelnosti v 16 px; odznak je volba pro větší velikosti.</p><h3>Současná ikona v měřítku</h3><div class="icon-grid">${[16,32,64,128].map(n=>`<figure><img src="assets/brand/LuDone-icon-iOS-Default-1024x1024@1x.png" width="${n}" height="${n}" alt="Ikona LuDone ${n} pixelů"><figcaption>${n} px</figcaption></figure>`).join('')}</div><div class="notice good">Aktuální symbol LuDone je společný znak aplikace, lišty a oznámení. Dock otevírá den; ikona v liště rychlý panel.</div><div class="actions">${btn('Vyzkoušet zavřený panel','close-panel','','pulse')}${btn('Nastavení Docku','settings','ghost','settings')}</div><p class="hint">Lokální simulace. HTML nemění systémovou lištu, Dock ani oprávnění Macu.</p></section>`;}
function render(){document.documentElement.dataset.scenario=S.scenario;document.documentElement.dataset.theme=S.theme;const wide=['day','detail','settings','identity'].includes(S.view);document.body.className=wide?'window':'panel';const width=wide?640:400,height=wide?744:700;const views={now:renderNow,day:renderDay,detail:renderDetail,settings:renderSettings,update:renderUpdate,recovery:renderRecovery,onboarding:renderOnboarding,identity:renderIdentity};
 document.querySelector('#app').innerHTML=`<div class="menubar"><span>LuDone Desktop</span><button class="tray" data-action="open-panel" aria-label="Otevřít rychlý panel · ${mode()}">${trayGlyph(mode())}<span data-tray-time>${S.track?mm(S.track.seconds):''}${S.track&&S.recording?' / ':''}${S.recording?mm(S.recording.seconds):''}</span></button><span>St 10:32</span></div>${S.open?`<main class="shell"><header class="titlebar"><div class="traffic">${btn('×','close-panel','','','aria-label="Zavřít panel, činnosti pokračují"')}<span class="dot"></span><span class="dot"></span></div><span class="brand">${icon('pulse')}LuDone</span>${ib('Rychlé akce · Command K','commands','keyboard')}</header><nav aria-label="Navigace aplikace">${btn('Teď','now','','',S.view==='now'?'aria-current="page"':'')}${btn('Můj den','day','','',['day','detail'].includes(S.view)?'aria-current="page"':'')}${btn('Nastavení','settings','nav-end','',S.view==='settings'?'aria-current="page"':'')}</nav>${toast?`<div class="toast" role="status">${icon('check')}<span class="grow">${esc(toast)}</span>${ib('Skrýt zprávu','dismiss-toast','close')}</div>`:''}${!S.updateHidden&&S.view!=='update'?`<div class="update-strip"><span class="grow">${S.update==='prepared'?'0.1.5 připravena · restart čeká na vás':'0.1.5 · Práce a schůzky na jednom místě'}</span>${btn('Zobrazit','update','ghost')}</div>`:''}${S.recovery&&S.view!=='recovery'?`<div class="update-strip"><span class="grow warning">Rozpracovaný čas čeká na rozhodnutí</span>${btn('Vyřešit','recovery','ghost')}</div>`:''}<div class="content">${(views[S.view]||renderNow)()}</div><footer class="footer"><span class="row gap6">${icon(S.online?'wifi':'offline')} ${S.online?'Připojeno':'Bez sítě'}</span>${btn('Návrh · simulace','simulation','ghost')}${ib('Identita aplikace','identity','pulse')}</footer></main>`:`<div class="closed"><img src="assets/brand/LuDone-icon-iOS-Default-1024x1024@1x.png" alt="LuDone"><h1>LuDone zůstává v liště.</h1><p>${S.track?'Měření práce běží dál. ':''}${S.recording?'Zvuk se dál nahrává.':''}${!S.track&&!S.recording?'Až budete potřebovat, je po ruce.':''}</p>${btn('Otevřít rychlý panel','open-panel','primary','pulse')}${S.settings.dock?`<div>${btn('Otevřít den z Docku','day','ghost')}</div>`:''}</div>`}`;
 renderModal();if(window.parent!==window)window.parent.postMessage({type:'ludone-experience:state',scenario:S.scenario,theme:S.theme,view:S.view,width,height},location.origin==='null'?'*':location.origin);
}
function openModal(type,data={}){focusReturn=document.activeElement?.dataset.action;modal={type,...data};renderModal();}
function closeModal(){modal=null;renderModal();if(focusReturn)document.querySelector(`[data-action="${CSS.escape(focusReturn)}"]`)?.focus();}
function renderModal(){const host=document.querySelector('#overlay');if(!modal){host.innerHTML='';return;}let title='',body='';const r=currentRecord();switch(modal.type){
 case 'projects':title=S.track?'Změnit práci':'Vybrat projekt';body=`${S.track?'<p class="small muted">Přepnutí ukončí současný úsek a začne nový. Oba zůstanou ve vašem dni.</p>':''}${recordingContext()}<div class="field"><label for="project-query">Hledat v přidělených projektech</label><input id="project-query" data-field="project-query" placeholder="Název projektu nebo firmy" autocomplete="off"></div><div id="project-options">${projectOptions('')}</div><div class="field"><label for="next-description">Popis nové práce</label><input id="next-description" data-field="next-description" value="${esc(modal.description??S.description)}" maxlength="120"></div><div class="actions">${btn(S.track?'Ukončit úsek a přepnout':'Použít projekt','confirm-project','primary','check')}</div>`;break;
 case 'edit-description':title='Upřesnit právě běžící práci';body=`<label for="edit-description">Popis práce</label><input id="edit-description" data-field="edit-description" value="${esc(S.track?.description||S.description)}" maxlength="120"><p class="hint">Změna popisu upraví jen současný úsek. Pro jinou práci zvolte „Změnit práci“.</p><div class="actions">${btn('Uložit popis','confirm-description','primary')}</div>`;break;
 case 'start-work':title='Začít měřit práci';body=`<p class="small muted">Nahrávání poběží dál. Tímto krokem navíc spustíte čas.</p>${projectButton()}<div class="field"><label for="new-description">Popis práce</label><input id="new-description" data-field="description" value="${esc(S.description)}"></div><div class="actions">${btn('Začít práci','start-time','primary','play')}</div>`;break;
 case 'sources':title='Obě strany schůzky';body=`<p class="small muted">${S.recording?'Zachycený zvuk zůstává zachovaný. Výpadek nedoplníme zpětně.':'Před nahráváním ověřte mikrofon a zvuk ostatních aplikací.'}</p><div class="divider"></div>${sourceRows()}<div class="actions stack">${btn('Mikrofon: '+(S.source.mic?'zkontrolovat oprávnění':'opravit oprávnění'),'permission:mic','','mic')}${btn('Systémový zvuk: '+(S.source.system?'zkontrolovat oprávnění':'opravit oprávnění'),'permission:system','','monitor')}</div><div class="divider"></div>${btn('Vyzkoušet zdroje','source-test','primary full','sound')}<p class="hint">Simulace macOS → Soukromí a zabezpečení → Mikrofon / Záznam obrazovky a systémového zvuku. Žádné oprávnění se ve skutečnosti nemění.</p>`;break;
 case 'permission':title=modal.key==='mic'?'Povolit mikrofon':'Povolit systémový zvuk';body=`<p>macOS otevře <strong>Soukromí a zabezpečení → ${modal.key==='mic'?'Mikrofon':'Záznam obrazovky a systémového zvuku'}</strong>.</p><p class="hint">V seznamu zapněte LuDone Desktop a vraťte se sem. Nyní jde o místní simulaci tohoto předání.</p><div class="actions stack">${btn('Povolení uděleno · vrátit se','grant-permission:'+modal.key,'primary','check')}${btn('Teď nepovolit','deny-permission:'+modal.key,'ghost')}</div>`;break;
 case 'login':title='Přihlášení přes LuDone';body=`<div class="file-preview">${icon('user')}<div><strong>Alex Novák</strong><p class="tiny muted">Fiktivní účet · Studio Sever a Ateliér Jih</p></div></div><p class="small">V aplikaci se otevře přihlášení v prohlížeči. Návrh pouze simuluje návrat stejného účtu.</p><div class="actions">${btn('Potvrdit přihlášení v simulaci','confirm-login','primary','check')}</div><p class="hint">Přihlášení samo neodešle blokované nahrávky. U položky zůstane samostatná akce odeslání.</p>`;break;
 case 'company':title='Firma této nahrávky';body=`<p class="small">${esc(r.title)} · ${mm(r.seconds)}</p><div class="field"><label for="detail-company">Cílová firma</label>${companySelect(r.company,'detail-company')}</div><p class="hint">Změna platí jen pro tuto nahrávku. Projekt práce ani jiné soubory se nezmění.</p><div class="actions">${btn('Uložit firmu, zatím neodesílat','confirm-company','primary')}</div>`;break;
 case 'rename':title='Přejmenovat nahrávku';body=`<label for="rename">Název</label><input id="rename" data-field="rename" value="${esc(r.title)}" maxlength="120"><div class="actions">${btn('Uložit název','confirm-rename','primary')}</div>`;break;
 case 'send':title='Odeslat tuto nahrávku?';body=`<div class="file-preview">${icon('file')}<div><strong>${esc(r.title)}</strong><p class="tiny muted">${mm(r.seconds)} · ${r.size} MB · jeden stereo soubor</p></div></div><dl class="definition"><dt>Firma</dt><dd><strong>${esc(r.company)}</strong></dd><dt>Vlastník</dt><dd>Alex Novák</dd></dl><p class="small muted">${S.online?'Zařadíme ji do fronty. Výsledek přenosu se ukáže zvlášť.':'Bez sítě zůstane ve frontě. Pokus nabídneme po návratu připojení.'}</p><div class="actions">${btn('Potvrdit odeslání','confirm-send','primary','upload')}${btn('Zrušit','close-modal','ghost')}</div>`;break;
 case 'owner':title='Převzít konkrétní nahrávku';body=`<p><strong>${esc(r.title)}</strong><br>${mm(r.seconds)} · ${r.size} MB · ${esc(r.company)}</p><div class="divider"></div><p class="small">Původní vlastník: <strong>${esc(r.owner)}</strong><br>Nový vlastník: <strong>Alex Novák</strong></p><p class="hint">Převzetím potvrzujete oprávnění s tímto zvukem pracovat. Odeslání potvrdíte až v dalším kroku.</p><label class="radio-row"><input type="checkbox" data-field="owner-confirm"><span>Mám právo tuto nahrávku převzít.</span></label><div class="actions">${btn('Převzít vlastnictví','confirm-owner','primary','','disabled')}${btn('Zrušit','close-modal','ghost')}</div>`;break;
 case 'trash':title='Přesunout lokální kopii do koše?';body=`<div class="file-preview">${icon('file')}<div><strong>${esc(r.title)}</strong><p class="tiny muted">${mm(r.seconds)} · ${r.size} MB · ${esc(r.company||'Bez firmy')}</p></div></div><div class="notice ${r.status==='verified'?'good':'error'}">${r.status==='verified'?'Nahrávka je ověřená v LuDone. Serverový záznam zůstane.':'Toto je jediná ověřená kopie. Na serveru její dostupnost potvrzená není.'}</div><p class="hint">Položku odebereme i z místní fronty. Jde o simulovaný systémový koš, žádný soubor se nemaže.</p><div class="actions">${btn('Ponechat','close-modal','primary')}${btn('Přesunout tuto kopii','confirm-trash','danger','trash')}</div>`;break;
 case 'handoff':title=modal.title;body=`<div class="file-preview">${icon(modal.icon||'external')}<div class="grow"><strong class="small">${esc(modal.destination)}</strong><p class="tiny muted">Místní náhled předání</p></div></div><p>${esc(modal.reason)}</p><p class="hint">${esc(modal.note||'Tento prototyp nic neotevírá ani neposílá. V cílové aplikaci by se zachoval uvedený kontext.')}</p><div class="actions">${btn('Vrátit se do LuDone Desktop','close-modal','primary','back')}</div>`;break;
 case 'commands':title='Rychlé akce';body=`<p class="hint">Příkazy pro tento okamžik · ⌘K</p>${btn(S.track?'Zastavit čas':'Začít práci',S.track?'stop-time':'start-time','menu-item','clock')}${btn(S.recording?'Zastavit zvuk a uložit':S.pending?'Dokončit uložení':'Nahrát schůzku',S.recording?'stop-record':S.pending?'now':'start-record','menu-item','record')}${btn('Můj den','day','menu-item','link')}${btn('Týdenní výkaz na webu','web:time','menu-item','external')}${btn('Nastavení','settings','menu-item','settings')}<div class="divider"></div>${btn('Připojit poznámku k práci','note-dialog','menu-item','plus')}<p class="hint">Nápad pro další etapu: drobný kontext patří k práci, nevytváří další hlavní sekci.</p>`;break;
 case 'note':title='Poznámka k pracovnímu kontextu';body=`<p class="small muted">Lokální ukázka rozšíření rychlých akcí. Poznámka nic nevykazuje a neodesílá.</p><div class="field"><label for="note">Krátká poznámka</label><input id="note" data-field="note" value="${esc(S.note||'')}" placeholder="Například: ověřit texty na úvodní stránce"></div><div class="actions">${btn('Připojit k dnešní práci','save-note','primary','plus')}</div>`;break;
 case 'simulation':title='Lokální zkouška situace';body=`<label for="scenario">Přímý scénář · obnoví vstupní data</label><select id="scenario" data-field="scenario">${SCENARIOS.map(s=>`<option ${s===S.scenario?'selected':''}>${s}</option>`).join('')}</select><div class="field"><label for="theme">Téma</label><select id="theme" data-field="theme">${THEMES.map(t=>`<option ${t===S.theme?'selected':''}>${t}</option>`).join('')}</select></div><div class="fault-list">${btn(S.online?'Simulovat výpadek sítě':'Obnovit síť',S.online?'offline':'online','','offline')}${btn('Simulovat ztrátu systémového zvuku','lose-source','','alert')}${btn('Simulovat vypršení přihlášení','expire-auth','','user')}${btn('Simulovat restart s rozpracovaným časem','restart','','refresh')}${btn('Nabídnout aktualizaci','check-update','','download')}${btn('Nahrávka: cizí vlastník','fault:owner','','user')}${btn('Nahrávka: limit serveru','fault:limit','','clock')}${btn('Nahrávka: plné úložiště serveru','fault:quota','','alert')}${btn('Čas: synchronizace odmítnuta','time-error','','alert')}</div>`;break;
 case 'logout':title='Odhlásit tento Mac?';body=`<p class="small">Místní soubory zůstanou zachované. Odesílání se pozastaví; běžící zvuk a čas lze stále zastavit.</p><div class="actions">${btn('Ponechat přihlášení','close-modal','primary')}${btn('Odhlásit','confirm-logout','ghost')}</div>`;break;

 host.innerHTML=`<dialog class="modal" aria-labelledby="dialog-title"><header class="modal-head"><h2 id="dialog-title">${title}</h2>${ib('Zavřít dialog','close-modal','close')}</header><div class="modal-body">${body}</div></dialog>`;const d=host.querySelector('dialog');d.showModal();d.addEventListener('cancel',e=>{e.preventDefault();closeModal();});const f=d.querySelector('input:not([type=checkbox]):not([type=radio])');if(f)f.focus();
}
function projectOptions(q){return PROJECTS.filter(p=>(p.name+' '+p.company).toLocaleLowerCase('cs').includes(q.toLocaleLowerCase('cs'))).map(p=>`<button class="option ${(modal?.project||S.project)===p.id?'selected':''}" data-action="choose-project:${p.id}"><span class="grow">${p.name}<small>${p.company}</small></span>${(modal?.project||S.project)===p.id?icon('check'):''}</button>`).join('')||'<p class="hint">V přidělených projektech nic nenalezeno.</p>';}
function finishTrack(){if(!S.track)return;S.entries.push({...S.track,ended:endTime(S.track),status:'queued'});S.track=null;}
function startTrack(){if(S.recovery){S.view='recovery';notify('Nejdřív rozhodněte o rozpracovaném čase.');return;}if(S.track)return;S.track={id:'t'+S.next++,project:S.project,description:S.description.trim()||'Práce bez popisu',seconds:0,started:'10:32'};S.view='now';notify('Měření běží místně. Výsledek se potvrdí až po synchronizaci.');}
function startRecording(){if(S.recording||S.pending)return;if(!S.source.mic||!S.source.system){openModal('sources');return;}S.recording={id:'r'+S.next++,title:'Týdenní domluva',seconds:0,company:S.company,owner:S.auth?'Alex Novák':'Nepotvrzený vlastník',links:S.track?[S.track.id]:[],sourceGap:false,auto:S.settings.auto&&!!S.company&&S.auth};S.view='now';notify(S.track?'Nahrává se. Čas práce běží nezávisle.':'Nahrává se bez měření času.');}
function stopRecording(){if(!S.recording)return;S.pending={...S.recording,status:'local',size:'9,2',at:'10:32'};S.recording=null;S.view='now';if(S.pending.auto){const r=S.pending;S.records.push({...r,status:S.online&&S.auth?'queued':!S.auth?'auth':'queued'});S.pending=null;S.selected=r.id;notify('Nová nahrávka uložena a zařazena do fronty podle zapnuté automatiky.');}else notify('Zvuk zastaven a zachován na Macu. Doplňte název a způsob uložení.');}
function handoff(type){const r=currentRecord();const values={time:['Týdenní výkaz v LuTracku','ludone.cz/time-tracking → Přehled','Zde opravíte zapomenutý čas, přidáte záznam, vyexportujete nebo uzavřete týden.'], 'time-review':['Zkontrolovat rozpracovaný čas','ludone.cz/time-tracking → Časovač → dnešní záznamy','Rozpracovaný úsek je zachovaný pouze místně a čeká na vaše rozhodnutí. Zatím nebyl odeslán ani odmítnut serverem; čas přes noc jsme nepřičetli.'], 'time-error':['Opravit časový úsek','ludone.cz/time-tracking → Časovač → dnešní záznamy','Server úsek odmítl kvůli změně přidělení projektu. Lokální čas zůstává zachovaný; na webu prověříte oprávnění a opravíte výkaz.'],record:['Nahrávka v LuDone',`LuDone → Nahrávky → ${r?.title||'Týdenní domluva'}`,`Otevře přepis a analýzu nahrávky ve firmě ${r?.company||'Studio Sever'}. Týmový archiv zůstává na webu.`],storage:['Správa úložiště','LuDone → Nahrávky → Správa úložiště','Odpovědný správce může vyřešit kapacitu. Soubor zůstává na Macu a automaticky se znovu nepokoušíme odesílat.']};const v=values[type]||values.time;openModal('handoff',{title:v[0],destination:v[1],reason:v[2]});}
function action(a){const [name,arg]=a.split(':');let r=currentRecord();switch(name){
 case 'now':case 'day':case 'settings':case 'identity':case 'update':case 'recovery':nav(name);return;
 case 'detail':S.selected=arg;nav('detail');return;
 case 'open-panel':S.open=true;S.view=S.recovery?'recovery':'now';break;
 case 'close-panel':S.open=false;break;
 case 'projects':openModal('projects',{project:S.project,description:S.description});return;
 case 'choose-project':modal.project=arg;document.querySelector('#project-options').innerHTML=projectOptions(document.querySelector('#project-query').value);return;
 case 'confirm-project':{const selected=modal.project||S.project,description=modal.description?.trim()||S.description;if(S.track){finishTrack();S.project=selected;S.description=description;startTrack();}else{S.project=selected;S.description=description;}modal=null;notify(S.recording?'Práce změněna. Nahrávka si zachovává původní kontext i cílovou firmu.':'Projekt a popis jsou připravené.');break;}
 case 'edit-description':openModal('edit-description',{description:S.track?.description||S.description});return;
 case 'confirm-description':S.description=modal.description?.trim()||S.description;if(S.track)S.track.description=S.description;modal=null;notify('Popis současné práce uložen.');break;
 case 'start-time':modal=null;startTrack();break;
 case 'stop-time':finishTrack();modal=null;notify(S.recording?'Čas zastaven. Zvuk dál nahrává.':'Čas uložen na Macu a čeká na synchronizaci.');break;
 case 'resume':{const e=S.entries.find(e=>e.id===arg);if(!S.track&&e){S.project=e.project;S.description=e.description;startTrack();}break;}
 case 'start-work-form':openModal('start-work');return;
 case 'start-record':modal=null;startRecording();break;
 case 'stop-record':modal=null;stopRecording();break;
 case 'save-local':case 'save-send':{if(!S.pending)break;if(name==='save-send'&&!S.pending.company){notify('Vyberte cílovou firmu, nebo nahrávku nechte na Macu.');break;}if(name==='save-send'&&!S.auth){openModal('login');return;}const p=S.pending;p.title=p.title.trim()||'Nahrávka 23. září';S.records.push({...p,status:name==='save-local'?'local':p.owner!=='Alex Novák'?'owner':'queued'});S.pending=null;S.selected=p.id;notify(name==='save-local'?'Nahrávka je uložena pouze na Macu.':'Nahrávka je ve frontě. Přenos zatím není potvrzen.');if(!S.track)S.view='detail';break;}
 case 'record-company-dialog':openModal('company',{company:r.company});return;
 case 'confirm-company':if(!modal.company){announce('Vyberte cílovou firmu.');return;}if(['sent','verified'].includes(r.status)){closeModal();return;}if(r.company!==modal.company&&r.status==='queued')r.status='local';r.company=modal.company;modal=null;notify('Firma uložená. Odeslání potvrďte samostatně.');break;
 case 'send-record':if(!r.company){openModal('company',{company:''});return;}if(!S.auth||r.status==='auth'){openModal('login');return;}if(r.status==='owner'||r.owner!=='Alex Novák'){openModal('owner');return;}if(r.status==='limit'){notify('Počkejte do 10:45. Limit zatím neuplynul.');break;}if(r.status==='quota'){handoff('storage');return;}openModal('send');return;
 case 'confirm-send':r.status='queued';modal=null;notify(S.online?'Zařazeno do fronty. Přehled ověří výsledek přenosu.':'Zařazeno do fronty. Čeká na připojení.');break;
 case 'verify':if(!S.online){notify('Ověření vyžaduje síť. Kopie zůstává na Macu.');break;}if(!S.auth){openModal('login');return;}r.status='verified';notify('Simulovaný server potvrdil dostupnost nahrávky v LuDone.');break;
 case 'refresh':if(!S.online){notify('Přehled je místní. Síť stále není dostupná.');break;}if(!S.auth){openModal('login');return;}S.records.forEach(r=>{if(r.status==='queued'&&r.company&&r.owner==='Alex Novák')r.status='sent';});notify('Přehled obnoven. Přijaté soubory mají stav Odesláno; ověření je samostatný krok.');break;
 case 'sync':{const e=S.entries.find(e=>e.id===arg);if(!S.online){notify('Úsek čeká na síť, místní čas je zachovaný.');break;}if(!S.auth){openModal('login');return;}if(e)e.status='confirmed';notify('Simulovaný server úsek přijal. Nejde o schválení výkazu.');break;}
 case 'filter':S.filter=arg;break;
 case 'sources':openModal('sources');return;
 case 'permission':openModal('permission',{key:arg,returnTo:S.view});return;
 case 'grant-permission':S.source[arg]=true;modal=null;notify('Oprávnění v simulaci povoleno. Zdroj je připravený.');break;
 case 'deny-permission':S.source[arg]=false;modal=null;notify('Zdroj není připravený. Měření času je dál dostupné.');break;
 case 'source-test':openModal('handoff',{title:'Zkouška zdrojů',destination:'Mikrofon: '+(S.source.mic?'připraven':'chybí')+' · Systém: '+(S.source.system?'připraven':'chybí'),reason:'Místní ukázka zpětné vazby. V aplikaci zde zkontrolujete úroveň obou zdrojů před schůzkou.',icon:'sound',note:'Z tohoto HTML se nezaznamenává ani nepřehrává žádný zvuk.'});return;
 case 'login':openModal('login');return;
 case 'confirm-login':S.auth=true;S.records.forEach(r=>{if(r.status==='auth')r.status='local';});modal=null;notify('Přihlášen Alex Novák. Blokované nahrávky zůstávají na Macu.');if(S.view==='onboarding')S.onboard=2;break;
 case 'owner-dialog':openModal('owner');return;
 case 'confirm-owner':if(!modal.confirmed)return;r.owner='Alex Novák';r.status='local';modal=null;notify('Vlastnictví této nahrávky převzato. Odeslání ještě nezačalo.');break;
 case 'limit-elapsed':r.status='local';notify('Čekací doba v simulaci uplynula. Můžete zkusit odeslání.');break;
 case 'rename':openModal('rename',{title:r.title});return;
 case 'confirm-rename':r.title=modal.title?.trim()||r.title;modal=null;notify('Název nahrávky uložen.');break;
 case 'finder':openModal('handoff',{title:'Ukázat ve Finderu',destination:'Mac Alexe → LuDone Desktop → Nahrávky → '+r.title,reason:'Finder označí místní soubor této schůzky ('+r.size+' MB). Kopie zůstane na Macu.',icon:'folder'});return;
 case 'trash-dialog':openModal('trash');return;
 case 'confirm-trash':S.trashed=r;S.records=S.records.filter(x=>x.id!==r.id);modal=null;S.view='day';notify('Lokální kopie přesunuta do simulovaného koše. Serverový záznam se nemění.');break;
 case 'web':handoff(arg);return;
 case 'toggle':if(arg==='auto'&&!S.company){notify('Nejdřív vyberte výchozí firmu. Stará fronta se neodešle.');break;}S.settings[arg]=!S.settings[arg];notify(arg==='auto'?'Automatika změněna pouze pro budoucí nahrávky.':'Volba uložena v lokální simulaci.');break;
 case 'theme':S.theme=arg;break;
 case 'check-update':modal=null;S.updateHidden=false;S.notification=!S.notified;S.notified=true;S.view='update';break;
 case 'prepare-update':S.update='prepared';S.notification=false;notify('Aktualizace připravená. Restart čeká na váš závěrečný klik.');break;
 case 'defer-update':S.updateHidden=true;S.notification=false;S.view='now';notify('Aktualizace odložena. Najdete ji v Nastavení.');break;
 case 'dismiss-notification':S.notification=false;break;
 case 'install-update':if(S.track||S.recording||S.pending)return;S.version='0.1.5';S.update='installed';S.updateHidden=true;notify('Simulovaný restart dokončen. Váš den je zachovaný.');break;
 case 'resolve-recovery':if(S.recovered){S.entries.push({...S.recovered,ended:endTime(S.recovered),status:S.recoveryChoice==='checkpoint'?'queued':'review'});S.recovered=null;}S.recovery=false;S.view='day';notify('Rozpracovaný úsek zachován. Žádná doba přes noc se nepřičetla.');if(S.recoveryChoice==='review'){handoff('time-review');return;}break;
 case 'onboard-login':openModal('login');return;
 case 'onboard-local':S.onboard=2;break;
 case 'onboard-done':S.view='now';notify('Začněte práci, nebo nahrajte samostatnou schůzku.');break;
 case 'diagnostics':openModal('handoff',{title:'Export diagnostiky',destination:'Stažené → LuDone-diagnostika-2026-09-23.txt',reason:`Náhled obsahu: verze ${S.version}, síť ${S.online?'dostupná':'nedostupná'}, mikrofon ${S.source.mic?'připraven':'chybí'}, systém ${S.source.system?'připraven':'chybí'}, počet místních nahrávek ${S.records.length}.`,icon:'download',note:'Návrh nic nezapisuje na disk. Skutečný export by neobsahoval zvuk, tokeny ani názvy schůzek.'});return;
 case 'logout-dialog':openModal('logout');return;
 case 'confirm-logout':S.auth=false;modal=null;notify('Odhlášeno. Místní činnosti a soubory zůstávají dostupné.');break;
 case 'commands':openModal('commands');return;
 case 'note-dialog':openModal('note',{note:S.note||''});return;
 case 'save-note':S.note=modal.note||'';modal=null;notify(S.note?'Poznámka připojena k dnešní práci: '+S.note:'Prázdná poznámka nebyla přidána.');break;
 case 'simulation':openModal('simulation');return;
 case 'offline':S.online=false;modal=null;notify('Síť vypadla. Místní čas i zvuk pokračují.');break;
 case 'online':S.online=true;modal=null;notify('Síť obnovena. Místní úseky synchronizujte, frontu zkontrolujte v Mém dni.');break;
 case 'lose-source':S.source.system=false;if(S.recording)S.recording.sourceGap=true;modal=null;S.view='now';notify('Systémový zvuk vypadl. Otevřete zdroje a opravte oprávnění.');break;
 case 'expire-auth':S.auth=false;modal=null;notify('Přihlášení vypršelo; žádná běžící činnost se nezastavila.');break;
 case 'restart':if(S.track){S.recovered={...S.track};S.track=null;}else S.recovered=null;if(S.recording){S.records.push({...S.recording,status:'local',size:'9,2',at:'10:32',sourceGap:true});S.recording=null;}S.recovery=!!S.recovered;modal=null;S.view=S.recovered?'recovery':S.pending?'now':'day';notify(S.recovered?'Návrat po restartu. Rozpracovaný čas čeká na rozhodnutí.':'Návrat po restartu. Žádný čas nebyl rozpracovaný; místní nahrávky zůstaly zachované.');break;
 case 'fault':S.selected='r2';r=currentRecord();if(r){r.status=arg;r.company='Studio Sever';if(arg==='owner')r.owner='Petra Malá';}S.view='detail';modal=null;break;
 case 'time-error':S.entries[0].status='error';S.view='day';modal=null;notify('Simulovaný server odmítl úsek. Místní hodnota se neztratila.');break;
 case 'close-modal':closeModal();return;
 case 'dismiss-toast':toast='';break;
 default:return;
 }render();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action);});
document.addEventListener('input',e=>{const f=e.target.dataset.field,v=e.target.value;switch(f){case 'description':S.description=v;break;case 'record-title':if(S.pending)S.pending.title=v;break;case 'next-description':modal.description=v;break;case 'edit-description':modal.description=v;break;case 'project-query':document.querySelector('#project-options').innerHTML=projectOptions(v);break;case 'rename':modal.title=v;break;case 'note':modal.note=v;break;case 'owner-confirm':modal.confirmed=e.target.checked;document.querySelector('[data-action="confirm-owner"]').disabled=!modal.confirmed;break;}});
document.addEventListener('change',e=>{const f=e.target.dataset.field,v=e.target.value;switch(f){case 'record-company':S.pending.company=v;break;case 'detail-company':modal.company=v;return;case 'default-company':S.company=v;if(!v)S.settings.auto=false;notify('Výchozí firma změněna. Stávající nahrávky zůstávají beze změny.');break;case 'retention':S.settings.retention=v;notify('Retence uložena. Neověřené kopie se neodstraňují.');break;case 'recovery-choice':S.recoveryChoice=v;return;case 'scenario':if(SCENARIOS.includes(v))seed(v,S.theme);return;case 'theme':if(THEMES.includes(v))S.theme=v;break;default:return;}render();});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('commands');}if(e.key==='Escape'&&!modal){S.open=false;render();}});
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.type!=='ludone-experience:set')return;const {scenario,theme}=event.data;if(scenario!==undefined&&!SCENARIOS.includes(scenario)||theme!==undefined&&!THEMES.includes(theme))return;if(scenario!==undefined)seed(scenario,theme||S.theme);else if(theme){S.theme=theme;render();}});
setInterval(()=>{const now=Date.now(),delta=Math.floor((now-lastTick)/1000);if(delta<1)return;lastTick+=delta*1000;if(S.track)S.track.seconds+=delta;if(S.recording)S.recording.seconds+=delta;document.querySelectorAll('[data-time]').forEach(el=>{const x=S[el.dataset.time];if(x)el.textContent=mm(x.seconds);});const t=document.querySelector('[data-tray-time]');if(t)t.textContent=(S.track?mm(S.track.seconds):'')+(S.track&&S.recording?' / ':'')+(S.recording?mm(S.recording.seconds):'');},1000);
const params=new URLSearchParams(location.search);seed(SCENARIOS.includes(params.get('scenario'))?params.get('scenario'):'home',THEMES.includes(params.get('theme'))?params.get('theme'):'light');
/* Čtecí rozhraní pro ověření lokálního návrhu; neprovádí žádné externí akce. */
window.ludonePrototype={state:()=>structuredClone(S),reset:seed};
</script>
</body>
</html>
