<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuDone pro Mac · samostatný návrh</title><link rel="stylesheet" href="compare.css"><style>header{gap:12px;flex-wrap:wrap}header a{color:inherit;font-size:12px}.focus-controls{display:flex;gap:8px;flex-wrap:wrap}.focus-controls select{font-size:12px}.focus-canvas{padding:28px 0 48px;display:flex;justify-content:center;overflow:auto}.focus-canvas iframe{width:366px;height:676px;flex:none;border:0;border-radius:10px;box-shadow:0 10px 36px #1b291d18;background:#fafafa}</style></head><body><header><a href="index.html">← Oba návrhy</a><strong id="focus-title">LuDone pro Mac</strong><div class="focus-controls"><select id="scenario" aria-label="Situace"><option value="idle">V klidu</option><option value="recording">Nahrávání</option><option value="saved">Po nahrávání</option><option value="blocked-company">Chybí firma</option><option value="uploading">Přehled nahrávek</option><option value="detail">Detail nahrávky</option><option value="retry">Chyba a opakování</option><option value="settings">Nastavení</option><option value="update">Aktualizace</option><option value="identity">Ikony a lišta</option></select><select id="theme" aria-label="Téma"><option value="light">Světlé</option><option value="professional">Professional</option><option value="dark">Tmavé</option></select></div></header><div class="focus-canvas"><iframe id="preview" title="Klikací návrh macOS aplikace" sandbox="allow-scripts allow-same-origin"></iframe></div><script>
// Samostatný náhled drží rozměr aplikace také ve velkém prohlížeči.
const params=new URLSearchParams(location.search);
const variant=params.get('variant')==='astra'?'astra':'opus';
const scenarioSelect=document.querySelector('#scenario'),themeSelect=document.querySelector('#theme'),frame=document.querySelector('#preview');
const scenarios=Array.from(scenarioSelect.options,o=>o.value),themes=['light','professional','dark'];
scenarioSelect.value=scenarios.includes(params.get('scenario'))?params.get('scenario'):'idle';
themeSelect.value=themes.includes(params.get('theme'))?params.get('theme'):'light';
document.querySelector('#focus-title').textContent='Návrh '+(variant==='opus'?'A':'B')+' · LuDone pro Mac';
function size(s){frame.style.width=['settings','uploading','retry','identity','detail'].includes(s)?'448px':'366px'}
function load(){const scenario=scenarioSelect.value,theme=themeSelect.value;size(scenario);frame.src='variants/'+variant+'/index.html?'+new URLSearchParams({scenario,theme,preview:Date.now()});history.replaceState(null,'','?'+new URLSearchParams({variant,scenario,theme}));}
scenarioSelect.addEventListener('change',load);themeSelect.addEventListener('change',load);
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.type!=='ludone-design:state')return;if(scenarios.includes(e.data.scenario)){scenarioSelect.value=e.data.scenario;size(e.data.scenario)}if(themes.includes(e.data.theme))themeSelect.value=e.data.theme});load();
</script></body></html>
