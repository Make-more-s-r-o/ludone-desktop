      inner = `<h2 id="sh-t">Převzít „${esc(r.title)}"?</h2>
        <p class="note">Nahrávku pořídil tento Mac pod jiným účtem LuDone. Po převzetí bude tvoje (Alex Novák) a zůstane na Macu. Odeslat ji budeš moct až potom, sám.</p>
        <div class="actions"><button type="button" class="btn btn--primary" data-action="owner-confirm">Převzít jako Alex Novák</button><button type="button" class="btn" data-action="sheet-close">Zrušit</button></div>`;
    } else if (sh.type === 'update') {
      const busy = busyList();
      inner = `<h2 id="sh-t">LuDone 0.1.5</h2>
        <p>Práce a schůzky na jednom místě.</p>
        <p class="note">Máš 0.1.4. Instalace potřebuje restart aplikace, proto ho nabídnu, až nic nepoběží a vše bude uložené. Samotné zastavení měření nebo nahrávání nic nenainstaluje.</p>
        ${busy.length ? `<div class="callout">Teď běží: <b>${busy.join(', ')}</b>. Příprava je nepřeruší.</div>` : ''}
        <div class="actions"><button type="button" class="btn btn--primary" data-action="upd-prepare">Připravit instalaci</button><button type="button" class="btn" data-action="upd-later">Později</button></div>`;
    } else if (sh.type === 'recovery' && S.recovery) {
      const rv = S.recovery, p = proj(rv.projectId);
      const max = rv.prevDay ? t(23, 59) : rv.restartAt;
      const waiting = S.recordings.filter(r => r.state !== 'verified' && r.state !== 'sent');
      const choice = (c, title, sub, extra) => `<button type="button" class="choice" role="radio" aria-checked="${rv.choice === c}" data-action="rv-choice" data-c="${c}"><span class="radio" aria-hidden="true"></span><span class="choice-t">${title}</span><span class="choice-s">${sub}</span>${extra || ''}</button>`;
      inner = `<h2 id="sh-t">Po restartu: co s rozdělaným časem?</h2>
        <p class="note">Měření <b>${esc(p.name)} · ${esc(rv.desc)}</b> zůstalo otevřené od ${rv.prevDay ? 'včerejška ' : ''}${clock(rv.start)}. Mac byl naposledy aktivní ${rv.prevDay ? 'včera ' : ''}v ${clock(rv.lastSeen)}. Nic jsem sám nevykázal.</p>
        <div class="choices" role="radiogroup" aria-label="Konec úseku">
          ${choice('last', `Ukončit v ${clock(rv.lastSeen)}`, `naposledy aktivní · ${dur(rv.lastSeen - rv.start)} · doporučeno`)}
          ${choice('custom', 'Ukončit v jiném čase', `mezi ${clock(rv.start)} a ${clock(max)}`)}
          ${choice('drop', 'Neukládat tento úsek', 'nic se nevykáže')}
        </div>
        ${rv.choice === 'custom' ? `<label class="field"><span class="field-l">Konec úseku</span><input id="rv-custom" class="input input--time" type="text" inputmode="numeric" value="${esc(rv.custom)}"></label>` : ''}
        ${rv.err ? `<p class="err-text" role="alert">${esc(rv.err)}</p>` : ''}
        <label class="check"><input type="checkbox" id="rv-again"${rv.again ? ' checked' : ''}> Hned pokračovat v ${esc(p.name)} od teď (${clock(S.now)})</label>
        ${waiting.length ? `<div class="field"><span class="field-l">Nahrávky, které čekají — nic se neodešle samo</span><ul class="mini-list">${waiting.map(r => `<li><span>${esc(r.title)} <span class="muted tnum">${ms(r.dur)}</span></span>${recChip(r)}</li>`).join('')}</ul></div>` : ''}
        <div class="actions actions--stack"><button type="button" class="btn btn--primary" data-action="rv-confirm">Potvrdit</button></div>
        <p class="note">Čas mezi ${clock(rv.lastSeen)} a ${clock(rv.restartAt)}${rv.prevDay ? ' (noc)' : ''} se nezapočítá, pokud ho výslovně nezadáš.</p>`;
    } else if (sh.type === 'logout') {
      inner = `<h2 id="sh-t">Odhlásit se?</h2>
        <p class="note">Nahrávky i neodeslaný čas zůstanou na tomto Macu. Odesílání a synchronizace se zastaví, dokud se znovu nepřihlásíš.${S.work || S.rec ? ' Běžící měření a nahrávání pokračují.' : ''}</p>
        <div class="actions"><button type="button" class="btn btn--primary" data-action="logout-confirm">Odhlásit</button><button type="button" class="btn" data-action="sheet-close">Zrušit</button></div>`;
    } else { return ''; }
    return `<div class="sheet-back" data-action="sheet-dismiss"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" data-action="noop">${inner}</div></div>`;
  }

  // ---------- onboarding ----------
  function onboarding() {
    const o = S.onboarding;
    if (o.step === 1) {
      return `<div class="ob">
        <div class="ob-step">Krok 1 ze 3</div>
        <div style="margin-top:14px">${appIcon(56)}</div>
        <h2>LuDone na Macu</h2>
        <p>Měř čas v LuTracku a nahrávej schůzky, obojí z lišty. Týden, schvalování a přepisy zůstávají na webu.</p>
        <div class="actions actions--stack" style="margin-top:20px">
          ${o.waiting ? `<button type="button" class="btn" disabled><span class="spinner" aria-hidden="true"></span>Čekám na přihlášení v prohlížeči…</button><button type="button" class="btn btn--ghost" data-action="ob-cancel">Zrušit</button>`
            : `<button type="button" class="btn btn--primary" data-action="ob-login">Přihlásit se přes LuDone</button>`}
        </div>
        <p class="note">Přihlášení proběhne v prohlížeči a vrátí tě sem. Heslo aplikace neuvidí.</p>
      </div>`;
    }
    if (o.step === 2) {
      const opt = (k, title, sub) => `<button type="button" class="ob-opt" role="checkbox" aria-checked="${o[k]}" data-action="ob-want" data-w="${k}"><span class="box">${o[k] ? I.check : ''}</span><b>${title}</b><span></span><small>${sub}</small></button>`;
      return `<div class="ob">
        <div class="ob-step">Krok 2 ze 3 · přihlášen jako Alex Novák</div>
        <h2>Co budeš na Macu dělat?</h2>
        <p>Podle toho se zeptám jen na oprávnění, která opravdu potřebuješ. Změníš to v Nastavení.</p>
        <div class="ob-list">
          ${opt('wantTime', 'Měřit čas', 'Máš přidělené 3 projekty. Nic dalšího nastavovat nemusíš.')}
          ${opt('wantRec', 'Nahrávat schůzky', 'Mikrofon a systémový zvuk v jednom souboru.')}
        </div>
        <div class="actions actions--stack" style="margin-top:18px"><button type="button" class="btn btn--primary" data-action="ob-next"${o.wantTime || o.wantRec ? '' : ' disabled'}>${o.wantRec ? 'Pokračovat' : 'Hotovo'}</button></div>
      </div>`;
    }
    const mic = S.settings.mic === 'ok', sys = S.settings.sys === 'ok';
    return `<div class="ob">
      <div class="ob-step">Krok 3 ze 3</div>
      <h2>Oprávnění pro nahrávání</h2>
      <p>macOS se zeptá sám. Bez systémového zvuku nahraješ jen svůj hlas.</p>
      <div style="margin-top:14px;border-top:1px solid var(--line)">
        <div class="perm"><b>Mikrofon</b><small>tvůj hlas</small>${mic ? chip('ok', 'Povoleno') : '<button type="button" class="btn btn--sm btn--primary" data-action="ob-mic">Povolit</button>'}</div>
        <div class="perm"><b>Systémový zvuk</b><small>hlasy ostatních z hovoru · oprávnění Záznam obrazovky</small>${sys ? chip('ok', 'Povoleno') : '<button type="button" class="btn btn--sm" data-action="ob-sys">Otevřít Nastavení systému</button>'}</div>
      </div>
      <div class="actions actions--stack" style="margin-top:18px">
        <button type="button" class="btn btn--primary" data-action="ob-finish"${mic ? '' : ' disabled'}>${sys ? 'Hotovo' : 'Hotovo, systémový zvuk později'}</button>
      </div>
      ${mic ? '' : '<p class="note">Bez mikrofonu nahrávat nejde. Čas měřit můžeš i tak — vrať se a vypni nahrávání.</p>'}
    </div>`;
  }

  // ---------- okno ----------
  function windowView() {
    const tabs = [['den', 'Den'], ['nahravky', 'Nahrávky'], ['nastaveni', 'Nastavení']];
    const active = S.detail ? S.backTo : (S.tab === 'identita' ? 'nastaveni' : S.tab);
    let body;
    if (S.detail) body = S.detail.kind === 'rec' ? recDetail() : segDetail();
    else if (S.tab === 'den') body = dayView();
    else if (S.tab === 'nahravky') body = recsView();
    else if (S.tab === 'identita') body = identityView();
    else body = settingsView();
    return `<section class="win" data-action="noop" aria-label="LuDone — okno">
      <div class="win-bar">
        <div class="lights"><button type="button" class="light light--close" data-action="close-window" aria-label="Zavřít okno — měření i nahrávání běží dál"></button><span class="light light--min" aria-hidden="true"></span><span class="light light--zoom" aria-hidden="true"></span></div>
        <div class="tabs" role="tablist" aria-label="Oblasti okna">${tabs.map(([k, l]) => `<button type="button" role="tab" class="tab" aria-selected="${active === k}" data-action="tab" data-tab="${k}">${l}</button>`).join('')}</div>
        <div class="win-live">${winLive()}</div>
      </div>
      <div class="win-body" data-scroll="win-${S.detail ? 'detail' : S.tab}">${body}</div>
      ${sheetHtml()}
    </section>`;
  }
  function winLive() {
    const parts = [];
    if (S.work) parts.push(`<span><span class="d d--work" aria-hidden="true"></span>${esc(proj(S.work.projectId).name)} <span data-clock="work">${hms(S.now - S.work.start)}</span></span>`);
    if (S.rec) parts.push(`<span><span class="d d--rec" aria-hidden="true"></span><span data-clock="rec">${ms(S.now - S.rec.start)}</span></span>`);
    if (!parts.length) parts.push('<span class="muted">Nic neběží</span>');
    return `<button type="button" class="live-pill" data-action="toggle-panel" title="Ovládání je v panelu v liště">${parts.join('')}</button>`;
  }

  function dayView() {
    const nSeg = daySegs().length, nRec = dayRecs().length;
    const add = S.add ? `<div class="panelish" style="margin-bottom:14px">
        <div class="sec-head" style="margin-bottom:2px"><h2 class="sec-title">Přidat zapomenutý úsek · dnes</h2></div>
        <div class="form-grid">
          <label class="field"><span class="field-l">Projekt</span><select id="add-proj" class="input">${S.recent.map(id => `<option value="${id}"${S.add.projectId === id ? ' selected' : ''}>${esc(proj(id).name)}</option>`).join('')}</select></label>
          <label class="field"><span class="field-l">Od</span><input id="add-from" class="input input--time" type="text" inputmode="numeric" placeholder="9:35" value="${esc(S.add.from)}"></label>
          <label class="field"><span class="field-l">Do</span><input id="add-to" class="input input--time" type="text" inputmode="numeric" placeholder="9:44" value="${esc(S.add.to)}"></label>
          <label class="field field--full"><span class="field-l">Popis</span><input id="add-desc" class="input" type="text" value="${esc(S.add.desc)}" placeholder="Co jsi dělal"></label>
        </div>
        ${S.add.err ? `<p class="err-text" role="alert">${esc(S.add.err)}</p>` : ''}
        <div class="actions"><button type="button" class="btn btn--primary btn--sm" data-action="add-save">Přidat</button><button type="button" class="btn btn--sm" data-action="add-cancel">Zrušit</button></div>
        <p class="note">Jen dnešek a jen tvoje úseky. Starší dny, cizí úseky a mazání potvrzeného času jsou na webu.</p>
      </div>` : '';
    return `<header class="v-head"><div><h1>${esc(S.day.long)}</h1>
        <p class="v-sub">Práce <b data-clock="total">${dur(totalWork())}</b> · ${nSeg} ${nSeg === 1 ? 'úsek' : nSeg < 5 ? 'úseky' : 'úseků'} · schůzky ${nRec}</p></div>
        ${S.add ? '' : '<button type="button" class="btn btn--sm" data-action="add-open">Přidat zapomenutý úsek</button>'}</header>
      ${add}
      <div class="panelish">${ribbon('large')}
        <div class="rb-legend"><span><i style="background:var(--ok)"></i>běží</span><span><i style="background:color-mix(in oklab,var(--foreground) 72%,transparent)"></i>potvrzeno</span><span><i style="background:repeating-linear-gradient(135deg,var(--warn) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--warn)"></i>čeká</span><span><i style="box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--foreground) 60%,transparent)"></i>jen na Macu</span><span><i style="background:color-mix(in oklab,var(--foreground) 45%,transparent)"></i>v LuDone</span></div>
      </div>
      <ul class="rows rows--day">${dayItems('asc').map(rowHtml).join('') || '<li><p class="empty">Dnes zatím nic.</p></li>'}</ul>
      <div class="handoff">
        <button type="button" class="handoff-row" data-action="web-week"><span><b>Týden, uzávěrka, export a schvalování</b><span class="note">LuTrack na webu · Přehled, týden ${S.day.week}</span></span>${I.ext}</button>
        <button type="button" class="handoff-row" data-action="web-recs"><span><b>Přepisy, analýza a týmový archiv</b><span class="note">LuDone na webu · Nahrávky</span></span>${I.ext}</button>
      </div>
      <p class="note">Na Macu je dnešek a tvoje nahrávky. Alokace, výkazy a tým spravuje web.</p>`;
  }

  function recsView() {
    const all = S.recordings.slice().sort((a, b) => (b.prevDay ? -1 : 0) - (a.prevDay ? -1 : 0) || b.start - a.start);
    const groups = { all: () => true, local: r => r.state === 'local', queue: r => r.state === 'queued' || r.state === 'uploading', sent: r => r.state === 'sent', verified: r => r.state === 'verified', failed: r => r.state === 'failed' };
    const labels = [['all', 'Vše'], ['local', 'Na Macu'], ['queue', 'Ve frontě'], ['sent', 'Odesláno'], ['verified', 'Ověřeno'], ['failed', 'Vyžaduje zásah']];
    const list = all.filter(groups[S.filter] || groups.all);
    const liveRows = S.filter === 'all' ? (S.rec ? rowHtml({ kind: 'rec', o: { id: 'live-rec', start: S.rec.start, dur: S.now - S.rec.start, live: true, target: S.rec.target } }) : '') +
      (S.pending ? rowHtml({ kind: 'rec', o: Object.assign({}, S.pending, { unsaved: true, state: 'local', title: S.pending.title || `Schůzka ${clock(S.pending.start)}` }) }) : '') : '';
    return `<header class="v-head"><div><h1>Nahrávky na tomto Macu</h1><p class="v-sub">Přehled obnoven ${clock(S.refreshedAt)}${S.net ? '' : ' · bez sítě, ukazuji stav na Macu'}</p></div>
        <button type="button" class="btn btn--sm" data-action="refresh-list">Obnovit přehled</button></header>
      <div class="filters" role="group" aria-label="Filtr podle stavu">${labels.map(([k, l]) => { const n = all.filter(groups[k]).length; return `<button type="button" class="chipbtn" data-action="filter" data-f="${k}" aria-pressed="${S.filter === k}">${l} ${n}</button>`; }).join('')}</div>
      <ul class="rows rows--day">${liveRows}${list.map(r => rowHtml({ kind: 'rec', o: r })).join('')}${!list.length && !liveRows ? '<li><p class="empty">V tomhle stavu nic není.</p></li>' : ''}</ul>
      <details class="legend"><summary>Co znamenají stavy</summary><dl>
        <dt>${chip('local', 'Na Macu')}</dt><dd>Soubor je jen na tomto Macu. Nic se neodešle bez tvé volby.</dd>
        <dt>${chip('queued', 'Ve frontě')}</dt><dd>Čeká na síť nebo na řadu a odešle se sám — už jsi ho poslal.</dd>
        <dt>${chip('sent', 'Odesláno')}</dt><dd>Server soubor přijal. Ještě neověřeno, že je v LuDone celý.</dd>
        <dt>${chip('ok', 'Ověřeno v LuDone')}</dt><dd>LuDone potvrdil délku i velikost. Přepis a analýza jsou na webu.</dd>
        <dt>${chip('err', 'Vyžaduje zásah')}</dt><dd>Chybí firma, přihlášení, nebo server odmítl. U položky je další krok.</dd>
      </dl></details>
      <p class="note">Kopie ověřené v LuDone se z Macu mažou ${S.settings.retention === 'never' ? 'nikdy' : `po ${S.settings.retention} dnech`}; nic neodeslaného se nesmaže. <button type="button" class="linkbtn" data-action="tab" data-tab="nastaveni">Změnit</button></p>`;
  }

  function recDetail() {
    const r = findRec(S.detail.id);
    if (!r) return `<button type="button" class="back" data-action="back">${I.back}Zpět</button><p class="empty">Nahrávka už tu není.</p>`;
    const editable = r.state === 'local' || r.state === 'failed';
    const steps = [['local', 'Uloženo na Macu'], ['queued', 'Ve frontě'], ['sent', 'Odesláno'], ['verified', 'Ověřeno v LuDone']];
    const pos = { local: 0, queued: 1, uploading: 1, sent: 2, verified: 3, failed: 1 }[r.state];
    const expl = {
      local: 'Soubor je jen na tomto Macu. Nic se neodešle bez tvé volby.',
      queued: S.net ? 'Čeká na odeslání.' : 'Čeká na síť. Odešle se sám, jakmile bude připojení.',
      uploading: `Odesílá se… ${r.progress || 0} %`,
      sent: 'Server soubor přijal. Ověření, že je v LuDone celý, ještě neproběhlo.',
      verified: 'LuDone potvrdil délku i velikost.',
      failed: failReason(r),
    }[r.state];
    const stepsHtml = steps.map(([k, l], i) => {
      const done = i < pos || (i === pos && r.state === 'verified') || (i === 0 && pos > 0);
      const cur = i === pos && r.state !== 'verified';
      const fail = cur && r.state === 'failed';
      const cls = fail ? 'is-fail' : done ? 'is-done' : cur ? 'is-current' : '';
      const time = r.log[k] != null && (done || cur) ? clock(r.log[k]) : '';
      return `<li class="step ${cls}"><span class="step-m">${fail ? I.alert : done ? I.check : ''}</span><span>${l}${fail ? ' — vyžaduje zásah' : ''}</span><span class="step-t">${time}</span>${cur ? `<span class="step-x">${esc(expl)}</span>` : ''}</li>`;
    }).join('');
    const segs = overlapSegs(r);
    let primary = '';
    if (r.owner !== 'alex') primary = `<button type="button" class="btn btn--primary" data-action="owner-open" data-id="${r.id}">Převzít jako Alex Novák…</button>`;
    else if (r.state === 'local' || (r.state === 'failed' && r.error === 'firm')) primary = r.target ? `<button type="button" class="btn btn--primary" data-action="det-send" data-id="${r.id}"${S.auth === 'ok' ? '' : ' disabled'}>Odeslat do ${esc(FIRMS[r.target])}</button>` : '<span class="note" style="margin:0">Pro odeslání vyber firmu výš.</span>';
    else if (r.state === 'failed' && r.error === 'login') primary = S.auth === 'ok' ? `<button type="button" class="btn btn--primary" data-action="det-retry" data-id="${r.id}">Odeslat znovu do ${esc(FIRMS[r.target])}</button>` : '<button type="button" class="btn btn--primary" data-action="login-start">Přihlásit znovu</button>';
    else if (r.state === 'failed' && r.error === 'limit') primary = `<button type="button" class="btn btn--primary" data-action="det-retry" data-id="${r.id}">Zkusit znovu</button><button type="button" class="btn" data-action="set-export">Exportovat diagnostiku</button>`;
    else if (r.state === 'sent') primary = `<button type="button" class="btn btn--primary" data-action="det-verify" data-id="${r.id}">Ověřit v LuDone</button>`;
    else if (r.state === 'verified') primary = `<button type="button" class="btn btn--primary" data-action="det-web" data-id="${r.id}">Otevřít v LuDone ${I.ext}</button>`;
    const loginNote = S.auth !== 'ok' && (r.state === 'local' || r.state === 'failed') && r.owner === 'alex' && r.error !== 'login'
      ? `<div class="callout callout--err"><b>Přihlášení vypršelo.</b> Odeslat půjde po přihlášení. ${S.login === 'waiting' ? '<span class="spinner" aria-hidden="true"></span>čekám na prohlížeč…' : '<button type="button" class="linkbtn" data-action="login-start">Přihlásit znovu</button>'}</div>` : '';
    const gaps = r.gaps && r.gaps.length ? `<p class="note">Systémový zvuk chybí ${r.gaps.map(gp => `${clock(gp[0])}–${gp[1] ? clock(gp[1]) : 'konec'}`).join(', ')}; mikrofon je celý.</p>` : '';
    return `<button type="button" class="back" data-action="back">${I.back}${S.backTo === 'nahravky' ? 'Nahrávky' : S.backTo === 'nastaveni' ? 'Nastavení' : 'Den'}</button>
      ${editable && r.owner === 'alex' ? `<input id="det-title" class="title-input" type="text" value="${esc(r.title)}" aria-label="Název nahrávky">` : `<h1>${esc(r.title)}</h1>`}
      <p class="v-sub tnum">${r.prevDay ? 'včera ' : ''}${clock(r.start)}–${clock(recEnd(r))} · ${ms(r.dur)} · ${mb(r.size)} · ${r.sysOff ? 'jen mikrofon' : 'mikrofon + systémový zvuk, jeden soubor'}</p>
      ${gaps}
      <dl class="facts">
        <dt>Kam</dt><dd>${editable && r.owner === 'alex' ? firmSeg('det-target', r.target, { id: r.id, label: 'Cílová firma' }) + `<p class="note">${r.targetSource === 'work' ? 'Navrženo podle práce. ' : ''}Změna platí jen pro tuto nahrávku; nic neodešle.</p>`
          : `${r.target ? esc(FIRMS[r.target]) : 'nevybráno'}<p class="note">Odeslanou nahrávku přesouvá mezi firmami správce na webu.</p>`}</dd>
        <dt>Stav</dt><dd><ol class="steps">${stepsHtml}</ol></dd>
        <dt>Souvislost s prací</dt><dd>${segs.length ? segs.map(g => `<button type="button" class="linkbtn" data-action="open-detail" data-kind="seg" data-id="${g.id}">${esc(proj(g.projectId).name)}${g.desc ? ` · ${esc(g.desc)}` : ''}</button> <span class="muted tnum">${clock(g.start)}–${g.live ? 'teď' : clock(g.end)}</span>`).join('<br>')
          + '<p class="note">Jen časový překryv. Nahrávka čas nevytvořila ani nezměnila.</p>' : 'Pořízeno bez práce — žádný čas nevznikl.'}</dd>
        <dt>Vlastník</dt><dd>${r.owner === 'alex' ? 'Alex Novák' : 'jiný účet LuDone na tomto Macu'}</dd>
      </dl>
      ${loginNote}
      <div class="actions">${primary}
        <button type="button" class="btn" data-action="det-finder" data-id="${r.id}">Ukázat ve Finderu</button>
        <button type="button" class="btn btn--ghost-danger" data-action="det-trash" data-id="${r.id}"${r.state === 'uploading' ? ' disabled title="Počkej, až se dokončí odesílání"' : ''}>Přesunout do Koše…</button>
      </div>
      <p class="note">Přepis, analýza a sdílení s týmem se otevírají na webu.</p>`;
  }

  function segDetail() {
    const id = S.detail.id;
    const g = id === 'live' ? daySegs().find(x => x.live) : findSeg(id);
    if (!g) return `<button type="button" class="back" data-action="back">${I.back}Zpět</button><p class="empty">Úsek už tu není.</p>`;
    const p = proj(g.projectId);
    const recs = overlapRecs(g);
    let explain;
    if (g.live) explain = 'Měří se na tomto Macu. Po zastavení se odešle do LuTracku.';
    else if (g.sync === 'pending') explain = !S.net ? 'Uloženo na Macu, čeká na síť.' : S.auth !== 'ok' ? 'Uloženo na Macu, čeká na přihlášení.' : 'Odesílá se do LuTracku.';
    else explain = `LuTrack ho přijal v ${clock(g.confirmedAt || g.end)}. Schválení výkazu probíhá na webu.`;
    const edit = S.edit && S.edit.id === g.id ? `<div class="panelish" style="margin-top:16px">
        <div class="form-grid" style="grid-template-columns:0.5fr 0.5fr 2fr">
          <label class="field"><span class="field-l">Od</span><input id="ed-from" class="input input--time" type="text" inputmode="numeric" value="${esc(S.edit.from)}"></label>
          <label class="field"><span class="field-l">Do</span><input id="ed-to" class="input input--time" type="text" inputmode="numeric" value="${esc(S.edit.to)}"></label>
          <label class="field"><span class="field-l">Popis</span><input id="ed-desc" class="input" type="text" value="${esc(S.edit.desc)}"></label>
        </div>

        <div class="actions"><button type="button" class="btn btn--primary btn--sm" data-action="seg-edit-save">Uložit úpravu</button><button type="button" class="btn btn--sm" data-action="seg-edit-cancel">Zrušit</button></div>
        <p class="note">Úprava se znovu pošle serverem ke potvrzení.</p></div>` : '';
    const actions = g.live
      ? `<button type="button" class="btn btn--primary" data-action="toggle-panel">Ovládat v panelu</button>`
      : g.prevDay ? '' : `<button type="button" class="btn" data-action="seg-edit" data-id="${g.id}">Upravit čas a popis</button>`;
    return `<button type="button" class="back" data-action="back">${I.back}${S.backTo === 'nahravky' ? 'Nahrávky' : 'Den'}</button>
      <h1>${esc(p.name)}</h1>
      <p class="v-sub">${esc(FIRMS[p.firm])} · ${esc(g.desc || 'bez popisu')}</p>
      <dl class="facts">
        <dt>Čas</dt><dd class="tnum">${clock(g.start)}–${g.live ? 'teď' : clock(g.end)} · ${g.live ? `<span data-clock="work-dur">${dur(S.now - g.start)}</span>` : dur(g.end - g.start)}</dd>
        <dt>Stav</dt><dd>${segChip(g, true)}<p class="note">${esc(explain)}</p></dd>
        ${p.alloc ? `<dt>Alokace</dt><dd>zbývá ${p.alloc}<p class="note">Informace z webu. Alokace se na Macu nemění.</p></dd>` : ''}
        <dt>Schůzky během úseku</dt><dd>${recs.length ? recs.map(r => r.live ? 'Nahrávání právě běží' : `<button type="button" class="linkbtn" data-action="open-detail" data-kind="rec" data-id="${r.id}">${esc(r.title)}</button> ${recChip(r)}`).join('<br>') : 'žádné'}</dd>
      </dl>
      ${edit}
      ${S.edit && S.edit.id === g.id ? '' : `<div class="actions">${actions}<button type="button" class="btn btn--ghost" data-action="web-week">Smazat nebo rozdělit na webu ${I.ext}</button></div>`}
      <p class="note">„Potvrzeno serverem" znamená, že LuTrack úsek přijal. Neznamená schválený výkaz.</p>`;
  }

  function settingsView() {
    const sw = (k, label) => `<button type="button" class="switch" role="switch" aria-checked="${!!S.settings[k]}" data-action="set-toggle" data-k="${k}"><span class="sw" aria-hidden="true"></span>${label}</button>`;
    const tgt = [['suggest', 'Navrhnout podle práce'], ['sever', `Vždy ${FIRMS.sever}`], ['jih', `Vždy ${FIRMS.jih}`], ['ask', 'Vždy se zeptat']];
    const u = S.update.stage;
    return `<header class="v-head"><div><h1>Nastavení</h1><p class="v-sub">Běžná práce sem chodit nemusí. Cokoli z denního provozu se opravuje přímo v panelu.</p></div></header>
      <section class="set-group"><h2>Účet</h2>
        <div class="set-row"><span class="set-label">Přihlášení</span><div class="set-ctrl">${S.auth === 'ok' ? 'Alex Novák · přes LuDone' : S.auth === 'expired' ? 'Přihlášení vypršelo' : 'Nepřihlášeno'}
          <div class="actions" style="margin-top:6px">${S.auth === 'ok' ? '<button type="button" class="btn btn--sm" data-action="set-logout">Odhlásit…</button>' : '<button type="button" class="btn btn--sm btn--primary" data-action="login-start">Přihlásit</button>'}</div></div></div>
      </section>
      <section class="set-group"><h2>Nahrávání</h2>
        <div class="set-row"><span class="set-label">Cílová firma</span><div class="set-ctrl"><div class="choices" role="radiogroup" aria-label="Výchozí cílová firma" style="margin-top:0">${tgt.map(([v, l]) => `<button type="button" class="choice" role="radio" aria-checked="${S.settings.target === v}" data-action="set-target" data-v="${v}"><span class="radio" aria-hidden="true"></span><span class="choice-t" style="font-weight:500">${l}</span></button>`).join('')}</div>
          <p class="note">Firmu vždy uvidíš a změníš před odesláním. Projekt v LuTracku a firma nahrávky jsou dvě různá pole.</p></div></div>
        <div class="set-row"><span class="set-label">Automatické odeslání</span><div class="set-ctrl">${sw('autoSend', 'Po skončení nahrávku rovnou odeslat')}
          <p class="note">${S.settings.autoSend ? `Zapnuto od ${clock(S.settings.autoSince)}. ` : ''}Platí jen pro nové nahrávky s vybranou firmou. Starší položky na Macu se neodešlou.</p></div></div>
        <div class="set-row"><span class="set-label">Zdroje</span><div class="set-ctrl sources">${srcLine('Mikrofon', S.settings.mic, 'fix-mic')}${srcLine('Systémový zvuk', S.settings.sys, 'fix-sys')}</div></div>
        <div class="set-row"><span class="set-label">Kopie na Macu</span><div class="set-ctrl"><select id="set-retention" class="input" style="width:auto">
          <option value="14"${S.settings.retention === '14' ? ' selected' : ''}>Smazat 14 dní po ověření</option>
          <option value="30"${S.settings.retention === '30' ? ' selected' : ''}>Smazat 30 dní po ověření</option>
          <option value="never"${S.settings.retention === 'never' ? ' selected' : ''}>Nemazat</option></select>
          <p class="note">Maže jen nahrávky ověřené v LuDone. Nic neodeslaného se nesmaže.</p></div></div>
      </section>
      <section class="set-group"><h2>Mac</h2>
        <div class="set-row"><span class="set-label">Při přihlášení</span><div class="set-ctrl">${sw('login', 'Spustit LuDone do lišty')}</div></div>
        <div class="set-row"><span class="set-label">Ikona v Docku</span><div class="set-ctrl"><select id="set-dock" class="input" style="width:auto">
          <option value="window"${S.settings.dock === 'window' ? ' selected' : ''}>Jen když je otevřené okno</option>
          <option value="always"${S.settings.dock === 'always' ? ' selected' : ''}>Vždy</option></select>
          <p class="note">Aplikace žije v liště. Zavření okna ani panelu nic nezastaví.</p></div></div>
        <div class="set-row"><span class="set-label">Vzhled</span><div class="set-ctrl"><div class="seg" role="radiogroup" aria-label="Téma">${[['light', 'Světlý'], ['professional', 'Profesionální'], ['dark', 'Tmavý']].map(([v, l]) => `<button type="button" role="radio" aria-checked="${S.theme === v}" data-action="set-theme" data-v="${v}">${l}</button>`).join('')}</div></div></div>
        <div class="set-row"><span class="set-label">Klávesy</span><div class="set-ctrl kbd-list">
          <kbd>⌥⌘L</kbd><span>otevřít panel odkudkoli</span><kbd>/</kbd><span>hledat projekt nebo akci</span><kbd>1–3</kbd><span>vybrat přidělený projekt</span><kbd>R</kbd><span>nahrávat / ukončit nahrávání</span><kbd>P</kbd><span>přepnout práci</span><kbd>Esc</kbd><span>zavřít panel, nic nezastaví</span></div></div>
      </section>
      <section class="set-group"><h2>O aplikaci</h2>
        <div class="set-row"><span class="set-label">Verze</span><div class="set-ctrl">LuDone ${S.update.version}${u === 'ready' ? ' · 0.1.5 připravená' : u === 'offered' ? ' · 0.1.5 k dispozici' : ''}<div class="actions" style="margin-top:6px"><button type="button" class="btn btn--sm" data-action="set-check">Zkontrolovat aktualizace</button></div></div></div>
        <div class="set-row"><span class="set-label">Diagnostika</span><div class="set-ctrl"><button type="button" class="btn btn--sm" data-action="set-export">Exportovat diagnostiku…</button><p class="note">Uloží protokol bez zvuku a bez přihlašovacích údajů. Komu ho pošleš, je na tobě.</p></div></div>
        <div class="set-row"><span class="set-label">Ikona a identita</span><div class="set-ctrl"><button type="button" class="btn btn--sm" data-action="set-identity">Zobrazit ikony a témata</button></div></div>
      </section>`;
  }

  function identityView() {
    const states = [
      [{ work: false, rec: false, attention: false }, null, 'Neaktivní'],
      [{ work: true, rec: false, attention: false }, '0:32', 'Čas'],
      [{ work: false, rec: true, attention: false }, '', 'Zvuk'],
      [{ work: true, rec: true, attention: false }, '0:36', 'Obojí'],
      [{ work: true, rec: false, attention: true }, '0:32', 'Pozornost'],
    ];
    const bar = cls => `<div class="bar-demo ${cls}">${states.map(([st, txt, l]) => `<div class="bar-cell"><span class="mb-item">${statusIcon(st, txt == null ? '' : txt)}</span><small>${l}</small></div>`).join('')}</div>`;
    const icons = (cls, desktop) => `<div class="icons-row ${cls}">${[16, 32, 64, 128].map(sz => `<figure>${appIcon(sz, desktop)}<figcaption>${sz} px</figcaption></figure>`).join('')}</div>`;
    const tile = (th, name) => {
      const inner = `<div class="theme-tile"><span class="t-name">${name}</span><div class="proj-name">Web Studia Sever</div><div class="bigclock">0:32:07</div>
        <div class="chips">${chip('live', 'Běží místně')}${chip('pending', 'Čeká na sync')}${chip('ok', 'Potvrzeno')}${chip('err', 'Vyžaduje zásah')}${chip('rec', 'Nahrává')}</div>
        <div class="actions" style="margin-top:0"><button type="button" class="btn btn--primary btn--sm" data-action="noop" tabindex="-1">Zastavit čas</button><button type="button" class="btn btn--sm" data-action="noop" tabindex="-1">Přepnout</button></div></div>`;
      return th === 'professional' ? `<div data-theme="light"><div data-theme="professional">${inner}</div></div>` : `<div data-theme="${th}">${inner}</div>`;
    };
    return `<button type="button" class="back" data-action="tab" data-tab="nastaveni">${I.back}Nastavení</button>
      <header class="v-head"><div><h1>Ikona a identita</h1><p class="v-sub">Dodaná značka LuDone v celé aplikaci. Stav v liště nese tvar a čas, ne barva.</p></div></header>
      <section class="id-sec"><h2>Ikona v liště · 18 px, jedna barva</h2>${bar('bar-demo--light')}${bar('bar-demo--dark')}
        <p class="note">Monochromatický znak používá přesnou geometrii originálu. Tečka vpravo dole = zvuk; čas = práce; plný trojúhelník = pozornost. Stavy jsou oddělené od statické ikony Docku.</p></section>
      <section class="id-sec"><h2>Dock a Finder · LuDone Desktop</h2>
        <h3>Původní ikona LuDone</h3>${icons('icons-row--light', false)}${icons('icons-row--dark', false)}
        <h3>Jemná varianta Desktop</h3>${icons('icons-row--light', true)}${icons('icons-row--dark', true)}
        <p class="note">Doporučení: původní ikona. Je shodná se zbytkem LuDone a její bílé tahy zůstávají přesné i v 16 px. Varianta Desktop přidává pouze malý zelený roh; tvar značky nemění.</p></section>
      <section class="id-sec"><h2>Jeden systém ve třech tématech</h2><div class="theme-tiles">${tile('light', 'Světlé')}${tile('professional', 'Profesionální')}${tile('dark', 'Tmavé')}</div>
        <p class="note">Brockmann pro čas a názvy, Public Sans pro text. Plochy bez zaoblení, ovladače 2 px, zaoblené je jen vnější okno macOS.</p></section>`;
  }

  function closedDesk() {
    const running = S.work || S.rec;
    return `<div class="desk-hint"><p><b>Panel je zavřený.</b></p><p>${running ? 'Měření a nahrávání běží dál. Stav ukazuje ikona v liště nahoře.' : 'LuDone čeká v liště. Klikni na ikonu nahoře nebo stiskni ⌥⌘L.'}</p></div>`;
  }

  function notifHtml() {
    if (!S.notif) return '';
    return `<div class="notif" role="status" aria-label="Oznámení macOS" data-action="noop">${appIcon(32)}<div><b>LuDone</b><p>Verze 0.1.5 je k dispozici. Nic nepřeruší — instalaci spustíš sám, až nic nepoběží.</p></div>
      <div class="notif-actions"><button type="button" class="btn btn--sm" data-action="upd-details">Podrobnosti</button><button type="button" class="btn btn--sm btn--ghost" data-action="notif-close">Zavřít</button></div></div>`;
  }
  function toastHtml() {
    if (!S.toast) return '';
    return `<div class="toast" role="status" data-action="noop"><span>${esc(S.toast.text)}</span>${S.toast.action ? `<button type="button" data-action="toast-action">${esc(S.toast.label)}</button>` : ''}</div>`;
  }

  // ---------- render ----------
  function currentSize() { return S.view === 'window' ? WIN : PANEL; }
  function viewName() {
    if (S.view === 'window') return S.detail ? `okno-detail-${S.detail.kind === 'rec' ? 'nahravka' : 'usek'}` : `okno-${S.tab}`;
    if (!S.panelOpen) return 'lista';
    if (S.onboarding) return `panel-prvni-spusteni-${S.onboarding.step}`;
    return S.sheet ? `panel-${S.sheet.type}` : 'panel';
  }
  function postState() {
    const size = currentSize();
    const msg = { type: 'ludone-experience:state', scenario: S.scenario, theme: S.theme, view: viewName(), width: size.w, height: size.h };
    window.__ludoneState = msg;
    const key = JSON.stringify(msg);
    if (key === lastPosted) return;
    lastPosted = key;
    if (window.parent && window.parent !== window) {
      let origin = '*';
      try { if (location.origin && location.origin !== 'null') origin = location.origin; } catch (e) { /* file:// */ }
      try { window.parent.postMessage(msg, origin); } catch (e) { /* bez rodiče */ }
    }
  }

  function render() {
    const ae = document.activeElement;
    const keepId = ae && ae.id && root.contains(ae) ? ae.id : null;
    let selS = null, selE = null;
    try { if (keepId && ae.selectionStart != null) { selS = ae.selectionStart; selE = ae.selectionEnd; } } catch (e) { /* select */ }
    const scrolls = {};
    root.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });

    const size = currentSize();
    root.style.width = `${size.w}px`; root.style.height = `${size.h}px`;
    document.documentElement.dataset.scenario = S.scenario;
    document.documentElement.dataset.theme = S.theme;
    document.documentElement.dataset.view = viewName();

    const deskInner = S.view === 'panel' ? (S.panelOpen ? panel() : closedDesk()) : windowView();
    root.innerHTML = menubar() + `<div class="desk" data-action="desk">${deskInner}${notifHtml()}${toastHtml()}</div>`;

    root.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll] != null) el.scrollTop = scrolls[el.dataset.scroll]; });
    const want = S.focus || keepId;
    S.focus = null;
    if (want) {
      const el = document.getElementById(want);
      if (el) {
        el.focus({ preventScroll: false });
        try { if (want === keepId && selS != null) el.setSelectionRange(selS, selE); else if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* bez výběru */ }
      }
    }
    tickMeters();
    postState();
  }

  // ---------- běh času ----------
  const isTyping = () => { const a = document.activeElement; return !!(a && a.matches && a.matches('input, select, textarea')); };
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tickMeters() {
    root.querySelectorAll('.meter').forEach(m => {
      const i = m.querySelector('i'); if (!i) return;
      const base_ = m.dataset.meter === 'mic' ? 30 : 22;
      i.style.width = reduced ? `${base_ + 20}%` : `${base_ + Math.round(Math.random() * 50)}%`;
    });
  }
  function clockText(kind) {
    switch (kind) {
      case 'mb-time': return S.work ? hm(S.now - S.work.start) : S.rec ? hm(S.now - S.rec.start) : '';
      case 'mb-clock': return `${S.day.short}  ${clock(S.now)}`;
      case 'work': return S.work ? hms(S.now - S.work.start) : '';
      case 'work-dur': return S.work ? dur(S.now - S.work.start) : '';
      case 'rec': return S.rec ? ms(S.now - S.rec.start) : '';
      case 'total': return dur(totalWork());
      default: return null;
    }
  }
  setInterval(() => {
    if (!S) return;
    S.now += 1;
    root.querySelectorAll('[data-clock]').forEach(el => { const v = clockText(el.dataset.clock); if (v != null && el.textContent !== v) el.textContent = v; });
    tickMeters();
    if (S.now % 60 === 0 && !isTyping() && !S.simOpen) render();
  }, 1000);

  // ---------- události ----------
  root.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || !root.contains(el) || el.disabled) return;
    if (el.tagName === 'INPUT') return;
    act(el.dataset.action, el.dataset);
  });
  root.addEventListener('input', e => {
    const el = e.target, v = el.value;
    switch (el.id) {
      case 'cmd': S.cmd = v; S.cmdIdx = 0; updateResults(); break;
      case 'work-desc': if (S.work) S.work.desc = v; break;
      case 'draft-desc': if (S.draft) S.draft.desc = v; break;
      case 'save-title': if (S.pending) S.pending.title = v; break;
      case 'earlier-custom': if (S.sheet) { S.sheet.custom = v; S.sheet.min = null; } break;
      case 'rv-custom': if (S.recovery) S.recovery.custom = v; break;
      case 'det-title': { const r = S.detail && findRec(S.detail.id); if (r) r.title = v; break; }
      case 'ed-from': S.edit.from = v; break;
      case 'ed-to': S.edit.to = v; break;
      case 'ed-desc': S.edit.desc = v; break;
      case 'add-from': S.add.from = v; break;
      case 'add-to': S.add.to = v; break;
      case 'add-desc': S.add.desc = v; break;
      default: break;
    }
  });
  root.addEventListener('change', e => {
    const el = e.target;
    switch (el.id) {
      case 'add-proj': S.add.projectId = el.value; break;
      case 'set-retention': S.settings.retention = el.value; toast(el.value === 'never' ? 'Kopie na Macu se mazat nebudou.' : `Ověřené kopie se smažou po ${el.value} dnech.`); render(); break;
      case 'set-dock': S.settings.dock = el.value; toast(el.value === 'always' ? 'Ikona zůstane v Docku stále.' : 'Ikona v Docku jen s otevřeným oknem.'); render(); break;
      case 'rv-again': if (S.recovery) S.recovery.again = el.checked; break;
      case 'work-desc': toast('Popis upraven. Platí pro běžící úsek.'); render(); break;
      default: break;
    }
  });
  document.addEventListener('keydown', e => {
    if (!S) return;
    const tg = e.target;
    const typing = tg && tg.matches && tg.matches('input, select, textarea');
    if (e.altKey && e.metaKey && (e.key === 'l' || e.key === 'L' || e.code === 'KeyL')) { e.preventDefault(); act('toggle-panel', {}); return; }
    if (e.key === 'Escape') {
      if (S.simOpen) { S.simOpen = false; render(); return; }
      if (S.sheet) { act('sheet-dismiss', {}); return; }
      if (tg && tg.id === 'cmd' && S.cmd) { S.cmd = ''; render(); S.focus = null; return; }
      if (S.draft) { act(S.draft.mode === 'switch' ? 'switch-cancel' : 'draft-clear', {}); return; }
      if (S.switching) { act('switch-cancel', {}); return; }
      if (S.view === 'window' && S.detail) { act('back', {}); return; }
      if (S.view === 'panel' && S.panelOpen) { S.panelOpen = false; render(); return; }
      return;
    }
    if (tg && tg.id === 'cmd') {
      const rs = results();
      if (e.key === 'ArrowDown' && rs.length) { e.preventDefault(); S.cmdIdx = (S.cmdIdx + 1) % rs.length; updateResults(); }
      else if (e.key === 'ArrowUp' && rs.length) { e.preventDefault(); S.cmdIdx = (S.cmdIdx - 1 + rs.length) % rs.length; updateResults(); }
      else if (e.key === 'Enter' && rs.length) { e.preventDefault(); pickResult(rs[S.cmdIdx] || rs[0]); render(); }
      return;
    }
    if (tg && tg.id === 'draft-desc' && e.key === 'Enter') { e.preventDefault(); act('start', {}); return; }
    if (tg && tg.id === 'save-title' && e.key === 'Enter') { e.preventDefault(); act(S.pending && S.pending.target && S.auth === 'ok' ? 'save-send' : 'save-local', {}); return; }
    if (tg && tg.id === 'earlier-custom' && e.key === 'Enter') { e.preventDefault(); act('earlier-apply', {}); return; }
    if (tg && tg.id === 'work-desc' && e.key === 'Enter') { e.preventDefault(); tg.blur(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (S.view !== 'panel' || !S.panelOpen || S.onboarding || S.sheet) return;
    if (e.key === '/') { e.preventDefault(); S.focus = 'cmd'; render(); }
    else if (['1', '2', '3'].includes(e.key) && (!S.work || S.switching) && !S.draft) {
      const ids = S.switching && S.work ? S.recent.filter(id => id !== S.work.projectId) : S.recent;
      const id = ids[+e.key - 1]; if (id) { chooseProject(id); render(); }
    }
    else if (e.key === 'r' || e.key === 'R') { act(S.rec ? 'rec-stop' : 'rec-start', {}); }
    else if ((e.key === 'p' || e.key === 'P') && S.work && !S.switching) { act('switch-open', {}); }
  });

  window.addEventListener('message', e => {
    if (e.source !== window.parent || window.parent === window) return;
    try { if (location.origin && location.origin !== 'null' && e.origin !== location.origin) return; } catch (err) { return; }
    const d = e.data;
    if (!d || typeof d !== 'object' || d.type !== 'ludone-experience:set') return;
    if (!SCENARIOS.includes(d.scenario) || !THEMES.includes(d.theme)) return;
    loadScenario(d.scenario, d.theme);
  });

  // pro ověřovací skript: stejný vstup jako přepínač koordinátora
  window.__ludone = { load: loadScenario, state: () => S, scenarios: SCENARIOS.slice(), themes: THEMES.slice() };

  const qs = new URLSearchParams(location.search);
  const sc = SCENARIOS.includes(qs.get('scenario')) ? qs.get('scenario') : 'home';
  const th = THEMES.includes(qs.get('theme')) ? qs.get('theme') : 'light';
  loadScenario(sc, th);
})();
</script>
