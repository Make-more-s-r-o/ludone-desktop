<!doctype html>
<html lang="cs" data-theme="light" data-scenario="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuDone — Dvě stopy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22%3E%3Crect x=%224%22 y=%224%22 width=%22120%22 height=%22120%22 rx=%2227%22 fill=%22%23222%22/%3E%3Cpath d=%22M22 88 50 36l22 42 34-30%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%2212%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="styles.css?v=cf38ab7510da">
</head>
<body>
  <!-- Návrh · simulace. Fiktivní data, žádné skutečné API ani systémové efekty. -->
  <div id="app" class="stage"></div>
  <div id="sr" class="sr-only" aria-live="polite"></div>
  <noscript>Prototyp potřebuje JavaScript.</noscript>
  <script>
/* LuDone Desktop — koncept „Dvě stopy". Klikací simulace, fiktivní data.
   Žádné síťové požadavky, žádné systémové efekty: web, Finder i macOS jsou jen popsané předání. */
'use strict';
(function () {
  const SCENARIOS = ['home', 'working', 'meeting', 'save', 'record-only', 'day', 'detail', 'attention',
    'offline', 'recovery', 'settings', 'update', 'onboarding', 'identity'];
  const THEMES = ['light', 'professional', 'dark'];
  const PANEL = { w: 416, h: 680 };
  const WIN = { w: 700, h: 760 };
  const MB_PER_MIN = 0.732; // 12:34 → 9,2 MB; 6:08 → 4,5 MB; 8:42 → 6,4 MB

  const FIRMS = { sever: 'Studio Sever', jih: 'Ateliér Jih' };
  const PROJECTS = [
    { id: 'web', name: 'Web Studia Sever', firm: 'sever', alloc: '18 h 40 min', descs: ['Příprava obsahu'] },
    { id: 'int', name: 'Interní rozvoj', firm: 'sever', alloc: null, descs: ['Plán týdne'] },
    { id: 'jih', name: 'Podpora Ateliéru Jih', firm: 'jih', alloc: null, descs: ['Odpověď na dotazy'] },
  ];
  const COMMANDS = [
    { id: 'rec', keys: ['nahrat', 'nahravat', 'schuzka', 'zvuk'], label: 'Nahrát schůzku', sub: 'zvuk · nevytvoří čas' },
    { id: 'day', keys: ['den', 'dnes', 'prehled'], label: 'Otevřít dnešní den', sub: 'okno' },
    { id: 'recs', keys: ['nahravky'], label: 'Nahrávky na tomto Macu', sub: 'okno' },
    { id: 'settings', keys: ['nastaveni'], label: 'Nastavení', sub: 'okno' },
  ];
  const KNOWN_TITLES = ['Týdenní domluva'];

  // ---------- pomocníci ----------
  const t = (h, m, s = 0) => h * 3600 + m * 60 + s;
  const pad = n => String(n).padStart(2, '0');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clock = sec => { sec = ((Math.floor(sec) % 86400) + 86400) % 86400; return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}`; };
  const hms = sec => { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}:${pad(sec % 60)}`; };
  const hm = sec => { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 3600)}:${pad(Math.floor(sec / 60) % 60)}`; };
  const ms = sec => { sec = Math.max(0, Math.floor(sec)); return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; };
  const dur = sec => { const m = Math.max(0, Math.round(sec / 60)); if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} h ${r} min` : `${h} h`; };
  const mb = x => `${x.toFixed(1).replace('.', ',')} MB`;
  const sizeOf = sec => Math.round(sec / 60 * MB_PER_MIN * 10) / 10;
  const proj = id => PROJECTS.find(p => p.id === id);
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const parseTime = str => { const m = /^(\d{1,2})[:.](\d{2})$/.exec(String(str || '').trim()); if (!m) return null; const h = +m[1], mi = +m[2]; return h > 23 || mi > 59 ? null : t(h, mi); };
  let uidN = 0;
  const uid = p => `${p}-${++uidN}`;

  const I = {
    brand: '<img src="assets/LuDone.svg" alt="" aria-hidden="true">',
    check: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3 5 8.6l4.6-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    wait: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.3" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6 3.8V6l1.6 1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
    alert: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.4 11.2 10.5H.8Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6 4.8v2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="6" cy="9" r=".75" fill="currentColor"/></svg>',
    mac: '<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2.3" width="8" height="5.6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M.8 10h10.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    up: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2.5M3 5.3 6 2.4l3 2.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    dot: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="3.2" fill="currentColor"/></svg>',
    work: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8v3.4l2.3 1.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    wave: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h1M5 5.5v5M8 3v10M11 5v6M14 8h-.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    search: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    gear: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="11" cy="4.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="5" cy="11.5" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
    win: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 6h12" stroke="currentColor" stroke-width="1.4"/></svg>',
    ext: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5h6.5V10M12.3 3.7 4 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    x: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    stop: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" fill="currentColor"/></svg>',
    back: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    bolt: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2 4 9h4l-1 5 5-7H8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
    wifi: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2a8.5 8.5 0 0 1 12 0M4.3 8.6a5.2 5.2 0 0 1 7.4 0M6.5 11a2 2 0 0 1 3 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    wifiOff: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6.2a8.5 8.5 0 0 1 12 0M4.3 8.6a5.2 5.2 0 0 1 7.4 0M6.5 11a2 2 0 0 1 3 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".35"/><path d="m3 2.5 10 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  };

  function appIcon(size, desktop = false) {
    // Dock / Finder drží originál DS beze změny; druhá varianta přidává jen malý roh.
    return `<span class="appicon${desktop ? ' appicon--desktop' : ''}" style="width:${size}px;height:${size}px" aria-hidden="true"><img src="assets/LuDone.svg" width="${size}" height="${size}" alt=""></span>`;
  }

  // ---------- stav ----------
  let S = null;
  let timers = [];
  let lastPosted = '';
  const root = document.getElementById('app');

  function later(ms_, fn, rerender = true) {
    const id = setTimeout(() => {
      timers = timers.filter(x => x !== id);
      fn();
      if (rerender) render();
    }, ms_);
    timers.push(id);
  }

  function tyden(over) {
    return Object.assign({
      id: 'r-tyden', title: 'Týdenní domluva', start: t(10, 47), dur: 754, size: 9.2, target: 'sever', targetSource: 'work',
      state: 'verified', error: null, owner: 'alex',
      log: { local: t(10, 59, 34), queued: t(10, 59, 40), sent: t(11, 0, 2), verified: t(11, 0, 5) },
    }, over || {});
  }

  function base() {
    return {
      scenario: 'home', theme: 'light', view: 'panel', panelOpen: true, tab: 'den', detail: null, backTo: 'den',
      sheet: null, focus: null, simOpen: false, toast: null, notif: null,
      now: t(10, 14, 30), day: { short: 'St 23. 9.', long: 'Středa 23. září', week: 39 },
      net: true, netSince: null, auth: 'ok', login: null, onboarding: null, firstRun: false,
      work: null, draft: null, cmd: '', cmdIdx: 0, switching: false,
      rec: null, pending: null, result: null,
      segments: [
        { id: 's-plan', projectId: 'int', desc: 'Plán týdne', start: t(8, 5), end: t(8, 50), sync: 'confirmed', confirmedAt: t(8, 50, 3) },
        { id: 's-jih', projectId: 'jih', desc: 'Odpověď na dotazy', start: t(8, 52), end: t(9, 32), sync: 'confirmed', confirmedAt: t(9, 32, 2) },
      ],
      recordings: [
        { id: 'r-kontrola', title: 'Kontrola rozpočtu', start: t(8, 20), dur: 8 * 60 + 42, size: 6.4, target: 'sever', targetSource: 'manual',
          state: 'failed', error: 'login', owner: 'alex', failedAt: t(8, 31), log: { local: t(8, 29), queued: t(8, 29) } },
        { id: 'r-navrh', title: 'Návrh webu', start: t(9, 10), dur: 6 * 60 + 8, size: 4.5, target: 'sever', targetSource: 'manual',
          state: 'local', error: null, owner: 'alex', log: { local: t(9, 16, 10) } },
      ],
      update: { stage: 'none', progress: 0, version: '0.1.4' },
      settings: { autoSend: false, autoSince: null, target: 'suggest', retention: '14', login: true, dock: 'window', mic: 'ok', sys: 'ok' },
      recovery: null, filter: 'all', refreshedAt: t(10, 14), failNext: null,
      add: null, edit: null, trashed: null, recent: ['jih', 'int', 'web'],
    };
  }

  function liveWork(s, start) { s.work = { projectId: 'web', desc: 'Příprava obsahu', start }; s.recent = ['web', 'jih', 'int']; }
  function liveRec(s, start, target) {
    s.rec = { start, target: target || null, targetSource: target ? 'work' : 'none', sys: 'ok', lostAt: null, gaps: [], notice: null };
  }

  function loadScenario(name, theme) {
    timers.forEach(clearTimeout); timers = [];
    const s = base();
    s.scenario = name; s.theme = theme;
    switch (name) {
      case 'home': break;
      case 'working': s.now = t(10, 47); liveWork(s, t(10, 15)); break;
      case 'meeting': s.now = t(10, 51, 12); liveWork(s, t(10, 15)); liveRec(s, t(10, 47), 'sever'); break;
      case 'save':
        s.now = t(10, 59, 34); liveWork(s, t(10, 15));
        s.pending = { id: 'r-tyden', start: t(10, 47), dur: 754, size: 9.2, target: 'sever', targetSource: 'work', title: '', gaps: [], sysOff: false };
        s.sheet = { type: 'save' }; s.focus = 'save-title'; break;
      case 'record-only': s.now = t(12, 20); liveRec(s, t(12, 17, 55), null); break;
      case 'day': case 'detail':
        s.now = t(11, 5); liveWork(s, t(10, 15)); s.recordings.push(tyden());
        s.view = 'window'; s.tab = 'den';
        if (name === 'detail') { s.detail = { kind: 'rec', id: 'r-tyden' }; s.backTo = 'den'; }
        break;
      case 'attention':
        s.now = t(11, 40); s.auth = 'expired';
        s.segments.push({ id: 's-web', projectId: 'web', desc: 'Příprava obsahu', start: t(9, 45), end: t(10, 40), sync: 'pending' });
        s.recordings.push(tyden({ state: 'failed', error: 'firm', target: null, targetSource: 'none', log: { local: t(10, 59, 34) } }));
        s.recent = ['web', 'jih', 'int'];
        break;
      case 'offline':
        s.now = t(10, 53); liveWork(s, t(10, 15)); liveRec(s, t(10, 47), 'sever'); s.net = false; s.netSince = t(10, 50); break;
      case 'recovery':
        s.day = { short: 'Čt 24. 9.', long: 'Čtvrtek 24. září', week: 39 };
        s.now = t(8, 3); s.segments = []; s.auth = 'expired';
        s.recordings.forEach(r => { r.prevDay = true; });
        s.recovery = { projectId: 'web', desc: 'Příprava obsahu', start: t(16, 40), lastSeen: t(18, 12), restartAt: t(8, 3), prevDay: true, choice: 'last', custom: '18:12', again: false, err: null };
        s.sheet = { type: 'recovery' }; s.recent = ['web', 'jih', 'int'];
        break;
      case 'settings': s.now = t(10, 47); liveWork(s, t(10, 15)); s.view = 'window'; s.tab = 'nastaveni'; break;
      case 'update':
        s.now = t(10, 51, 12); liveWork(s, t(10, 15)); liveRec(s, t(10, 47), 'sever');
        s.update.stage = 'offered'; s.notif = { type: 'update' }; break;
      case 'onboarding':
        s.now = t(8, 2); s.segments = []; s.recordings = []; s.auth = 'none'; s.recent = ['web', 'int', 'jih'];
        s.settings.mic = 'ask'; s.settings.sys = 'ask';
        s.onboarding = { step: 1, wantTime: true, wantRec: true }; break;
      case 'identity': s.now = t(10, 47); liveWork(s, t(10, 15)); s.view = 'window'; s.tab = 'identita'; break;
      default: break;
    }
    S = s;
    render();
  }

  // ---------- odvozené hodnoty ----------
  const todaySegs = () => S.segments.filter(g => !g.prevDay);
  function daySegs() {
    const list = todaySegs().slice();
    if (S.work) list.push({ id: 'live', projectId: S.work.projectId, desc: S.work.desc, start: S.work.start, end: S.now, live: true });
    return list;
  }
  function dayRecs() {
    const list = S.recordings.filter(r => !r.prevDay).slice();
    if (S.pending) list.push(Object.assign({}, S.pending, { state: 'local', unsaved: true, title: S.pending.title || `Schůzka ${clock(S.pending.start)}` }));
    if (S.rec) list.push({ id: 'live-rec', start: S.rec.start, dur: S.now - S.rec.start, live: true, target: S.rec.target });
    return list;
  }
  const totalWork = () => daySegs().reduce((a, g) => a + (g.end - g.start), 0);
  const recEnd = r => r.start + r.dur;
  function overlapSegs(r) {
    if (r.prevDay) return [];
    const end = r.live ? S.now : recEnd(r);
    return daySegs().filter(g => g.start < end && g.end > r.start);
  }
  function overlapRecs(g) {
    return dayRecs().filter(r => r.start < g.end && (r.live ? S.now : recEnd(r)) > g.start);
  }
  function lastSegment() {
    const list = todaySegs().slice().sort((a, b) => b.end - a.end);
    return list[0] || null;
  }
  function lastDesc(pid) {
    const g = S.segments.filter(x => x.projectId === pid).sort((a, b) => b.end - a.end)[0];
    return g ? g.desc : proj(pid).descs[0];
  }
  const findRec = id => S.recordings.find(r => r.id === id);
  const findSeg = id => S.segments.find(g => g.id === id);
  const busyList = () => {
    const l = [];
    if (S.work) l.push('měření');
    if (S.rec) l.push('nahrávání');
    if (S.pending || S.recordings.some(r => r.state === 'uploading')) l.push('ukládání');
    return l;
  };
  const isIdle = () => busyList().length === 0;
  function needsCount() {
    let n = S.recordings.filter(r => r.state === 'failed').length;
    if (S.auth === 'expired') n++;
    return n;
  }

  // ---------- fronta a server (simulace) ----------
  function processQueue() {
    if (!S.net || S.auth !== 'ok') return;
    S.segments.filter(g => g.sync === 'pending' && !g._q).forEach(g => {
      g._q = true;
      later(1100, () => {
        g._q = false;
        if (!S.segments.includes(g) || !S.net || S.auth !== 'ok') return;
        g.sync = 'confirmed'; g.confirmedAt = S.now;
      });
    });
    S.recordings.filter(r => r.state === 'queued' && !r._q).forEach(upload);
    S.recordings.filter(r => r.state === 'sent' && !r._v).forEach(verifyLater);
  }
  function upload(r) {
    r._q = true; r.state = 'uploading'; r.progress = 0;
    const step = () => {
      if (!S.recordings.includes(r)) return;
      if (!S.net) { r.state = 'queued'; r._q = false; r.progress = 0; render(); return; }
      r.progress = Math.min(100, r.progress + 25);
      if (r.progress >= 100) {
        r._q = false;
        if (S.failNext === 'limit') {
          S.failNext = null; r.state = 'failed'; r.error = 'limit'; r.failedAt = S.now; render(); return;
        }
        r.state = 'sent'; r.log.sent = S.now; render();
        verifyLater(r);
        return;
      }
      render();
      later(420, step, false);
    };
    later(420, step, false);
  }
  function verifyLater(r) {
    r._v = true;
    later(1500, () => {
      r._v = false;
      if (r.state === 'sent' && S.net && S.auth === 'ok') { r.state = 'verified'; r.log.verified = S.now; }
    });
  }
  function sendRec(r) {
    r.error = null; r.pick = null;
    if (!r.target) { r.state = 'failed'; r.error = 'firm'; r.failedAt = S.now; return; }
    if (S.auth !== 'ok') { r.state = 'failed'; r.error = 'login'; r.failedAt = S.now; return; }
    r.state = 'queued'; r.log.queued = S.now;
    processQueue();
  }

  // ---------- akce ----------
  function toast(text, action, label) {
    const id = uid('t');
    S.toast = { id, text, action, label };
    const sr = document.getElementById('sr');
    if (sr) sr.textContent = text;
    later(action ? 7000 : 4200, () => { if (S.toast && S.toast.id === id) S.toast = null; });
  }

  function startDraft() {
    const d = S.draft; if (!d) return;
    const p = proj(d.projectId);
    let closed = null;
    if (d.mode === 'switch' && S.work) closed = stopWork(true);
    S.work = { projectId: d.projectId, desc: d.desc.trim(), start: S.now };
    S.recent = [d.projectId].concat(S.recent.filter(x => x !== d.projectId));
    S.draft = null; S.switching = false; S.cmd = ''; S.result = null; S.firstRun = false;
    if (S.rec) {
      if (S.rec.target !== p.firm) S.rec.notice = { from: S.rec.target, to: p.firm, project: p.name };
      else S.rec.notice = { same: true, from: S.rec.target, project: p.name };
    }
    if (closed) toast(`Uloženo ${proj(closed.projectId).name} · ${closed.desc || 'bez popisu'} (${dur(closed.end - closed.start)}). Teď běží ${p.name}.`);
    else toast(`Měřím ${p.name}. Panel můžeš zavřít, čas poběží dál.`);
  }

  function stopWork(silent) {
    const w = S.work; if (!w) return null;
    const g = { id: uid('s'), projectId: w.projectId, desc: w.desc, start: w.start, end: S.now, sync: 'pending' };
    S.segments.push(g); S.work = null;
    processQueue();
    if (!silent) {
      const recs = dayRecs().filter(r => !r.live && !r.unsaved && r.start < g.end && recEnd(r) > g.start);
      if (recs.length) S.result = { segId: g.id, recIds: recs.map(r => r.id) };
      toast(`Uloženo ${proj(g.projectId).name} · ${dur(g.end - g.start)}.`, 'resume', 'Pokračovat');
    }
    return g;
  }

  function recStart() {
    if (S.rec) return;
    if (S.pending) { S.sheet = { type: 'save' }; S.focus = 'save-title'; toast('Nejdřív ulož předchozí nahrávku, aby se neztratila.'); return; }
    if (S.settings.mic !== 'ok') { toast('Mikrofon zatím nemá oprávnění. Povol ho u tlačítka Nahrát.'); return; }
    let target = null, src = 'none';
    if (S.settings.target === 'suggest' && S.work) { target = proj(S.work.projectId).firm; src = 'work'; }
    else if (S.settings.target === 'sever' || S.settings.target === 'jih') { target = S.settings.target; src = 'default'; }
    S.rec = { start: S.now, target, targetSource: src, sys: S.settings.sys === 'ok' ? 'ok' : 'off', lostAt: null, gaps: [], notice: null };
    toast(S.work ? 'Nahrávám. Čas běží dál nezávisle.' : 'Nahrávám. Žádný čas se nevytváří.');
  }

  function recStop() {
    const r = S.rec; if (!r) return;
    const d = S.now - r.start;
    const gaps = r.gaps.slice();
    if (r.sys === 'lost') gaps.push([r.lostAt, S.now]);
    S.pending = { id: uid('r'), start: r.start, dur: d, size: sizeOf(d), target: r.target, targetSource: r.targetSource, title: '', gaps, sysOff: r.sys === 'off' };
    S.rec = null;
    const auto = S.settings.autoSend && S.settings.autoSince != null && S.pending.start >= S.settings.autoSince && S.pending.target;
    if (auto) {
      const rec = finalizePending('send');
      toast(`„${rec.title}" uložena a odeslána automaticky do ${FIRMS[rec.target]}.`, 'open-rec:' + rec.id, 'Přejmenovat');
      return;
    }
    S.sheet = { type: 'save' }; S.focus = 'save-title';
  }

  function finalizePending(mode) {
    const p = S.pending; if (!p) return null;
    const r = { id: p.id, title: (p.title || '').trim() || `Schůzka ${clock(p.start)}`, start: p.start, dur: p.dur, size: p.size,
      target: p.target, targetSource: p.targetSource, state: 'local', error: null, owner: 'alex', gaps: p.gaps, sysOff: p.sysOff,
      log: { local: p.start + p.dur } };
    if (!findRec(r.id)) S.recordings.push(r);
    S.pending = null;
    if (S.sheet && S.sheet.type === 'save') S.sheet = null;
    if (mode === 'send') sendRec(r);
    return r;
  }

  function openWindow(tab, detail) {
    S.view = 'window'; S.simOpen = false;
    if (tab) S.tab = tab;
    S.detail = detail || null;
    if (S.sheet && S.sheet.type !== 'save' && S.sheet.type !== 'recovery') S.sheet = null;
  }

  function handoff(kind, r) {
    const map = {
      week: `Prohlížeč by otevřel ludone.cz/time-tracking › Přehled, týden ${S.day.week}. Simulace — nic se neotevřelo.`,
      recs: 'Prohlížeč by otevřel LuDone › Nahrávky (týmový archiv). Simulace — nic se neotevřelo.',
      rec: r ? `Prohlížeč by otevřel LuDone › Nahrávky › „${r.title}" s přepisem a analýzou. Simulace.` : '',
      finder: r ? `Finder by ukázal „${r.title}" ve složce Nahrávky LuDone. Simulace.` : '',
      sys: 'Nastavení systému by se otevřelo v Soukromí › Záznam obrazovky a systémového zvuku. Simulace.',
      mic: 'macOS by se zeptal na přístup k mikrofonu. Simulace: povoleno.',
      diag: 'Diagnostika by se uložila na Plochu jako LuDone-diagnostika-2026-09-23.zip — bez zvuku a bez přihlašovacích údajů. Simulace.',
    };
    toast(map[kind]);
  }

  function act(a, d) {
    const wasSim = S.simOpen;
    if (S.simOpen && a !== 'sim-toggle' && !a.startsWith('sim-')) S.simOpen = false;
    const r = d && d.id ? findRec(d.id) : null;
    switch (a) {
      case 'noop': return;
      case 'desk': if (wasSim) break; if (S.view === 'panel' && S.panelOpen && !S.sheet) S.panelOpen = false; else return; break;
      case 'toggle-panel':
        if (S.view === 'window') { S.view = 'panel'; S.panelOpen = true; }
        else S.panelOpen = !S.panelOpen;
        S.simOpen = false; break;
      case 'open-window': openWindow(d.tab); break;
      case 'close-window': S.view = 'panel'; S.panelOpen = false; S.detail = null;
        if (S.sheet && S.sheet.type !== 'save' && S.sheet.type !== 'recovery') S.sheet = null;
        toast(S.work || S.rec ? 'Okno zavřené. Měření a nahrávání běží dál v liště.' : 'Okno zavřené. LuDone zůstává v liště.');
        break;
      case 'tab': S.tab = d.tab; S.detail = null; S.edit = null; break;
      case 'back': S.detail = null; S.edit = null; S.tab = S.backTo || 'den'; break;
      case 'open-detail':
        if (d.id === 'live' || d.id === 'live-rec') { S.view = 'panel'; S.panelOpen = true; break; }
        if (d.id && d.id === (S.pending && S.pending.id)) { S.view = 'panel'; S.panelOpen = true; break; }
        S.backTo = S.view === 'window' ? (S.tab === 'identita' ? 'nastaveni' : S.tab) : 'den';
        openWindow(S.backTo, { kind: d.kind, id: d.id }); S.edit = null; break;

      // simulace prostředí
      case 'sim-toggle': S.simOpen = !S.simOpen; break;
      case 'sim-net-off': S.net = false; S.netSince = S.now; S.simOpen = false; toast('Síť vypadla. Vše dál běží a ukládá se na Mac.'); break;
      case 'sim-net-on': {
        S.net = true; S.netSince = null; S.simOpen = false;
        const nSeg = S.segments.filter(g => g.sync === 'pending').length;
        const nRec = S.recordings.filter(x => x.state === 'queued').length;
        processQueue();
        toast(nSeg || nRec ? `Síť je zpět. Odesílám frontu: ${nSeg} úsek(y) času, ${nRec} nahrávk(y). Místní položky „Na Macu" zůstávají.` : 'Síť je zpět. Nic nečekalo ve frontě.');
        break;
      }
      case 'sim-restart': simRestart(); break;
      case 'sim-sys-lost': if (S.rec) { S.rec.sys = 'lost'; S.rec.lostAt = S.now; } S.simOpen = false; break;
      case 'sim-auth': S.auth = 'expired'; S.simOpen = false; toast('Přihlášení vypršelo. Nic se neztratí, jen čeká.'); break;
      case 'sim-limit': S.failNext = 'limit'; S.simOpen = false; toast('Příští odeslání server odmítne kvůli velikosti.'); break;
      case 'sim-owner': {
        const x = S.recordings.find(y => y.id === 'r-navrh') || S.recordings.find(y => y.state === 'local');
        if (x) { x.state = 'failed'; x.error = 'owner'; x.owner = 'other'; x.failedAt = S.now; toast(`„${x.title}" podle serveru patří jinému účtu.`); }
        else toast('Není žádná místní nahrávka, na které to ukázat.');
        S.simOpen = false; break;
      }
      case 'sim-update': S.update = { stage: 'offered', progress: 0, version: S.update.version }; S.notif = { type: 'update' }; S.simOpen = false; break;
      case 'sim-time': S.now += 600; S.simOpen = false; toast('Čas posunut o 10 minut.'); break;

      // práce
      case 'cmd-pick': {
        const list = results();
        const item = list[+d.i];
        if (item) pickResult(item);
        break;
      }
      case 'recent': chooseProject(d.id); break;
      case 'draft-clear': S.draft = null; S.focus = 'cmd'; break;
      case 'desc-chip': if (S.draft) { S.draft.desc = d.desc; S.focus = 'draft-desc'; } break;
      case 'start': startDraft(); break;
      case 'resume': {
        S.result = null;
        const g = lastSegment(); if (!g || S.work) break;
        S.draft = { projectId: g.projectId, desc: g.desc, mode: 'start' }; startDraft(); break;
      }
      case 'stop-work': stopWork(false); break;
      case 'switch-open': S.switching = true; S.cmd = ''; S.draft = null; S.focus = 'cmd'; break;
      case 'switch-cancel': S.switching = false; S.draft = null; S.cmd = ''; break;
      case 'earlier-open': S.sheet = { type: 'earlier', min: null, custom: '', err: null }; break;
      case 'earlier-pick': S.sheet.min = +d.min; S.sheet.custom = ''; S.sheet.err = null; break;
      case 'earlier-apply': applyEarlier(); break;
      case 'result-close': S.result = null; break;

      // zvuk
      case 'rec-start': recStart(); break;
      case 'rec-stop': recStop(); break;
      case 'rec-target': if (S.rec) { S.rec.target = d.firm === 'none' ? null : d.firm; S.rec.targetSource = 'manual'; S.rec.notice = null; } break;
      case 'notice-keep': if (S.rec) S.rec.notice = null; break;
      case 'notice-change': if (S.rec && S.rec.notice) { S.rec.target = S.rec.notice.to; S.rec.targetSource = 'manual'; toast(`Cíl nahrávky změněn na ${FIRMS[S.rec.notice.to]}. Odešle se až po tvém potvrzení.`); S.rec.notice = null; } break;
      case 'sys-retry': if (S.rec) { S.rec.gaps.push([S.rec.lostAt, S.now]); S.rec.sys = 'ok'; S.rec.lostAt = null; toast(`Systémový zvuk znovu nahrává. Mezera ${S.rec.gaps.length ? 'je zapsaná v detailu' : ''}.`); } break;
      case 'sys-mic-only': if (S.rec) { S.rec.gaps.push([S.rec.lostAt, null]); S.rec.sys = 'off'; S.rec.lostAt = null; } break;
      case 'fix-sys': handoff('sys'); later(1200, () => { S.settings.sys = 'ok'; toast('Systémový zvuk povolen. Platí od příští nahrávky.'); }); break;
      case 'fix-mic': handoff('mic'); S.settings.mic = 'ok'; break;

      // uložení nahrávky
      case 'save-target': if (S.pending) { S.pending.target = d.firm === 'none' ? null : d.firm; S.pending.targetSource = 'manual'; } break;
      case 'title-chip': if (S.pending) { S.pending.title = d.title; S.focus = 'save-title'; } break;
      case 'save-send': {
        if (!S.pending || !S.pending.target || S.auth !== 'ok') break;
        const x = finalizePending('send');
        toast(S.net ? `„${x.title}" se odesílá do ${FIRMS[x.target]}.` : `„${x.title}" je ve frontě. Odešle se, až bude síť.`);
        break;
      }
      case 'save-local': {
        const x = finalizePending('local');
        if (x) toast(`„${x.title}" zůstává jen na Macu. Odeslat ji můžeš kdykoli z přehledu.`);
        break;
      }

      // čeká na tebe
      case 'login-start': S.login = 'waiting'; toast('Prohlížeč by otevřel přihlášení LuDone. Simulace dokončí návrat za chvíli.');
        later(2200, () => {
          if (S.login !== 'waiting') return;
          S.login = null; S.auth = 'ok';
          toast('Přihlášeno jako Alex Novák. Čas se synchronizuje sám; nahrávky odešleš ty.');
          processQueue();
        });
        break;
      case 'login-cancel': S.login = null; break;
      case 'need-firm': if (r) r.pick = d.firm; break;
      case 'need-send': if (r && r.pick) { r.target = r.pick; r.targetSource = 'manual'; sendRec(r); toast(`„${r.title}" se odesílá do ${FIRMS[r.target]}.`); } break;
      case 'need-retry': case 'det-retry': case 'det-send':
        if (r) { if (r.owner !== 'alex') break; sendRec(r); if (r.state !== 'failed') toast(`„${r.title}" ${S.net ? 'se odesílá' : 'čeká ve frontě'} do ${FIRMS[r.target]}.`); }
        break;
      case 'need-local': if (r) { r.state = 'local'; r.error = null; r.pick = null; toast(`„${r.title}" zůstává na Macu.`); } break;

      // detail
      case 'det-target': if (r && r.owner === 'alex' && (r.state === 'local' || r.state === 'failed')) {
        const next = d.firm === 'none' ? null : d.firm;
        if (r.target !== next) { r.target = next; r.targetSource = 'manual'; r.state = 'local'; r.error = null; r.pick = null; toast('Cíl změněn jen na tomto Macu. K odeslání do nové firmy je potřeba nové potvrzení.'); }
      } break;
      case 'det-verify': if (r) { if (!S.net) { toast('Bez sítě nejde ověřit. Zkusím to, až bude připojení.'); break; } r._v = false; toast('Ověřuji v LuDone…'); verifyLater(r); } break;
      case 'det-web': if (r) handoff('rec', r); break;
      case 'det-finder': if (r) handoff('finder', r); break;
      case 'det-trash': if (r) S.sheet = { type: 'trash', id: r.id }; break;
      case 'trash-confirm': {
        const x = findRec(S.sheet.id);
        if (x) {
          const idx = S.recordings.indexOf(x);
          S.recordings.splice(idx, 1); S.trashed = { r: x, idx };
          if (S.detail && S.detail.id === x.id) { S.detail = null; S.tab = S.backTo || 'den'; }
          S.sheet = null;
          toast(`„${x.title}" je v Koši macOS.`, 'trash-undo', 'Vrátit');
        }
        break;
      }
      case 'trash-undo': if (S.trashed) { S.recordings.splice(S.trashed.idx, 0, S.trashed.r); toast(`„${S.trashed.r.title}" je zpět.`); S.trashed = null; } break;
      case 'owner-open': if (r) S.sheet = { type: 'owner', id: r.id }; break;
      case 'owner-confirm': { const x = findRec(S.sheet.id); if (x) { x.owner = 'alex'; x.state = 'local'; x.error = null; toast(`„${x.title}" je teď tvoje a zůstává na Macu. Odeslat ji můžeš hned.`); } S.sheet = null; break; }
      case 'seg-edit': { const g = findSeg(d.id); if (g) S.edit = { id: g.id, from: clock(g.start), to: clock(g.end), desc: g.desc, err: null }; break; }
      case 'seg-edit-cancel': S.edit = null; break;
      case 'seg-edit-save': saveEdit(); break;
      case 'add-open': S.add = { projectId: S.recent[0], from: '', to: '', desc: '', err: null }; S.focus = 'add-from'; break;
      case 'add-cancel': S.add = null; break;
      case 'add-save': saveAdd(); break;
      case 'web-week': handoff('week'); break;
      case 'web-recs': handoff('recs'); break;
      case 'refresh-list': {
        S.refreshedAt = S.now;
        if (!S.net) { toast('Bez sítě: přehled ukazuje jen stav na Macu.'); break; }
        S.recordings.filter(x => x.state === 'sent').forEach(x => { x.state = 'verified'; x.log.verified = S.now; });
        toast('Přehled obnoven proti LuDone. Místní položky se nezměnily.');
        break;
      }
      case 'filter': S.filter = d.f; break;

      // aktualizace
      case 'upd-details': S.notif = null; if (S.view !== 'panel') { S.view = 'panel'; } S.panelOpen = true; S.sheet = { type: 'update' }; break;
      case 'notif-close': S.notif = null; break;
      case 'upd-prepare':
        S.sheet = null; S.update.stage = 'downloading'; S.update.progress = 0;
        { const step = () => { S.update.progress += 20; if (S.update.progress >= 100) { S.update.stage = 'ready'; render(); return; } render(); later(380, step, false); }; later(380, step, false); }
        break;
      case 'upd-later': S.sheet = null; S.update.stage = 'later'; S.notif = null; toast('Připomenu se zítra ráno. Aktualizace je i v Nastavení › O aplikaci.'); break;
      case 'upd-install':
        if (S.update.stage !== 'ready') break;
        if (!isIdle()) { toast(`Instalace počká, až skončí: ${busyList().join(', ')}.`); break; }
        S.update.stage = 'installing';
        later(1800, () => { S.update.stage = 'done'; S.update.version = '0.1.5'; toast('LuDone 0.1.5 · Práce a schůzky na jednom místě.'); });
        break;

      // obnova po restartu
      case 'rv-choice': S.recovery.choice = d.c; S.recovery.err = null; if (d.c === 'custom') S.focus = 'rv-custom'; break;
      case 'rv-confirm': confirmRecovery(); break;

      // onboarding
      case 'ob-login': S.onboarding.waiting = true;
        later(1800, () => { if (!S.onboarding) return; S.onboarding.waiting = false; S.auth = 'ok'; S.onboarding.step = 2; });
        break;
      case 'ob-cancel': S.onboarding.waiting = false; break;
      case 'ob-want': S.onboarding[d.w] = !S.onboarding[d.w]; break;
      case 'ob-next':
        if (S.onboarding.step === 2 && S.onboarding.wantRec) S.onboarding.step = 3;
        else finishOnboarding();
        break;
      case 'ob-mic': S.settings.mic = 'ok'; toast('macOS: mikrofon povolen (simulace).'); break;
      case 'ob-sys': handoff('sys'); later(1200, () => { S.settings.sys = 'ok'; }); break;
      case 'ob-finish': finishOnboarding(); break;

      // nastavení
      case 'set-toggle': {
        const k = d.k; S.settings[k] = !S.settings[k];
        if (k === 'autoSend') {
          S.settings.autoSince = S.settings.autoSend ? S.now : null;
          toast(S.settings.autoSend ? `Automatické odeslání platí pro nahrávky od ${clock(S.now)}. Starší položky na Macu zůstávají, kde jsou.` : 'Automatické odeslání vypnuto.');
        }
        break;
      }
      case 'set-target': S.settings.target = d.v; break;
      case 'set-theme': S.theme = d.v; break;
      case 'set-export': handoff('diag'); break;
      case 'set-check':
        if (S.update.stage === 'none' || S.update.stage === 'later') { S.update.stage = 'offered'; toast('Je k dispozici 0.1.5. Nabídka je v panelu.'); }
        else if (S.update.stage === 'done') toast('Máš nejnovější verzi 0.1.5.');
        else toast('Aktualizace 0.1.5 už je nabídnutá v panelu.');
        break;
      case 'set-logout': S.sheet = { type: 'logout' }; break;
      case 'logout-confirm': S.auth = 'none'; S.sheet = null; toast('Odhlášeno. Na Macu nic nezmizelo; odesílání a synchronizace stojí.'); break;
      case 'set-identity': S.tab = 'identita'; S.detail = null; break;
      case 'sheet-close': S.sheet = null; break;
      case 'sheet-dismiss':
        if (!S.sheet) break;
        if (S.sheet.type === 'recovery') return;
        if (S.sheet.type === 'save') { act('save-local', {}); return; }
        S.sheet = null; break;
      case 'toast-action': {
        const ta = S.toast && S.toast.action; S.toast = null;
        if (!ta) break;
        if (ta.startsWith('open-rec:')) { act('open-detail', { kind: 'rec', id: ta.slice(9) }); return; }
        act(ta, {}); return;
      }
      default: return;
    }
    render();
  }

  function chooseProject(pid, desc) {
    const mode = S.switching ? 'switch' : 'start';
    S.draft = { projectId: pid, desc: desc != null && desc !== '' ? desc : lastDesc(pid), mode };
    S.cmd = ''; S.cmdIdx = 0; S.focus = 'draft-desc';
  }
  function pickResult(item) {
    if (item.kind === 'project') { chooseProject(item.id, item.desc); return; }
    S.cmd = '';
    if (item.id === 'rec') recStart();
    else if (item.id === 'day') openWindow('den');
    else if (item.id === 'recs') openWindow('nahravky');
    else if (item.id === 'settings') openWindow('nastaveni');
  }

  function applyEarlier() {
    const sh = S.sheet, w = S.work; if (!w) { S.sheet = null; return; }
    const minStart = earliestStart();
    let ns = null;
    if (sh.custom) { ns = parseTime(sh.custom); if (ns == null) { sh.err = 'Zadej čas jako 10:05.'; return; } }
    else if (sh.min) ns = w.start - sh.min * 60;
    if (ns == null) { sh.err = 'Vyber, o kolik dřív.'; return; }
    if (ns < minStart) { sh.err = `Nejdřív ${clock(minStart)} — tam končí předchozí úsek.`; return; }
    if (ns >= S.now) { sh.err = 'Začátek musí být před teď.'; return; }
    w.start = ns; S.sheet = null;
    toast(`Začátek posunut na ${clock(ns)}. Úsek má ${dur(S.now - ns)}.`);
  }
  function earliestStart() {
    const prev = todaySegs().filter(g => g.end <= (S.work ? S.work.start : S.now)).sort((a, b) => b.end - a.end)[0];
    return prev ? prev.end : t(6, 0);
  }

  function saveEdit() {
    const e = S.edit; const g = findSeg(e.id); if (!g) { S.edit = null; return; }
    const a = parseTime(e.from), b = parseTime(e.to);
    if (a == null || b == null) { e.err = 'Časy zadej jako 9:45.'; return; }
    if (b <= a) { e.err = 'Konec musí být po začátku.'; return; }
    if (b > S.now) { e.err = 'Konec nemůže být v budoucnosti.'; return; }
    const clash = todaySegs().find(x => x !== g && x.start < b && x.end > a) || (S.work && S.work.start < b);
    if (clash) { e.err = 'Úsek by se překrýval s jiným. Rozdělení a přesuny udělej na webu.'; return; }
    g.start = a; g.end = b; g.desc = e.desc.trim(); g.sync = 'pending'; S.edit = null;
    processQueue();
    toast('Úprava uložena na Macu a odesílá se do LuTracku.');
  }
  function saveAdd() {
    const e = S.add;
    const a = parseTime(e.from), b = parseTime(e.to);
    if (a == null || b == null) { e.err = 'Časy zadej jako 9:45.'; return; }
    if (b <= a) { e.err = 'Konec musí být po začátku.'; return; }
    if (b > S.now) { e.err = 'Konec nemůže být v budoucnosti.'; return; }
    const clash = todaySegs().find(x => x.start < b && x.end > a) || (S.work && S.work.start < b);
    if (clash) { e.err = 'V tomhle čase už je jiný úsek.'; return; }
    S.segments.push({ id: uid('s'), projectId: e.projectId, desc: e.desc.trim(), start: a, end: b, sync: 'pending', added: true });
    S.add = null; processQueue();
    toast(`Přidán úsek ${clock(a)}–${clock(b)}. Čeká na potvrzení serverem.`);
  }

  function simRestart() {
    S.simOpen = false;
    if (!S.work && !S.rec && !S.pending) { toast('Aplikace restartována. Nic neběželo, není co rozhodovat.'); return; }
    const lastSeen = S.now, restartAt = S.now + 25 * 60;
    if (S.rec) {
      const d = lastSeen - S.rec.start;
      S.recordings.push({ id: uid('r'), title: `Schůzka od ${clock(S.rec.start)} (obnoveno)`, start: S.rec.start, dur: d, size: sizeOf(d),
        target: S.rec.target, targetSource: S.rec.targetSource, state: 'local', error: null, owner: 'alex', recovered: true, log: { local: restartAt } });
      S.rec = null;
    }
    if (S.pending) finalizePending('local');
    S.recovery = S.work ? { projectId: S.work.projectId, desc: S.work.desc, start: S.work.start, lastSeen, restartAt, prevDay: false, choice: 'last', custom: clock(lastSeen), again: false, err: null } : null;
    S.work = null; S.draft = null; S.switching = false; S.now = restartAt; S.view = 'panel'; S.panelOpen = true;
    S.sheet = S.recovery ? { type: 'recovery' } : null;
    if (!S.recovery) toast('Po restartu je nahrávka bezpečně na Macu. O případném odeslání rozhodneš v přehledu. Žádný čas nevznikl.');
  }

  function confirmRecovery() {
    const rv = S.recovery; if (!rv) return;
    let end = null;
    if (rv.choice === 'last') end = rv.lastSeen;
    else if (rv.choice === 'custom') {
      end = parseTime(rv.custom);
      const max = rv.prevDay ? t(23, 59) : rv.restartAt;
      if (end == null || end <= rv.start || end > max) { rv.err = `Zadej čas mezi ${clock(rv.start)} a ${clock(max)}.`; return; }
    }
    if (end != null) {
      S.segments.push({ id: uid('s'), projectId: rv.projectId, desc: rv.desc, start: rv.start, end, sync: 'pending', prevDay: rv.prevDay });
    }
    const p = proj(rv.projectId);
    S.recovery = null; S.sheet = null;
    const again = document.getElementById('rv-again');
    if (again ? again.checked : rv.again) {
      S.work = { projectId: rv.projectId, desc: rv.desc, start: S.now };
    }
    processQueue();
    toast(end != null
      ? `${rv.prevDay ? 'Včerejší úsek' : 'Úsek'} ${p.name} ${clock(rv.start)}–${clock(end)} uložen (${dur(end - rv.start)}). ${S.auth === 'ok' ? 'Odesílá se.' : 'Čeká na přihlášení.'}`
      : 'Rozpracovaný úsek neuložen. Nic se nevykázalo.');
  }

  function finishOnboarding() {
    const o = S.onboarding;
    S.onboarding = null; S.auth = 'ok'; S.firstRun = true; S.focus = o.wantTime ? 'cmd' : null;
    if (!o.wantRec) { S.settings.mic = S.settings.mic === 'ok' ? 'ok' : 'ask'; }
    if (S.settings.sys === 'ask') S.settings.sys = 'denied';
  }

  // ---------- vyhledávání ----------
  function results() {
    const raw = S.cmd.trim(); if (!raw) return [];
    const words = raw.split(/\s+/);
    const toks = words.map(norm);
    const out = [];
    PROJECTS.forEach(p => {
      if (S.switching && S.work && S.work.projectId === p.id) return;
      const hay = norm(`${p.name} ${FIRMS[p.firm]}`).split(/\s+/);
      const matchedIdx = toks.map((tk, i) => (hay.some(w => w.startsWith(tk)) ? i : -1)).filter(i => i >= 0);
      if (!matchedIdx.length) return;
      const restIdx = toks.map((_, i) => i).filter(i => !matchedIdx.includes(i));
      let desc = '';
      if (restIdx.length) {
        const rest = restIdx.map(i => toks[i]);
        const known = p.descs.concat(S.segments.filter(g => g.projectId === p.id).map(g => g.desc))
          .find(dsc => rest.every(tk => norm(dsc).split(/\s+/).some(w => w.startsWith(tk))));
        desc = known || restIdx.map(i => words[i]).join(' ');
      }
      out.push({ kind: 'project', id: p.id, label: p.name, sub: FIRMS[p.firm], desc, score: matchedIdx.length });
    });
    out.sort((a, b) => b.score - a.score);
    if (!S.switching) {
      COMMANDS.forEach(c => {
        if (toks.some(tk => tk.length >= 2 && c.keys.some(k => k.startsWith(tk)))) out.push({ kind: 'command', id: c.id, label: c.label, sub: c.sub });
      });
    }
    return out.slice(0, 6);
  }
  function resultsHtml() {
    if (!S.cmd.trim()) return '';
    const rs = results();
    if (!rs.length) return `<p class="note cmd-empty">Nic nenalezeno. Projekty ti přiděluje vedoucí na webu.</p>`;
    if (S.cmdIdx >= rs.length) S.cmdIdx = 0;
    return `<ul class="results" role="listbox" id="cmd-list" aria-label="Výsledky">${rs.map((x, i) => `
      <li role="option" aria-selected="${i === S.cmdIdx}"><button type="button" class="result" data-action="cmd-pick" data-i="${i}" tabindex="-1">
        <span>${x.kind === 'project' ? I.work : I.bolt}</span>
        <span class="result-l">${esc(x.label)}${x.desc ? ` <span class="muted">· ${esc(x.desc)}</span>` : ''}</span>
        <span class="result-s">${esc(x.sub)}</span></button></li>`).join('')}</ul>`;
  }
  function updateResults() {
    const box = document.getElementById('cmd-results');
    if (box) box.innerHTML = resultsHtml();
    const extra = document.getElementById('idle-extras');
    if (extra) extra.hidden = !!S.cmd.trim();
    const inp = document.getElementById('cmd');
    if (inp) inp.setAttribute('aria-expanded', String(!!S.cmd.trim()));
  }

  // ---------- drobné komponenty ----------
  function chip(kind, text, title) {
    const ic = { live: I.dot, rec: I.dot, ok: I.check, pending: I.wait, queued: I.wait, err: I.alert, local: I.mac, sent: I.up, neutral: '' }[kind] || '';
    return `<span class="chip chip--${kind}"${title ? ` title="${esc(title)}"` : ''}>${ic}${esc(text)}</span>`;
  }
  function segChip(g, long) {
    if (g.live) return chip('live', 'Běží místně');
    if (g.sync === 'pending') return chip('pending', long ? 'Čeká na synchronizaci' : 'Čeká na sync', 'Uloženo na Macu, server ho ještě nepotvrdil');
    if (g.sync === 'failed') return chip('err', 'Vyžaduje zásah');
    return chip('ok', long ? 'Potvrzeno serverem' : 'Potvrzeno', 'LuTrack úsek přijal. Neznamená schválený výkaz.');
  }
  function recChip(r) {
    if (r.live) return chip('rec', 'Nahrává');
    if (r.unsaved) return chip('local', 'Na Macu · bez názvu');
    switch (r.state) {
      case 'local': return chip('local', 'Na Macu');
      case 'queued': return chip('queued', S.net ? 'Ve frontě' : 'Ve frontě · bez sítě');
      case 'uploading': return chip('queued', `Odesílá se ${r.progress || 0} %`);
      case 'sent': return chip('sent', 'Odesláno');
      case 'verified': return chip('ok', 'Ověřeno v LuDone');
      case 'failed': return chip('err', 'Vyžaduje zásah');
      default: return '';
    }
  }
  function failReason(r) {
    switch (r.error) {
      case 'login': return S.auth === 'ok' ? `Odeslání v ${clock(r.failedAt || r.start)} odmítnuto kvůli vypršelému přihlášení. Už jsi přihlášený — stačí odeslat znovu.` : 'Přihlášení vypršelo. Nahrávka je celá na Macu a počká.';
      case 'firm': return 'Chybí cílová firma. Bez ní se nahrávka neodešle; na Macu je v bezpečí.';
      case 'limit': return 'Server nahrávku odmítl kvůli velikosti. Celá zůstává na Macu.';
      case 'owner': return 'Server hlásí, že nahrávka patří jinému účtu LuDone. Odeslat ji můžeš až po převzetí.';
      default: return 'Něco se nepovedlo.';
    }
  }
  function firmSeg(action, value, opts) {
    const o = opts || {};
    const idAttr = o.id ? ` data-id="${esc(o.id)}"` : '';
    const opt = (f, label) => `<button type="button" role="radio" aria-checked="${value === f || (f === 'none' && !value)}" data-action="${action}" data-firm="${f}"${idAttr}${o.disabled ? ' disabled' : ''}>${esc(label)}</button>`;
    return `<div class="seg" role="radiogroup" aria-label="${esc(o.label || 'Cílová firma')}">${opt('sever', FIRMS.sever)}${opt('jih', FIRMS.jih)}${o.none ? opt('none', o.noneLabel || 'Nevybráno') : ''}</div>`;
  }

  // ---------- menu bar ----------
  function mbState() {
    return {
      work: !!S.work, rec: !!S.rec,
      attention: S.auth === 'expired' || !!S.recovery || !!(S.rec && S.rec.sys === 'lost'),
      dim: S.auth === 'none',
    };
  }
  function statusIcon(st, text) {
    // Monochromatický znak lišty používá přesnou geometrii bílých tahů z LuDone.svg.
    const glyph = `<svg class="mb-glyph${st.dim ? ' is-dim' : ''}" viewBox="0 0 1200 1200" aria-hidden="true"><g fill="currentColor"><rect x="363.43" y="479.05" width="615.7" height="103.05" transform="translate(-143.27 792.56) rotate(-56.15)"/><rect x="352.1" y="457.81" width="103.05" height="403.78" transform="translate(-369.09 627.47) rotate(-56.15)"/><rect x="618.07" y="771.07" width="403.78" height="103.05" transform="translate(-329.27 654.46) rotate(-36.77)"/></g>${st.rec ? '<circle cx="975" cy="975" r="160" fill="currentColor" stroke="var(--mb-solid)" stroke-width="90"/>' : ''}</svg>`;
    const time = text != null ? text : (st.work ? hm(S.now - S.work.start) : st.rec ? hm(S.now - S.rec.start) : '');
    const timeEl = time ? `<span${text == null ? ' data-clock="mb-time"' : ''}>${time}</span>` : '';
    const al = st.attention ? `<svg class="mb-alert" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.2 11.3 10.6H.7Z" fill="currentColor"/><path d="M6 4.6v2.9" stroke="var(--mb-solid)" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="9.1" r=".8" fill="var(--mb-solid)"/></svg>` : '';
    return glyph + timeEl + al;
  }
  function mbLabel(st) {
    const parts = [];
    if (st.dim) parts.push('nepřihlášeno');
    if (st.work) parts.push(`měří čas ${hm(S.now - S.work.start)}`);
    if (st.rec) parts.push('nahrává zvuk');
    if (st.attention) parts.push('vyžaduje pozornost');
    if (!parts.length) parts.push('nic neběží');
    return `LuDone: ${parts.join(', ')}`;
  }
  function menubar() {
    const st = mbState();
    const b = (a, l, dis) => `<button type="button" role="menuitem" data-action="${a}"${dis ? ' disabled' : ''}>${esc(l)}</button>`;
    const menu = !S.simOpen ? '' : `<div class="sim-menu" role="menu" aria-label="Simulace prostředí">
      <div class="sim-cap">Simulace prostředí — nic skutečného se nestane</div>
      ${S.net ? b('sim-net-off', 'Vypnout síť') : b('sim-net-on', 'Obnovit síť')}
      ${b('sim-restart', 'Restartovat aplikaci (Mac spal 25 min)')}
      ${b('sim-sys-lost', 'Odpojit systémový zvuk', !S.rec || S.rec.sys !== 'ok')}
      ${b('sim-auth', 'Nechat vypršet přihlášení', S.auth !== 'ok')}
      ${b('sim-limit', 'Server odmítne příští velikost')}
      ${b('sim-owner', 'Nahrávka patří jinému účtu')}
      ${b('sim-update', 'Nabídnout aktualizaci 0.1.5', !['none', 'later'].includes(S.update.stage))}
      ${b('sim-time', 'Posunout čas o 10 minut')}
    </div>`;
    return `<header class="mb">
      <div class="mb-left"><div class="sim"><button type="button" class="sim-btn" data-action="sim-toggle" aria-haspopup="menu" aria-expanded="${S.simOpen}">Návrh · simulace</button>${menu}</div></div>
      <div class="mb-right">
        <span class="mb-sys" role="img" aria-label="${S.net ? 'Wi-Fi připojeno' : 'Wi-Fi bez připojení'}">${S.net ? I.wifi : I.wifiOff}</span>
        <button type="button" class="mb-item" data-action="toggle-panel" aria-label="${esc(mbLabel(st))}" aria-expanded="${S.view === 'panel' && S.panelOpen}">${statusIcon(st)}</button>
        <span class="mb-clock" data-clock="mb-clock">${esc(S.day.short)}  ${clock(S.now)}</span>
      </div></header>`;
  }

  // ---------- panel ----------
  function panel() {
    if (S.onboarding) return `<section class="panel" data-action="noop" aria-label="LuDone — první spuštění">${onboarding()}${sheetHtml()}</section>`;
    const dual = S.work && S.rec;
    const running = S.work || S.rec;
    // živá činnost jde nahoru; samotné nahrávání nemá soutěžit s výběrem projektu
    const lanes = S.rec && !S.work ? laneSound() + laneWork() : laneWork() + laneSound();
    return `<section class="panel${dual ? ' is-dual' : ''}" data-action="noop" aria-label="LuDone panel">
      <header class="p-head">
        <span class="brand">${I.brand}<span>LuDone</span></span><span class="p-date">${esc(S.day.short)}</span>
        <span class="spacer"></span>
        <button type="button" class="btn btn--ghost btn--sm" data-action="open-window" data-tab="den" title="Otevřít dnešek v okně">${I.win}Den</button>
        <button type="button" class="icon-btn" data-action="open-window" data-tab="nahravky" aria-label="Nahrávky na tomto Macu" title="Nahrávky na tomto Macu">${I.wave}</button>
        <button type="button" class="icon-btn" data-action="open-window" data-tab="nastaveni" aria-label="Nastavení" title="Nastavení">${I.gear}</button>
      </header>
      ${S.net ? '' : `<div class="band band--offline" role="status">${I.wifiOff}<span><b>Bez sítě od ${clock(S.netSince)}.</b> Měření i nahrávání běží a ukládá se na Mac. Synchronizace a odeslání počkají.</span></div>`}
      <div class="p-scroll" data-scroll="panel">
        ${S.result ? resultCard() : ''}
        ${running || S.auth === 'ok' ? lanes + needs() : needs() + lanes}
        ${today()}
      </div>
      ${updStrip()}
      ${pFoot()}
      ${sheetHtml()}
    </section>`;
  }

  function laneWork() {
    if (S.work && !S.switching && !(S.draft && S.draft.mode === 'switch')) return workLive();
    if (S.work) return workSwitch();
    return workIdle();
  }

  function cmdBox(ph) {
    return `<div class="cmd">${I.search}<input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="${esc(ph)}"
      aria-label="Najít projekt nebo akci" role="combobox" aria-autocomplete="list" aria-controls="cmd-results" aria-expanded="${!!S.cmd.trim()}" value="${esc(S.cmd)}"><kbd aria-hidden="true">/</kbd></div>
      <div id="cmd-results">${resultsHtml()}</div>`;
  }

  function recentList(excludeId) {
    const ids = S.recent.filter(id => id !== excludeId);
    return `<div class="mini-head">Přidělené projekty</div>${ids.map((id, i) => {
      const p = proj(id);
      return `<button type="button" class="recent-row" data-action="recent" data-id="${id}"><span>${esc(p.name)}</span><span class="muted">${esc(FIRMS[p.firm])}</span><kbd aria-label="klávesa ${i + 1}">${i + 1}</kbd></button>`;
    }).join('')}`;
  }

  function workIdle() {
    const last = lastSegment();
    const signedOut = S.auth === 'none';
    let body;
    if (S.draft) body = draftBox();
    else {
      const resume = last ? `<button type="button" class="resume" data-action="resume">
          <span class="resume-k">Pokračovat</span>
          <span class="resume-t"><strong>${esc(proj(last.projectId).name)}</strong>${last.desc ? ` · ${esc(last.desc)}` : ''}</span>
          <span class="resume-meta">skončeno ${clock(last.end)}</span></button>` : '';
      const hint = S.firstRun ? `<div class="firstrun">Máš přidělené 3 projekty. Napiš část názvu a klidně i popis, třeba <b>sever příprava</b>. Napiš <b>nahr</b> a spustíš nahrávání.</div>` : '';
      body = cmdBox('Projekt a co děláš…') + `<div id="idle-extras"${S.cmd.trim() ? ' hidden' : ''}>${hint}${resume}${S.rec ? '' : recentList()}</div>`;
    }
    return `<section class="lane lane--work" aria-labelledby="lw">
      <div class="lane-head"><span id="lw">${I.work}Práce</span><span class="lane-state">${signedOut ? 'měří se jen na Macu, dokud se nepřihlásíš' : 'nic neběží'}</span></div>
      ${body}
    </section>`;
  }

  function draftBox() {
    const d = S.draft, p = proj(d.projectId), sw = d.mode === 'switch';
    const descs = Array.from(new Set(p.descs.concat(S.segments.filter(g => g.projectId === p.id).map(g => g.desc)).filter(Boolean)))
      .filter(x => x !== d.desc);
    let cons = '';
    if (sw && S.work) {
      const cur = proj(S.work.projectId);
      cons = `<p class="note">Úsek <b>${esc(cur.name)}${S.work.desc ? ` · ${esc(S.work.desc)}` : ''}</b> se uzavře (${dur(S.now - S.work.start)}) a uloží s popisem. Nový začne teď.${S.rec ? ` Nahrávka běží dál${S.rec.target ? ` a dál míří do ${FIRMS[S.rec.target]}` : ''}.` : ''}</p>`;
    }
    return `<div class="draft">
      <div class="draft-proj"><div><div class="proj-name">${esc(p.name)}</div><div class="proj-firm">${esc(FIRMS[p.firm])}${p.alloc ? ` · alokace: zbývá ${p.alloc}` : ''}</div></div>
        <button type="button" class="linkbtn" data-action="draft-clear">Jiný projekt</button></div>
      <label class="field"><span class="field-l">Co přesně děláš</span><input id="draft-desc" class="input" type="text" autocomplete="off" value="${esc(d.desc)}" placeholder="Krátký popis (nepovinné)"></label>
      ${descs.length ? `<div class="chips">${descs.map(x => `<button type="button" class="chipbtn" data-action="desc-chip" data-desc="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
      ${cons}
      <div class="actions"><button type="button" class="btn btn--primary btn--wide" data-action="start">${sw ? 'Přepnout teď' : 'Začít měřit'} <kbd>↩</kbd></button>
        ${sw ? '<button type="button" class="btn" data-action="switch-cancel">Zrušit</button>' : ''}</div>
    </div>`;
  }

  function workLive() {
    const w = S.work, p = proj(w.projectId);
    return `<section class="lane lane--work is-live" aria-labelledby="lw">
      <div class="lane-head"><span id="lw">${I.work}Práce</span>${chip('live', S.net ? 'Běží místně' : 'Běží místně · bez sítě')}</div>
      <div class="live-grid">
        <div><div class="proj-name">${esc(p.name)}</div><div class="proj-firm">${esc(FIRMS[p.firm])}</div></div>
        <div class="bigclock" data-clock="work" role="timer" aria-label="Uběhlý čas práce">${hms(S.now - w.start)}</div>
      </div>
      <input id="work-desc" class="desc-input" type="text" autocomplete="off" value="${esc(w.desc)}" placeholder="Doplň, co děláš" aria-label="Popis běžící práce">
      <div class="lane-meta"><span>od ${clock(w.start)}</span><button type="button" class="linkbtn" data-action="earlier-open">Začal jsem dřív</button>${p.alloc ? `<span>alokace: zbývá ${p.alloc}</span>` : ''}</div>
      <div class="actions">
        <button type="button" class="btn" data-action="switch-open">Přepnout práci <kbd>P</kbd></button>
        <button type="button" class="btn btn--primary" data-action="stop-work">${I.stop}Zastavit čas</button>
      </div>
    </section>`;
  }

  function workSwitch() {
    const w = S.work, p = proj(w.projectId);
    return `<section class="lane lane--work is-live" aria-labelledby="lw">
      <div class="lane-head"><span id="lw">${I.work}Práce</span>${chip('live', 'Běží místně')}<span class="lane-state">přepínáš</span></div>
      <div class="live-mini"><span><b>${esc(p.name)}</b>${w.desc ? ` · ${esc(w.desc)}` : ''}</span><span class="tnum" data-clock="work">${hms(S.now - w.start)}</span></div>
      ${S.draft ? draftBox() : `${cmdBox('Na co přepnout…')}<div id="idle-extras"${S.cmd.trim() ? ' hidden' : ''}>${recentList(w.projectId)}</div>
        <div class="actions"><button type="button" class="btn btn--sm" data-action="switch-cancel">Zrušit</button></div>`}
    </section>`;
  }

  function srcLine(label, st, fix) {
    if (st === 'ok') return `<span class="src is-ok">${I.check}${label}</span>`;
    return `<span class="src is-bad">${I.alert}${label}: chybí oprávnění · <button type="button" class="linkbtn" data-action="${fix}">${fix === 'fix-mic' ? 'Povolit' : 'Opravit'}</button></span>`;
  }

  function laneSound() {
    if (!S.rec) {
      const micOk = S.settings.mic === 'ok';
      let hint;
      if (S.settings.target === 'sever' || S.settings.target === 'jih') hint = `Nevytvoří čas. Cíl: <b>${FIRMS[S.settings.target]}</b> (výchozí z Nastavení), před odesláním ho uvidíš.`;
      else if (S.work && S.settings.target === 'suggest') hint = `Nevytvoří čas. Cíl navrhnu podle práce — <b>${FIRMS[proj(S.work.projectId).firm]}</b> — a potvrdíš ho po skončení.`;
      else hint = 'Nevytvoří čas. Firmu vybereš po skončení, nebo nahrávku necháš jen na Macu.';
      return `<section class="lane lane--sound" aria-labelledby="ls">
        <div class="lane-head"><span id="ls">${I.wave}Zvuk</span><span class="lane-state">${micOk ? 'připraveno' : 'nepřipraveno'}</span></div>
        <div class="sound-idle">
          <button type="button" class="btn btn--rec" data-action="rec-start"${micOk ? '' : ' disabled aria-describedby="src-mic"'}><span class="dot" aria-hidden="true"></span>Nahrát schůzku <kbd>R</kbd></button>
          <div class="sources" id="src-mic">${srcLine('Mikrofon', S.settings.mic, 'fix-mic')}${srcLine('Systémový zvuk', S.settings.sys, 'fix-sys')}</div>
        </div>
        <p class="note">${hint}</p>
      </section>`;
    }
    const r = S.rec;
    const srcTxt = r.targetSource === 'work' ? 'navrženo podle práce' : r.targetSource === 'default' ? 'výchozí z Nastavení' : r.target ? 'vybráno ručně' : 'rozhodneš po skončení';
    let notice = '';
    if (r.notice && !r.notice.same) {
      notice = `<div class="callout callout--info" role="status"><b>Práce teď patří k ${esc(FIRMS[r.notice.to])}.</b> Nahrávka dál míří ${r.notice.from ? `do ${esc(FIRMS[r.notice.from])}` : 'bez cíle'} — nic se nepřesunulo ani neodeslalo.
        <div class="actions"><button type="button" class="btn btn--sm" data-action="notice-keep">${r.notice.from ? `Ponechat ${esc(FIRMS[r.notice.from])}` : 'Nechat bez cíle'}</button><button type="button" class="btn btn--sm btn--ghost" data-action="notice-change">Změnit na ${esc(FIRMS[r.notice.to])}</button></div></div>`;
    } else if (r.notice && r.notice.same) {
      notice = `<div class="callout callout--info" role="status">Práci jsi přepnul na ${esc(r.notice.project)}. Nahrávka pokračuje beze změny${r.target ? `, cíl ${esc(FIRMS[r.target])}` : ''}. <button type="button" class="linkbtn" data-action="notice-keep">Rozumím</button></div>`;
    }
    const lost = r.sys === 'lost' ? `<div class="callout callout--warn" role="alert"><b>Systémový zvuk se odpojil v ${clock(r.lostAt)}.</b> Mikrofon nahrává dál, nic nezmizelo.
      <div class="actions"><button type="button" class="btn btn--sm" data-action="sys-retry">Znovu připojit</button><button type="button" class="btn btn--sm btn--ghost" data-action="sys-mic-only">Pokračovat jen s mikrofonem</button></div></div>` : '';
    const linked = S.work ? `Během práce ${esc(proj(S.work.projectId).name)} — čas běží dál sám.` : 'Žádný čas neběží a žádný nevznikne.';
    return `<section class="lane lane--sound is-live" aria-labelledby="ls">
      <div class="lane-head"><span id="ls">${I.wave}Zvuk</span>${chip('rec', 'Nahrává')}${S.net ? '' : '<span class="lane-state">ukládá se na Mac</span>'}</div>
      <div class="live-grid">
        <div><div class="proj-name">Schůzka od ${clock(r.start)}</div><div class="proj-firm">název doplníš po skončení</div></div>
        <div class="bigclock" data-clock="rec" role="timer" aria-label="Délka nahrávky">${ms(S.now - r.start)}</div>
      </div>
      <div class="meters" aria-label="Úroveň zdrojů">
        <span>Mikrofon</span><span class="meter" data-meter="mic"><i></i></span>
        <span>Systém</span><span class="meter${r.sys !== 'ok' ? ' is-off' : ''}" data-meter="sys"><i></i></span>
        ${r.sys === 'off' ? '<span class="meter-note muted">jen mikrofon</span>' : ''}
      </div>
      ${lost}${notice}
      <div class="rec-target"><span class="rec-target-l">Kam ji pak poslat: <b>${r.target ? esc(FIRMS[r.target]) : 'nevybráno'}</b> · ${srcTxt}</span>
        ${firmSeg('rec-target', r.target, { none: true, label: 'Cílová firma nahrávky' })}</div>
      <div class="actions"><button type="button" class="btn btn--primary" data-action="rec-stop">${I.stop}Ukončit nahrávání <kbd>R</kbd></button></div>
      <p class="note">${linked} Nic se neodešle bez tvého potvrzení.</p>
    </section>`;
  }

  function needs() {
    const items = [];
    if (S.auth === 'expired') {
      items.push(S.login === 'waiting'
        ? `<div class="need need--warn"><span class="need-ic">${I.wait}</span><div class="need-body"><div class="need-title"><span class="spinner" aria-hidden="true"></span>Dokonči přihlášení v prohlížeči</div><p class="note">Po přihlášení se vrátíš sem. Nic dalšího se samo nestane.</p><div class="actions"><button type="button" class="btn btn--sm btn--ghost" data-action="login-cancel">Zrušit</button></div></div></div>`
        : `<div class="need need--err"><span class="need-ic">${I.alert}</span><div class="need-body"><div class="need-title">Přihlášení vypršelo</div><p class="note">Na Macu je vše uložené. Synchronizace času a odesílání počkají.</p><div class="actions"><button type="button" class="btn btn--sm btn--primary" data-action="login-start">Přihlásit znovu</button></div></div></div>`);
    }
    S.recordings.filter(r => r.state === 'failed').forEach(r => {
      let ctrl = '';
      if (r.error === 'firm') {
        ctrl = `${firmSeg('need-firm', r.pick || null, { id: r.id, label: `Firma pro ${r.title}` })}
          <div class="actions">${r.pick ? `<button type="button" class="btn btn--sm btn--primary" data-action="need-send" data-id="${r.id}"${S.auth === 'ok' ? '' : ' disabled'}>Odeslat do ${esc(FIRMS[r.pick])}</button>` : ''}
          <button type="button" class="btn btn--sm btn--ghost" data-action="need-local" data-id="${r.id}">Nechat na Macu</button></div>
          ${r.pick && S.auth !== 'ok' ? '<p class="note">Odeslat půjde po přihlášení.</p>' : ''}`;
      } else if (r.error === 'login') {
        ctrl = S.auth === 'ok'
          ? `<div class="actions"><button type="button" class="btn btn--sm btn--primary" data-action="need-retry" data-id="${r.id}">Odeslat do ${esc(FIRMS[r.target])}</button><button type="button" class="btn btn--sm btn--ghost" data-action="need-local" data-id="${r.id}">Nechat na Macu</button></div>`
          : '';
      } else if (r.error === 'limit') {
        ctrl = `<div class="actions"><button type="button" class="btn btn--sm" data-action="need-retry" data-id="${r.id}">Zkusit znovu</button><button type="button" class="btn btn--sm btn--ghost" data-action="set-export">Exportovat diagnostiku</button></div>`;
      } else if (r.error === 'owner') {
        ctrl = `<div class="actions"><button type="button" class="btn btn--sm" data-action="owner-open" data-id="${r.id}">Převzít jako Alex Novák…</button></div>`;
      }
      items.push(`<div class="need need--${r.error === 'login' && S.auth === 'ok' ? 'warn' : 'err'}"><span class="need-ic">${I.alert}</span><div class="need-body">
        <div class="need-title"><button type="button" class="linkbtn" data-action="open-detail" data-kind="rec" data-id="${r.id}">${esc(r.title)}</button> <span class="muted tnum" style="font-weight:400">· ${ms(r.dur)} · ${mb(r.size)}</span></div>
        <p class="note">${esc(failReason(r))}</p>${ctrl}</div></div>`);
    });
    if (!items.length) return '';
    return `<section class="needs" aria-labelledby="nd"><div class="sec-head"><h2 id="nd" class="sec-title">Čeká na tebe</h2><span class="sec-sub">${items.length}</span></div>${items.join('')}</section>`;
  }

  function rowHtml(it) {
    if (it.kind === 'seg') {
      const g = it.o, p = proj(g.projectId);
      return `<li><button type="button" class="row" data-action="open-detail" data-kind="seg" data-id="${g.id}">
        <span class="row-ic${g.live ? ' is-live-work' : ''}">${I.work}</span>
        <span class="row-title">${esc(p.name)}</span>
        <span class="row-right"><span>${clock(g.start)}–${g.live ? 'teď' : clock(g.end)}</span>${segChip(g)}</span>
        <span class="row-sub">${esc(g.desc || 'bez popisu')} · ${g.live ? `<span data-clock="work-dur">${dur(S.now - g.start)}</span>` : dur(g.end - g.start)}${g.added ? ' · doplněno' : ''}</span></button></li>`;
    }
    const r = it.o;
    const title = r.live ? 'Nahrávání' : r.title;
    const linked = overlapSegs(r).length ? ' · při práci' : ' · bez práce';
    const sub = r.live ? `běží · ${r.target ? FIRMS[r.target] : 'cíl nevybrán'}` : `${ms(r.dur)} · ${r.target ? FIRMS[r.target] : 'bez firmy'}${linked}`;
    return `<li><button type="button" class="row" data-action="open-detail" data-kind="rec" data-id="${r.id}">
      <span class="row-ic${r.live ? ' is-live-rec' : ''}">${I.wave}</span>
      <span class="row-title">${esc(title)}</span>
      <span class="row-right"><span>${r.prevDay ? 'včera ' : ''}${clock(r.start)}</span>${recChip(r)}</span>
      <span class="row-sub">${esc(sub)}</span></button></li>`;
  }
  function dayItems(order) {
    const list = daySegs().map(o => ({ kind: 'seg', o, start: o.start })).concat(dayRecs().map(o => ({ kind: 'rec', o, start: o.start })));
    list.sort((a, b) => order === 'asc' ? a.start - b.start : b.start - a.start);
    return list;
  }

  function today() {
    const items = dayItems('desc');
    const nRec = dayRecs().length;
    return `<section class="today" aria-labelledby="td">
      <div class="sec-head"><h2 id="td" class="sec-title">Dnes</h2><span class="sec-sub">práce <span data-clock="total">${dur(totalWork())}</span> · schůzky ${nRec}</span><span class="spacer"></span>
        <button type="button" class="linkbtn" data-action="open-window" data-tab="den">Celý den</button></div>
      ${items.length ? ribbon('compact') + `<ul class="rows">${items.slice(0, 5).map(rowHtml).join('')}</ul>` +
        (items.length > 5 ? `<button type="button" class="linkbtn more" data-action="open-window" data-tab="den">+ ${items.length - 5} další v přehledu dne</button>` : '')
        : '<p class="empty">Zatím nic. Jakmile začneš měřit nebo nahrávat, uvidíš tady stopu dne.</p>'}
    </section>`;
  }

  function ribbon(size) {
    const large = size === 'large';
    const from = t(7, 0);
    const to = large ? Math.max(t(15, 0), Math.ceil((S.now + 5400) / 3600) * 3600) : Math.max(t(13, 0), Math.ceil((S.now + 1800) / 3600) * 3600);
    const span = to - from;
    const P = x => (Math.max(from, Math.min(to, x)) - from) / span * 100;
    const segEls = daySegs().map(g => {
      const l = P(g.start), w = Math.max(P(g.end) - l, 0.7);
      const cls = g.live ? 'is-live' : g.sync === 'pending' ? 'is-pending' : '';
      const lab = `${proj(g.projectId).name}, ${clock(g.start)}–${g.live ? 'teď' : clock(g.end)}`;
      return large
        ? `<button type="button" class="rb-seg ${cls}" style="left:${l}%;width:${w}%" data-action="open-detail" data-kind="seg" data-id="${g.id}" aria-label="${esc(lab)}" title="${esc(lab)}">${w > 8 ? esc(proj(g.projectId).name) : ''}</button>`
        : `<span class="rb-seg ${cls}" style="left:${l}%;width:${w}%"></span>`;
    }).join('');
    const recEls = dayRecs().map(r => {
      const end = r.live ? S.now : recEnd(r);
      const l = P(r.start), w = Math.max(P(end) - l, 0.7);
      const cls = r.live ? 'is-live' : r.unsaved || r.state === 'local' ? 'is-local' : r.state === 'failed' ? 'is-err' : (r.state === 'queued' || r.state === 'uploading') ? 'is-queued' : '';
      const lab = `${r.live ? 'Nahrávání' : r.title}, ${clock(r.start)}`;
      return large && !r.live && !r.unsaved
        ? `<button type="button" class="rb-rec ${cls}" style="left:${l}%;width:${w}%" data-action="open-detail" data-kind="rec" data-id="${r.id}" aria-label="${esc(lab)}" title="${esc(lab)}">${w > 8 ? esc(r.title) : ''}</button>`
        : `<span class="rb-rec ${cls}" style="left:${l}%;width:${w}%" title="${esc(lab)}"></span>`;
    }).join('');
    const nowL = P(S.now);
    const hours = [];
    for (let h = 7; h * 3600 <= to; h++) hours.push(`<span style="left:${P(h * 3600)}%">${h}</span>`);
    return `<div class="rb${large ? ' rb--large' : ''}"${large ? ' role="group" aria-label="Stopa dne: práce a zvuk"' : ' aria-hidden="true"'}>
      <span class="rb-l">Práce</span><div class="rb-track">${segEls}<span class="rb-now" style="left:${nowL}%"></span></div>
      <span class="rb-l">Zvuk</span><div class="rb-track">${recEls}<span class="rb-now" style="left:${nowL}%"></span></div>
      <span></span><div class="rb-hours">${hours.join('')}</div>
    </div>`;
  }

  function resultCard() {
    const g = findSeg(S.result.segId);
    if (!g) return '';
    const recs = S.result.recIds.map(findRec).filter(Boolean);
    const p = proj(g.projectId);
    const segTxt = g.sync === 'confirmed' ? 'čas potvrdil server (schvaluje se na webu)' : 'čas je na Macu a čeká na potvrzení serverem';
    const recTxt = recs.map(r => r.state === 'verified' ? `„${r.title}" je ověřená v LuDone` : r.state === 'local' ? `„${r.title}" zůstává na Macu` : r.state === 'failed' ? `„${r.title}" potřebuje tvůj krok` : `„${r.title}" se odesílá`).join('; ');
    const web = recs.find(r => r.state === 'verified');
    return `<section class="result-card" aria-labelledby="rs">
      <div class="sec-head"><h2 id="rs" class="sec-title">Hotovo ${clock(g.start)}–${clock(g.end)}</h2><span class="spacer"></span><button type="button" class="icon-btn" data-action="result-close" aria-label="Zavřít souhrn">${I.x}</button></div>
      <ul class="rows">${rowHtml({ kind: 'seg', o: g })}${recs.map(r => rowHtml({ kind: 'rec', o: r })).join('')}</ul>
      <p class="note">Výsledek: ${segTxt}; ${recTxt}.</p>
      <div class="actions"><button type="button" class="btn btn--sm" data-action="resume">Pokračovat v ${esc(p.name)}</button>
        ${web ? `<button type="button" class="btn btn--sm btn--ghost" data-action="det-web" data-id="${web.id}">Přepis na webu ${I.ext}</button>` : ''}</div>
    </section>`;
  }

  function updStrip() {
    const u = S.update;
    if (u.stage === 'offered') return `<div class="upd" role="status"><span class="upd-t"><b>Nová verze 0.1.5</b> · Práce a schůzky na jednom místě</span><button type="button" class="btn btn--sm" data-action="upd-details">Podrobnosti</button></div>`;
    if (u.stage === 'downloading') return `<div class="upd" role="status"><span class="upd-t">Připravuji 0.1.5… nic nepřerušuji<div class="upd-bar"><i style="width:${u.progress}%"></i></div></span></div>`;
    if (u.stage === 'ready') {
      const busy = busyList();
      return busy.length
        ? `<div class="upd" role="status"><span class="upd-t"><b>0.1.5 je připravená.</b> Restart nabídnu, až skončí ${busy.join(', ')} a vše bude uložené.</span></div>`
        : `<div class="upd" role="status"><span class="upd-t"><b>0.1.5 je připravená.</b> Nic neběží — můžeš ji nainstalovat.</span><button type="button" class="btn btn--sm btn--primary" data-action="upd-install">Aktualizovat a restartovat</button></div>`;
    }
    if (u.stage === 'installing') return `<div class="upd" role="status"><span class="upd-t"><span class="spinner" aria-hidden="true"></span>Instaluji 0.1.5 a restartuji…</span></div>`;
    return '';
  }

  function pFoot() {
    const nSeg = S.segments.filter(g => g.sync === 'pending').length;
    const nQ = S.recordings.filter(r => r.state === 'queued' || r.state === 'uploading').length;
    let line;
    if (!S.net && !(nSeg + nQ)) line = `<span class="sync-ic is-warn">${I.wait}</span>Bez sítě · vše se ukládá na Mac`;
    else if (!S.net) line = `<span class="sync-ic is-warn">${I.wait}</span>Bez sítě · ${nSeg + nQ} ${nSeg + nQ === 1 ? 'položka čeká' : nSeg + nQ > 1 && nSeg + nQ < 5 ? 'položky čekají' : 'položek čeká'} na Macu`;
    else if (S.auth === 'expired') line = `<span class="sync-ic is-err">${I.alert}</span>Synchronizace stojí — přihlášení`;
    else if (S.auth === 'none') line = `<span class="sync-ic is-warn">${I.wait}</span>Nepřihlášeno · vše zůstává na Macu`;
    else if (nSeg || nQ) line = `<span class="sync-ic is-warn">${I.wait}</span>${nSeg ? `${nSeg} úsek čeká na sync` : ''}${nSeg && nQ ? ' · ' : ''}${nQ ? `${nQ} nahrávka se odesílá` : ''}`;
    else line = `<span class="sync-ic is-ok">${I.check}</span>Čas potvrzen serverem`;
    return `<footer class="p-foot">${line}<span class="spacer"></span><button type="button" class="linkbtn" data-action="open-window" data-tab="nastaveni" title="O aplikaci">LuDone ${S.update.version}</button></footer>`;
  }

  // ---------- listy ----------
  function sheetHtml() {
    if (!S.sheet) return '';
    let inner = '';
    const sh = S.sheet;
    if (sh.type === 'save' && S.pending) {
      const p = S.pending;
      const firm = p.target ? FIRMS[p.target] : null;
      const w = S.work;
      let send;
      if (!firm) send = 'Pro odeslání vyber firmu';
      else if (S.auth !== 'ok') send = 'Odeslat půjde po přihlášení';
      else if (!S.net) send = `Uložit a zařadit do fronty · ${firm}`;
      else send = `Uložit a odeslat do ${firm}`;
      const srcNote = p.targetSource === 'work' && w ? `Navrženo podle práce ${esc(proj(w.projectId).name)}. Projekt v LuTracku se tím nemění.`
        : p.targetSource === 'work' ? 'Navrženo podle práce, která během schůzky běžela.' : p.targetSource === 'default' ? 'Výchozí firma z Nastavení.' : firm ? 'Vybráno ručně.' : 'Bez firmy ji lze nechat jen na Macu.';
      const gapTxt = p.gaps && p.gaps.length ? ` · systémový zvuk chybí ${p.gaps.map(gp => `${clock(gp[0])}–${gp[1] ? clock(gp[1]) : 'konec'}`).join(', ')}` : '';
      inner = `<h2 id="sh-t">Pojmenuj nahrávku</h2>
        <p class="sheet-meta">${chip('local', 'Uloženo na Macu')}<span class="tnum">${ms(p.dur)} · ${mb(p.size)}</span><span>${p.sysOff ? 'jen mikrofon' : 'mikrofon + systémový zvuk v jednom souboru'}${gapTxt}</span></p>
        <label class="field"><span class="field-l">Název</span><input id="save-title" class="input" type="text" autocomplete="off" value="${esc(p.title)}" placeholder="Schůzka ${clock(p.start)}"></label>
        <div class="chips"><span class="note" style="margin:0;align-self:center">Dříve použité:</span>${KNOWN_TITLES.map(x => `<button type="button" class="chipbtn" data-action="title-chip" data-title="${esc(x)}" aria-pressed="${p.title === x}">${esc(x)}</button>`).join('')}</div>
        <div class="field"><span class="field-l">Kam odeslat</span>${firmSeg('save-target', p.target, { none: true, noneLabel: 'Jen na Mac' })}<span class="note" style="margin-top:0">${srcNote}</span></div>
        ${S.auth !== 'ok' ? `<div class="callout callout--err"><b>${S.auth === 'none' ? 'Nejsi přihlášený.' : 'Přihlášení vypršelo.'}</b> ${S.login === 'waiting' ? '<span class="spinner" aria-hidden="true"></span>Čekám na prohlížeč…' : `<div class="actions"><button type="button" class="btn btn--sm" data-action="login-start">Přihlásit znovu</button></div>`}</div>` : ''}
        <div class="actions actions--stack">
          <button type="button" class="btn btn--primary" data-action="save-send"${firm && S.auth === 'ok' ? '' : ' disabled'}>${esc(send)}</button>
          <button type="button" class="btn" data-action="save-local">Nechat na Macu</button>
        </div>
        <p class="note">${w ? `Čas <b>${esc(proj(w.projectId).name)}</b> běží dál — tahle volba ho nezmění.` : 'Žádný čas se nevytvoří.'} Zavřením listu nahrávka zůstane na Macu.</p>`;
    } else if (sh.type === 'earlier' && S.work) {
      const w = S.work, p = proj(w.projectId), minS = earliestStart();
      const opts = [5, 15, 30].filter(m => w.start - m * 60 >= minS);
      inner = `<h2 id="sh-t">Začal jsem dřív</h2>
        <p class="note">Posune začátek běžícího úseku <b>${esc(p.name)}</b> (teď od ${clock(w.start)}). Nejdřív lze ${clock(minS)}, kde končí předchozí úsek. Starší dny a cizí úseky se opravují na webu.</p>
        <div class="chips">${opts.map(m => `<button type="button" class="chipbtn" data-action="earlier-pick" data-min="${m}" aria-pressed="${sh.min === m}">−${m} min · od ${clock(w.start - m * 60)}</button>`).join('') || '<span class="note">Kratší posun nejde — předchozí úsek končí těsně před.</span>'}</div>
        <label class="field"><span class="field-l">Nebo přesně od</span><input id="earlier-custom" class="input input--time" type="text" inputmode="numeric" value="${esc(sh.custom)}" placeholder="${clock(minS)}"></label>
        ${sh.err ? `<p class="err-text" role="alert">${esc(sh.err)}</p>` : ''}
        <div class="actions"><button type="button" class="btn btn--primary" data-action="earlier-apply">Použít</button><button type="button" class="btn" data-action="sheet-close">Zrušit</button></div>`;
    } else if (sh.type === 'trash') {
      const r = findRec(sh.id);
      if (!r) { S.sheet = null; return ''; }
      const only = !['sent', 'verified'].includes(r.state);
      inner = `<h2 id="sh-t">Přesunout „${esc(r.title)}" do Koše?</h2>
        <p class="note tnum">${ms(r.dur)} · ${mb(r.size)} · pořízeno ${clock(r.start)}</p>
        <div class="callout ${only ? 'callout--warn' : ''}">${only ? '<b>Tohle je jediná kopie.</b> V LuDone není.' : 'Kopie v LuDone zůstane. Smaže se jen soubor na tomto Macu.'}</div>
        <p class="note">Z Koše macOS ji půjde vrátit, dokud ho nevysypeš.</p>
        <div class="actions"><button type="button" class="btn btn--danger" data-action="trash-confirm">Přesunout „${esc(r.title)}" do Koše</button><button type="button" class="btn" data-action="sheet-close">Zrušit</button></div>`;
    } else if (sh.type === 'owner') {
      const r = findRec(sh.id);
      if (!r) { S.sheet = null; return ''; }
